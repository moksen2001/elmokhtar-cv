<style>
:root{
  --bg:#0F1B2D;--bg2:#0A1321;--bg3:#13223A;--card:#16253D;--card2:#1B2D49;--line:#24385A;--line2:rgba(201,169,106,.32);
  --gold:#C9A96A;--gold2:#D4B36F;--gold3:#E8D3A2;--golds:rgba(201,169,106,.12);
  --ink:#EFE9DD;--ink2:#C9CFDA;--mut:#8E9AB0;--mut2:#66748B;
  --ivory:#F7F2E8;--ivory2:#ECE4D4;--ivline:#E0D6C3;--navy:#13223A;--nmut:#6B7385;
  --ok:#62C08F;--err:#E8816F;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sb:46px;--bh:44px;--tabh:84px;
  --ease:cubic-bezier(.22,.9,.24,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#08111D;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 600px at 30% 10%,rgba(201,169,106,.10),transparent 60%),radial-gradient(700px 500px at 85% 90%,rgba(40,70,120,.35),transparent 60%)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;flex:none;display:block}

/* ===== page shell ===== */
.banner{position:sticky;top:0;z-index:60;height:var(--bh);display:flex;align-items:center;gap:16px;padding:0 22px;background:rgba(8,15,26,.92);backdrop-filter:blur(8px);border-bottom:1px solid #1B2A42;color:#BFC7D4;font-size:13px}
.banner a{color:var(--gold3);font-weight:700;text-decoration:none;white-space:nowrap}
.banner a:hover{text-decoration:underline}
.banner .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner .txt b{color:#fff;font-weight:700}
.banner .short{display:none}
.banner .lng{border:1px solid #2A3D5C;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;color:#DCE3EE;white-space:nowrap}
.stage{position:relative;min-height:calc(100vh - var(--bh));display:flex;align-items:flex-start;justify-content:center;gap:56px;padding:22px 24px 30px}

/* ===== phone ===== */
.phone{position:sticky;top:calc(var(--bh) + 22px);flex:none;width:392px;height:clamp(640px,calc(100vh - var(--bh) - 50px),846px);padding:10px;border-radius:56px;background:linear-gradient(145deg,#2B3A52,#0B111B 40%,#1E2A3D);box-shadow:0 0 0 1px #33445F inset,0 40px 90px -30px rgba(0,0,0,.8),0 10px 30px rgba(0,0,0,.35)}
.phone::before{content:"";position:absolute;right:-3px;top:170px;width:3px;height:74px;border-radius:0 3px 3px 0;background:#26344A}
.app{position:relative;width:100%;height:100%;overflow:hidden;border-radius:46px;background:var(--bg);font-size:14px;line-height:1.45;color:var(--ink);isolation:isolate}
.sbar{position:absolute;top:0;left:0;right:0;height:var(--sb);z-index:40;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 36px;font-weight:700;font-size:14px;color:#fff;pointer-events:none;transition:color .3s}
.sbar::after{content:"";position:absolute;left:50%;top:10px;width:116px;height:32px;margin-left:-58px;border-radius:20px;background:#000}
.sbar .r{display:flex;gap:6px;align-items:center}
.sbar svg{height:12px;width:auto}
.sbar .t{pointer-events:auto;cursor:default;user-select:none}
.app[data-bar="dark"] .sbar{color:var(--navy)}
.sbg{position:absolute;top:0;left:0;right:0;height:var(--sb);z-index:36;background:var(--bg);pointer-events:none;transition:opacity .25s}
.app[data-clear] .sbg{opacity:0}
.chat .hdr{background:var(--bg)}
.rapill{font-family:var(--sans)}
.stick{opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .3s,transform .35s var(--ease)}
.stick.show{opacity:1;transform:none;pointer-events:auto}
.store .acts .btn{letter-spacing:.08em;padding:0 10px}
.sbar .off{display:none}.app.offline .sbar .wifi{display:none}.app.offline .sbar .off{display:block}

/* ===== screens ===== */
.view{position:absolute;inset:0}
.scr{position:absolute;inset:0;padding-top:var(--sb);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;background:var(--bg);will-change:transform}
.scr::-webkit-scrollbar{display:none}
.app.has-tabs .scr{padding-bottom:calc(var(--tabh) + 18px)}
.app.offline .scr{padding-top:calc(var(--sb) + 34px)}
.scr.noscroll{overflow:hidden}
.scr.a-push{animation:pushIn .42s var(--ease) both;z-index:3;box-shadow:-20px 0 40px rgba(0,0,0,.35)}
.scr.a-pushout{animation:pushOut .42s var(--ease) both;z-index:2}
.scr.a-pop{animation:popIn .38s var(--ease) both;z-index:2}
.scr.a-popout{animation:popOut .38s var(--ease) both;z-index:3;box-shadow:-20px 0 40px rgba(0,0,0,.35)}
.scr.a-up{animation:upIn .46s var(--ease) both;z-index:3}
.scr.a-down{animation:upOut .36s var(--ease) both;z-index:3}
.scr.a-fade{animation:fadeIn .3s ease both;z-index:3}
.scr.a-fadeout{animation:fadeOut .2s ease both;z-index:2}
@keyframes pushIn{from{transform:translateX(100%)}}
@keyframes pushOut{to{transform:translateX(-28%);filter:brightness(.7)}}
@keyframes popIn{from{transform:translateX(-28%);filter:brightness(.7)}}
@keyframes popOut{to{transform:translateX(100%)}}
@keyframes upIn{from{transform:translateY(100%)}}
@keyframes upOut{to{transform:translateY(100%)}}
@keyframes fadeIn{from{opacity:0;transform:scale(.985)}}
@keyframes fadeOut{to{opacity:0}}
.pad{padding:0 18px}
.sec{margin-top:26px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.center{text-align:center}

/* type */
.serif{font-family:var(--serif)}
.h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.12;letter-spacing:-.005em;margin:0}
.h2{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.2;margin:0}
.h3{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.25;margin:0}
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.lbl.g{color:var(--gold)}
.muted{color:var(--mut)}
.small{font-size:12.5px}
.p{margin:6px 0 0;color:var(--ink2);font-size:13.5px;line-height:1.55}
.link{white-space:nowrap;color:var(--gold);font-weight:800;font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.link .ic{width:14px;height:14px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}

/* header bar */
.hdr{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 14px;background:linear-gradient(var(--bg) 70%,rgba(15,27,45,0))}
.hdr .t{flex:1;text-align:center;font-family:var(--serif);font-weight:600;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .t.caps{text-transform:uppercase;letter-spacing:.06em;font-size:18px}
.ibtn{position:relative;display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--ink);transition:transform .15s,background .2s,border-color .2s}
.ibtn:active{transform:scale(.92)}
.ibtn:hover{border-color:var(--line2)}
.ibtn.nb{border-color:transparent;background:none}
.ibtn .ic{width:19px;height:19px}
.ibtn.on{color:var(--gold)}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:var(--navy);font-size:10.5px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.badge:empty,.badge[data-n="0"]{display:none}
.dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--gold);border:2px solid var(--bg)}
.spacer{width:40px;flex:none}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;border-radius:4px;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;transition:transform .15s,background .2s,opacity .2s,box-shadow .2s;width:100%;text-align:center}
.btn:active{transform:scale(.975)}
.btn .ic{width:18px;height:18px}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--navy);box-shadow:0 10px 24px -12px rgba(201,169,106,.7)}
.btn.gold:hover{background:linear-gradient(180deg,#DDBF80,#CFAF72)}
.btn.line{border:1px solid var(--gold);color:var(--gold)}
.btn.line:hover{background:var(--golds)}
.btn.navy{background:var(--navy);color:var(--gold2)}
.btn.ghost{border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:#B54A3A;color:#fff}
.btn.sm{min-height:40px;font-size:10.5px;padding:0 14px;width:auto}
.btn.pill{border-radius:99px}
.btn[disabled],.btn.dis{opacity:.45;pointer-events:none}
.btn.loading{color:transparent!important}
.btn.loading::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;border:2px solid currentColor;border-color:var(--navy) transparent var(--navy) transparent;animation:spin .8s linear infinite}
.btn.line.loading::after{border-color:var(--gold) transparent var(--gold) transparent}
@keyframes spin{to{transform:rotate(360deg)}}
.tbtn{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);padding:6px 2px;border-bottom:1px solid var(--line)}
.tbtn:hover{color:var(--ink)}

/* chips / pills / seg */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 15px;border-radius:99px;border:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink2);transition:all .18s}
.chip.caps{text-transform:uppercase;letter-spacing:.1em;font-size:11px}
.chip[aria-pressed="true"],.chip.on{border-color:var(--gold);color:var(--gold);background:var(--golds)}
.chip .ic{width:14px;height:14px}
.chip:active{transform:scale(.96)}
.seg{display:flex;gap:22px;padding:0 18px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;flex:none;padding:10px 0 12px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);transition:color .2s}
.seg button[aria-selected="true"]{color:var(--gold)}
.seg button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--gold);animation:grow .3s var(--ease)}
@keyframes grow{from{transform:scaleX(0)}}
.pills{display:flex;gap:6px;padding:4px;margin:0 18px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.pills button{flex:1;min-height:34px;border-radius:99px;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);transition:all .2s}
.pills button[aria-selected="true"]{background:var(--gold);color:var(--navy)}

/* toggle */
.tgl{position:relative;width:46px;height:28px;flex:none;border-radius:99px;background:#2A3B57;transition:background .25s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.tgl[aria-checked="true"]{background:var(--gold)}
.tgl[aria-checked="true"]::after{transform:translateX(18px)}
.tgl[disabled]{opacity:.5;cursor:not-allowed}
.light .tgl{background:#DCD3C1}
.light .tgl[aria-checked="true"]{background:var(--gold)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:12px 16px;text-align:left;border-top:1px solid var(--line);font-size:14.5px;font-weight:600;transition:background .2s}
.li:first-child{border-top:0}
button.li:hover{background:rgba(255,255,255,.025)}
.li .ic{color:var(--ink2)}
.li .chev{width:16px;height:16px;color:var(--mut2)}
.li .v{color:var(--mut);font-weight:500;font-size:13px}
.li .tx{flex:1;min-width:0}
.li .tx small{display:block;color:var(--mut);font-weight:500;font-size:12px;margin-top:2px;line-height:1.4}
.grp{margin:22px 18px 0}
.grp>.lbl{display:block;margin:0 4px 10px}

/* forms */
.fld{display:block;margin-top:16px}
.fld>span{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.inp{display:flex;align-items:center;gap:8px;min-height:50px;padding:0 14px;border-radius:3px;background:var(--ivory);color:var(--navy);border:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.inp input,.inp textarea,.inp select{flex:1;min-width:0;height:48px;border:0;outline:0;background:none;color:var(--navy);font-size:14.5px}
.inp:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,169,106,.25)}
.inp.err{border-color:var(--err);animation:shake .35s}
.inp .ic{color:#7D8595}
.inp.dk{background:var(--bg2);border:1px solid var(--line);color:var(--ink)}
.inp.dk input,.inp.dk textarea,.inp.dk select{color:var(--ink)}
.inp.dk select option{background:var(--bg2)}
.inp textarea{height:auto;min-height:90px;padding:12px 0;resize:vertical;line-height:1.5}
.ferr{display:block;min-height:0;margin-top:6px;font-size:12px;color:var(--err);font-weight:600}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.srch{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;margin:0 18px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.srch input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font-size:14px}
.srch input::placeholder{color:var(--mut2)}
.srch .ic{width:17px;height:17px;color:var(--mut)}
.srch:focus-within{border-color:var(--gold)}

/* watch cards */
.wimg{position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(120% 90% at 50% 20%,#22385A,#132139 70%)}
.wimg svg.w{height:88%;width:auto;filter:drop-shadow(0 14px 14px rgba(0,0,0,.45))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px}
.wc{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;transition:transform .18s,border-color .2s;animation:cardIn .5s var(--ease) both}
.wc:hover{border-color:var(--line2)}
.wc:active{transform:scale(.98)}
.wc .wimg{aspect-ratio:1/1.08}
.wc .meta{padding:11px 12px 13px}
.wc .meta .h3{font-size:15px;margin-top:4px}
.wc .price{margin-top:6px;font-size:13px;font-weight:800;color:var(--ink)}
.wc .lbl{font-size:9.5px}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}}
.tag{position:absolute;top:10px;left:10px;z-index:2;padding:4px 7px;border-radius:2px;background:var(--gold);color:var(--navy);font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.tag.o{background:rgba(15,27,45,.7);color:var(--gold3);border:1px solid var(--line2)}
.heart{position:absolute;top:8px;right:8px;z-index:2;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:rgba(10,19,33,.55);border:1px solid rgba(255,255,255,.08);color:var(--ink);transition:transform .2s}
.heart .ic{width:16px;height:16px}
.heart[aria-pressed="true"]{color:var(--gold)}
.heart.pop{animation:pop .45s var(--ease)}
@keyframes pop{40%{transform:scale(1.35)}70%{transform:scale(.9)}}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:0 18px 4px;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-padding:0 18px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:none}
.hscroll .wc{width:170px}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:30;height:var(--tabh);display:grid;grid-template-columns:repeat(5,1fr);align-items:start;padding:10px 6px 0;background:linear-gradient(rgba(12,22,37,.86),rgba(10,19,33,.98));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);transition:transform .35s var(--ease),opacity .3s}
.app:not(.has-tabs) .tabbar{transform:translateY(110%);opacity:0;pointer-events:none}
.tb{display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:4px;color:var(--mut);font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;transition:color .2s}
.tb .ic{width:22px;height:22px;transition:transform .25s var(--ease)}
.tb[aria-current="page"]{color:var(--gold)}
.tb[aria-current="page"] .ic{transform:translateY(-1px)}
.tb.c{position:relative}
.tb.c .ring{display:grid;place-items:center;width:54px;height:54px;margin-top:-24px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#1D3151,#0F1B2D);border:1px solid var(--line2);box-shadow:0 10px 20px -8px rgba(0,0,0,.7),0 0 0 5px rgba(15,27,45,.9);color:var(--ink)}
.tb.c[aria-current="page"] .ring{border-color:var(--gold);color:var(--gold);box-shadow:0 10px 24px -8px rgba(201,169,106,.5),0 0 0 5px rgba(15,27,45,.9)}
.tb.c .ic{width:24px;height:24px}
.tb.c span{margin-top:-1px}

/* overlays */
.layer{position:absolute;inset:0;z-index:50;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(4,9,16,.55);opacity:0;transition:opacity .3s;pointer-events:auto}
.scrim.in{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - 60px);display:flex;flex-direction:column;background:var(--bg3);border-top:1px solid var(--line2);border-radius:22px 22px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.45);transform:translateY(105%);transition:transform .42s var(--ease);pointer-events:auto}
.sheet.in{transform:none}
.sheet.drag{transition:none}
.sheet.light{background:var(--ivory);color:var(--navy);border-top:0}
.sheet.light .lbl{color:var(--nmut)}
.sheet.light .p{color:#4F5869}
.grab{flex:none;display:grid;place-items:center;height:26px;cursor:grab;touch-action:none}
.grab i{width:40px;height:4px;border-radius:4px;background:rgba(255,255,255,.2)}
.sheet.light .grab i{background:rgba(19,34,58,.18)}
.sh-h{display:flex;align-items:center;gap:10px;padding:2px 20px 14px;touch-action:none}
.sh-h .h2{flex:1}
.sh-b{flex:1;min-height:0;overflow-y:auto;padding:0 20px 18px;overscroll-behavior:contain;scrollbar-width:thin}
.sh-f .btn{letter-spacing:.1em;padding:0 14px}
.sh-f{flex:none;display:flex;gap:12px;padding:14px 20px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet.light .sh-f{border-top-color:var(--ivline)}
.sheet .xbtn{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;color:var(--mut)}
.sheet .xbtn:hover{color:var(--ink)}
.sheet.light .xbtn:hover{color:var(--navy)}
.dlg{position:absolute;left:24px;right:24px;top:50%;padding:26px 22px 20px;border-radius:20px;background:var(--ivory);color:var(--navy);text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.5);transform:translateY(-50%) scale(.92);opacity:0;transition:all .3s var(--ease);pointer-events:auto}
.dlg.in{transform:translateY(-50%);opacity:1}
.dlg .h2{margin-bottom:8px}
.dlg p{margin:0 0 20px;color:#4F5869;font-size:13.5px;line-height:1.55}
.dlg .acts{display:flex;flex-direction:column;gap:10px}
.dlg .btn.line{color:var(--navy);border-color:var(--ivline)}
.toasts{position:absolute;left:14px;right:14px;bottom:calc(var(--tabh) + 14px);z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.app:not(.has-tabs) .toasts{bottom:28px}
.toast{display:flex;align-items:center;gap:10px;max-width:100%;padding:11px 16px;border-radius:12px;background:rgba(247,242,232,.97);color:var(--navy);font-size:13px;font-weight:700;box-shadow:0 14px 30px rgba(0,0,0,.4);animation:tIn .35s var(--ease)}
.toast .ic{width:18px;height:18px;color:#A07F3F}
.toast.out{animation:tOut .3s ease forwards}
@keyframes tIn{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes tOut{to{opacity:0;transform:translateY(8px)}}
.pushb{position:absolute;left:10px;right:10px;top:calc(var(--sb) + 2px);z-index:80;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:20px;background:rgba(236,230,218,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#141A24;box-shadow:0 20px 40px rgba(0,0,0,.45);text-align:left;transform:translateY(-140%);transition:transform .5s var(--ease);width:auto}
.pushb.in{transform:none}
.pushb .ai{flex:none;width:38px;height:38px;border-radius:10px;background:var(--bg);display:grid;place-items:center;color:var(--gold);font-family:var(--serif);font-weight:700;font-size:18px}
.pushb .x{flex:1;min-width:0}
.pushb .x b{display:block;font-size:13.5px}
.pushb .x span{display:block;font-size:13px;line-height:1.35;color:#333A46}
.pushb small{position:absolute;top:12px;right:14px;font-size:11px;color:#6A717D}
.pushb .ap{font-size:11px;font-weight:800;letter-spacing:.08em;color:#6A717D;text-transform:uppercase;margin-bottom:2px}
.offbar{position:absolute;left:0;right:0;top:var(--sb);z-index:35;display:none;align-items:center;justify-content:center;gap:8px;height:34px;background:#3A2F1C;color:var(--gold3);font-size:12px;font-weight:700;border-bottom:1px solid rgba(201,169,106,.3)}
.offbar .ic{width:15px;height:15px}
.app.offline .offbar{display:flex}
.app.offline .net{opacity:.45}

/* ===== specific screens ===== */
/* splash */
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#132339 0%,#0A1220 45%,#030509 100%)}
.logo{font-family:var(--serif);font-weight:500;color:#fff;letter-spacing:.3em;margin-right:-.3em;line-height:1}
.splash .logo{font-size:56px;animation:logoIn 1.1s var(--ease) both}
.splash .gl{width:70px;height:1px;background:var(--gold);margin:26px 0 22px;transform-origin:center;animation:grow 1s .35s var(--ease) both}
.splash .sub{font-size:12px;font-weight:700;letter-spacing:.42em;margin-right:-.42em;color:#C8CDD6;animation:fadeIn 1s .6s both}
.splash .foot{position:absolute;bottom:44px;left:50%;width:210px;margin-left:-105px;padding-top:18px;border-top:1px solid rgba(255,255,255,.1);text-align:center;font-size:10px;font-weight:800;letter-spacing:.16em;color:#8C95A5;animation:fadeIn 1s .8s both}
.splash .ringan{position:absolute;width:250px;height:250px;top:50%;left:50%;margin:-150px 0 0 -125px;opacity:.5}
.splash .ringan circle{stroke-dasharray:2 5.85;animation:sweep 1.8s linear both}
@keyframes logoIn{from{opacity:0;letter-spacing:.6em;filter:blur(6px)}}
@keyframes sweep{from{stroke-dashoffset:0;opacity:0}to{opacity:1}}

/* welcome */
.wel{display:flex;flex-direction:column;padding-top:0}
.wel .hero{position:relative;flex:1;min-height:360px;padding-top:var(--sb);background:radial-gradient(80% 60% at 50% 40%,#1B2F4F,#0F1B2D 70%);overflow:hidden}
.wel .hero .w{position:absolute;left:50%;top:calc(var(--sb) + 10px);height:300px;transform:translateX(-50%) rotate(-12deg);filter:drop-shadow(0 30px 30px rgba(0,0,0,.6));animation:floatw 6s ease-in-out infinite}
@keyframes floatw{50%{transform:translateX(-50%) rotate(-9deg) translateY(-8px)}}
.deco{position:absolute;border:1px solid rgba(255,255,255,.18)}
.sq{position:absolute;background:rgba(255,255,255,.07)}
.arbox{position:absolute;left:18px;bottom:22px;display:grid;place-items:center;width:84px;height:78px;border:1px solid rgba(255,255,255,.25);font-family:var(--serif);font-size:36px;color:#fff}
.arbox sup{position:absolute;top:10px;right:12px;font-size:16px;color:var(--gold)}
.wel .sr{position:absolute;right:20px;bottom:24px;text-align:right;font-size:10.5px;font-weight:800;letter-spacing:.24em;line-height:1.9;color:#D9DEE6}
.wel .sheetw{position:relative;margin-top:-18px;padding:28px 22px calc(22px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;background:var(--ivory);color:var(--navy);animation:upIn .7s .1s var(--ease) both}
.wel .sheetw .h1{font-size:29px;color:var(--navy)}
.wel .sheetw p{margin:12px 0 22px;color:#59606E;font-size:13.5px;line-height:1.6}
.wel .alt{display:flex;justify-content:space-between;margin-top:18px}
.wel .alt .tbtn{color:#6B7385;border-bottom-color:#D8CFBE}
.wel .alt .tbtn:hover{color:var(--navy)}
.wel .btn.navy{justify-content:space-between;padding:0 22px}

/* login */
.login .brand{font-family:var(--serif);letter-spacing:.24em;font-size:22px;text-align:center;margin:18px 0 34px;color:#fff}
.login .corner{position:absolute;top:calc(var(--sb) + 18px);left:18px;width:34px;height:34px;border-left:1px solid rgba(255,255,255,.2);border-top:1px solid rgba(255,255,255,.2)}
.or{display:flex;align-items:center;gap:14px;margin:26px 0;color:var(--mut);font-size:11px;font-weight:700;letter-spacing:.14em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.sso{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:50px;border:1px solid var(--line);border-radius:3px;font-weight:700;font-size:14px;transition:background .2s}
.sso:hover{background:rgba(255,255,255,.03)}
.sso+.sso{margin-top:12px}
.demo-acc{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;padding:10px 12px;border:1px dashed var(--line2);border-radius:8px;color:var(--gold3);font-size:12.5px;text-align:left}
.demo-acc .ic{width:16px;height:16px}
.secure{display:flex;align-items:center;justify-content:center;gap:6px;margin:28px 0 22px;color:var(--mut);font-size:12px}
.secure .ic{width:13px;height:13px}

/* rgpd */
.rg{background:linear-gradient(180deg,#0E1A2C,#0F1B2D)}
.rg .top{height:108px}
.rg .tgl{background:#DCD3C1}.rg .tgl[aria-checked="true"]{background:var(--gold)}
.rg .ivsheet{min-height:calc(100% - 108px);padding:14px 22px 28px;border-radius:22px 22px 0 0;background:var(--ivory);color:var(--navy);animation:upIn .6s var(--ease) both}
.rg .ivsheet .grab i{background:rgba(19,34,58,.15)}
.rg .h2{font-size:24px;text-align:center;line-height:1.25}
.rg .intro{margin:12px 6px 18px;text-align:center;color:#59606E;font-size:13px;line-height:1.6}
.crow{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-top:1px solid var(--ivline)}
.crow b{display:block;font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.crow small{display:block;margin-top:5px;color:#6B7385;font-size:12px;line-height:1.5}
.crow .x{flex:1}
.crow .always{font-size:10px;font-weight:800;letter-spacing:.14em;color:#9A8A6A;white-space:nowrap;padding-top:2px}
.dark-rows .crow{border-top-color:var(--line)}
.dark-rows .crow small{color:var(--mut)}

/* prefs */
.opt3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;border:1px solid var(--line);border-radius:4px;transition:all .2s}
.opt b{font-size:14px}
.opt small{font-size:9.5px;font-weight:800;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--golds)}
.opt[aria-pressed="true"] b{color:var(--gold3)}
.colc{position:relative;width:126px;border:1px solid var(--line);border-radius:4px;overflow:hidden;text-align:left;transition:border-color .2s}
.colc .wimg{height:112px;background:radial-gradient(90% 90% at 50% 30%,#1F3455,#132139)}
.colc .wimg svg.w{height:92%}
.colc b{display:block;padding:10px 10px 11px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border-top:1px solid var(--line)}
.colc .ck{position:absolute;top:8px;right:8px;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--navy);transform:scale(0);transition:transform .25s var(--ease)}
.colc .ck .ic{width:13px;height:13px}
.colc[aria-pressed="true"]{border-color:var(--gold)}
.colc[aria-pressed="true"] .ck{transform:scale(1)}
.range2{position:relative;height:34px;margin-top:8px}
.range2 .trk{position:absolute;left:0;right:0;top:15px;height:3px;border-radius:3px;background:#2A3B57}
.range2 .fill{position:absolute;top:15px;height:3px;background:var(--gold);border-radius:3px}
.range2 input{position:absolute;left:0;top:0;width:100%;height:34px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.range2 input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:24px;height:24px;border-radius:50%;background:var(--gold2);border:4px solid var(--bg);box-shadow:0 0 0 1px var(--gold),0 4px 10px rgba(0,0,0,.4);cursor:grab}
.range2 input::-moz-range-thumb{pointer-events:auto;width:18px;height:18px;border-radius:50%;background:var(--gold2);border:4px solid var(--bg);box-shadow:0 0 0 1px var(--gold);cursor:grab}
.range2 input::-webkit-slider-runnable-track{background:none}
.range2 input:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--gold3)}
.scale{display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--mut2);letter-spacing:.06em}
.req{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--gold)}
.req.bad{color:var(--err)}

/* home */
.hello{display:flex;align-items:flex-start;padding:10px 18px 0}
.hello .x{flex:1}
.hello .h1{font-size:28px;margin-top:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.tile{padding:15px 15px 14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;transition:border-color .2s,transform .15s}
.tile:hover{border-color:var(--line2)}
.tile:active{transform:scale(.98)}
.tile .top{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:12px;font-weight:700}
.tile .top .ic{width:17px;height:17px;color:var(--gold)}
.tile .n{margin-top:10px;font-size:13px;color:var(--mut)}
.tile .n b{font-size:24px;font-weight:800;color:var(--ink);margin-right:6px;font-family:var(--sans)}
.essai{position:relative;display:block;width:100%;margin-top:14px;padding:18px 16px;min-height:118px;text-align:left;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(100deg,#1A2B46 30%,#0F1B2D)}
.essai .bgw{position:absolute;right:-30px;top:-34px;height:200px;opacity:.55;transform:rotate(18deg)}
.essai .ib{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--navy);vertical-align:middle;margin-right:10px}
.essai .ib .ic{width:17px;height:17px}
.essai .h2{display:inline;vertical-align:middle;font-size:20px}
.essai p{position:relative;max-width:230px;margin:10px 0 0;color:var(--ink2);font-size:12.5px;line-height:1.5}
.essai .go{position:relative;margin-top:10px}
.reco .wc{width:150px}
.why{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:10.5px;color:var(--gold3);font-weight:700}
.cercle{position:relative;overflow:hidden;margin:0 18px;border-radius:14px;border:1px solid var(--line);min-height:330px;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 18px 18px}
.cercle .bg{position:absolute;inset:0}
.cercle>*:not(.bg){position:relative}
.cercle .pill{align-self:flex-start;padding:4px 10px;border-radius:99px;background:rgba(201,169,106,.18);border:1px solid var(--line2);color:var(--gold3);font-size:9.5px;font-weight:800;letter-spacing:.16em}
.cercle .h1{font-size:25px;margin-top:10px}
.cercle p{margin:10px 0 16px;color:#D2D6DE;font-size:12.5px;line-height:1.55}
.emb{display:flex;flex-direction:column;align-items:center;gap:10px;width:112px}
.emb .rd{display:grid;place-items:center;width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#223A5E,#101D32);border:1px solid var(--line);overflow:hidden;transition:border-color .2s,transform .2s}
.emb:hover .rd{border-color:var(--gold)}
.emb:active .rd{transform:scale(.95)}
.emb .rd svg{height:128%;margin-top:18%}
.emb b{font-size:13px;font-weight:700}

/* catalogue */
.cattop{display:flex;align-items:center;gap:6px;padding:8px 14px 6px 18px}
.cattop .h1{flex:1}
.resbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 12px;font-size:12px;color:var(--mut)}
.resbar b{color:var(--ink)}
.cache{display:inline-flex;align-items:center;gap:6px;margin:10px 18px 0;padding:6px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--gold3);font-size:11px;font-weight:700}
.cache .ic{width:13px;height:13px}
.ckrow{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:42px;font-size:14px;font-weight:600;text-align:left}
.ckb{display:grid;place-items:center;width:22px;height:22px;border-radius:4px;border:1px solid #3A4C6A;color:transparent;transition:all .2s}
.ckb .ic{width:14px;height:14px}
[aria-checked="true"]>.ckb{border-color:var(--gold);color:var(--gold);background:var(--golds)}
.fgrp{padding:18px 0;border-top:1px solid var(--line)}
.fgrp:first-child{border-top:0;padding-top:4px}
.fgrp>.lbl{display:block;margin-bottom:12px}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sizes .chip{justify-content:center;border-radius:4px;font-size:13px}

/* empty */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 30px 10px}
.empty svg.ill{width:150px;height:150px;margin-bottom:14px}
.empty .h2{margin-bottom:8px}
.empty p{margin:0 0 20px;color:var(--mut);font-size:13.5px;line-height:1.55;max-width:270px}
.empty .btn{width:auto}

/* pdp */
.pdp .hdr{background:none;position:absolute;left:0;right:0;top:var(--sb)}
.app.offline .pdp .hdr{top:calc(var(--sb) + 34px)}
.scr.pdp{padding-top:0}
.app.offline .scr.pdp{padding-top:34px}
.car{position:relative}
.car .slide{padding-top:var(--sb)}
.car .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.car .track::-webkit-scrollbar{display:none}
.car .slide{flex:none;width:100%;height:380px;scroll-snap-align:center;display:grid;place-items:center;background:radial-gradient(70% 60% at 50% 45%,#223A5E,#0F1B2D 75%)}
.car .slide svg.w{height:300px;width:auto;filter:drop-shadow(0 26px 26px rgba(0,0,0,.55))}
.car .vlabel{position:absolute;left:18px;bottom:16px;font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--mut);text-transform:uppercase}
.dots{display:flex;justify-content:center;gap:7px;padding:10px 0 0}
.dots button{width:6px;height:6px;border-radius:3px;background:#3A4C6A;transition:all .3s var(--ease)}
.dots button[aria-current="true"]{width:18px;background:var(--gold)}
.pdp .ttlrow{display:flex;align-items:flex-start;gap:14px;margin-top:8px}
.pdp .ttlrow .h1{flex:1;font-size:27px}
.pdp .pr{font-size:18px;font-weight:800;color:var(--gold2);white-space:nowrap;padding-top:6px;font-family:var(--sans)}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.bdg{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:3px;border:1px solid var(--line2);color:var(--gold3);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.bdg .ic{width:13px;height:13px}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.spec{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:10px}
.spec .ic{color:var(--gold);width:20px;height:20px}
.spec small{font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.spec b{font-size:13px;line-height:1.25}
.acc{border-top:1px solid var(--line)}
.acc:last-child{border-bottom:1px solid var(--line)}
.acc>button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:56px;font-family:var(--serif);font-size:16px;font-weight:600;text-align:left}
.acc>button .ic{width:16px;height:16px;color:var(--gold);transition:transform .3s var(--ease)}
.acc[data-open="1"]>button .ic{transform:rotate(45deg)}
.acc .ab{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.acc[data-open="1"] .ab{grid-template-rows:1fr}
.acc .ab>div{overflow:hidden}
.acc .ab .in{padding:0 0 18px;color:var(--ink2);font-size:13px;line-height:1.6}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.05);font-size:12.5px}
.kv:first-child{border-top:0}
.kv span{color:var(--mut)}
.kv b{text-align:right;font-weight:700}
.stick{position:sticky;bottom:8px;z-index:4;display:flex;gap:10px;margin:22px 12px 0;padding:10px;border-radius:14px;background:rgba(19,34,58,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line)}
.stick .btn{min-height:46px;font-size:10.5px;letter-spacing:.12em;padding:0 12px}

/* AR */
.ar{background:#05080D;padding-top:0}
.ar .bgl{position:absolute;inset:0;overflow:hidden}
.ar .bgl video,.ar .bgl svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ar .top{position:absolute;left:0;right:0;top:var(--sb);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:6px 16px}
.ar .ibtn{background:rgba(10,16,26,.45);border-color:rgba(255,255,255,.15);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff}
.rapill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:rgba(10,16,26,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);font-size:10.5px;font-weight:800;letter-spacing:.14em;color:#fff;text-transform:uppercase}
.rapill i{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(201,169,106,.7);animation:pulse 1.8s infinite}
.rapill.live i{background:#5CD08F;box-shadow:0 0 0 0 rgba(92,208,143,.7)}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(201,169,106,0)}100%{box-shadow:0 0 0 0 rgba(201,169,106,0)}}
.frame{position:absolute;left:50%;top:44%;width:236px;height:236px;margin:-118px 0 0 -118px;pointer-events:none;z-index:2}
.frame i{position:absolute;width:34px;height:34px;border-color:var(--gold);border-style:solid;border-width:0;transition:all .5s var(--ease);opacity:.9}
.frame i:nth-of-type(1){left:0;top:0;border-left-width:2px;border-top-width:2px}
.frame i:nth-of-type(2){right:0;top:0;border-right-width:2px;border-top-width:2px}
.frame i:nth-of-type(3){left:0;bottom:0;border-left-width:2px;border-bottom-width:2px}
.frame i:nth-of-type(4){right:0;bottom:0;border-right-width:2px;border-bottom-width:2px}
.frame.lock i{width:22px;height:22px;opacity:.55}
.frame .ring{position:absolute;inset:-16px;border-radius:50%;border:1px dashed rgba(201,169,106,.35);animation:spin 26s linear infinite}
.guide{position:absolute;left:50%;top:calc(44% - 170px);z-index:3;transform:translateX(-50%);padding:8px 16px;border-radius:99px;background:rgba(10,16,26,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;transition:opacity .4s,transform .4s}
.guide.ok{color:var(--gold3)}
.ar.cust .guide,.ar.cust .frame{opacity:0!important}
.wov{position:absolute;left:50%;top:44%;z-index:4;width:150px;touch-action:none;cursor:grab;transition:opacity .6s}
.wov.hide{opacity:0}
.wov svg{display:block;width:100%;height:auto;filter:drop-shadow(0 18px 16px rgba(0,0,0,.55))}
.wov:active{cursor:grabbing}
.rail{position:absolute;right:14px;top:calc(44% - 96px);z-index:5;display:flex;flex-direction:column;gap:10px}
.arbot{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:22px 26px calc(30px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(3,6,10,.7))}
.arbot .q{width:64px;font-size:11px;font-weight:800;letter-spacing:.14em;color:#fff;text-transform:uppercase;text-align:left}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid rgba(255,255,255,.85);display:grid;place-items:center;transition:transform .15s}
.shutter::after{content:"";width:60px;height:60px;border-radius:50%;background:#fff;transition:transform .15s}
.shutter:active::after{transform:scale(.88)}
.thumb{width:64px;height:64px;border-radius:12px;background:rgba(20,32,50,.7);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;overflow:hidden}
.thumb svg{height:84%}
.custbtn{position:absolute;left:50%;bottom:calc(128px + env(safe-area-inset-bottom));z-index:5;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:99px;background:rgba(201,169,106,.92);color:var(--navy);font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.custbtn .ic{width:15px;height:15px}
.flash{position:absolute;inset:0;z-index:20;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .5s ease}
@keyframes flash{10%{opacity:.9}}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;font-size:10.5px;font-weight:700;color:#59606E;text-align:center;line-height:1.2}
.sw i{display:block;width:40px;height:40px;border-radius:50%;box-shadow:inset 0 -6px 12px rgba(0,0,0,.25),inset 0 4px 8px rgba(255,255,255,.18);outline:2px solid transparent;outline-offset:3px;transition:outline-color .2s,transform .2s}
.sw[aria-pressed="true"] i{outline-color:var(--gold);transform:scale(1.04)}
.sw[aria-pressed="true"]{color:var(--navy)}
.optl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.optl button{min-height:44px;border:1px solid var(--ivline);border-radius:4px;font-size:13px;font-weight:700;color:#59606E;transition:all .2s}
.optl button[aria-pressed="true"]{border-color:var(--gold);color:var(--navy);background:#FFFDF8}
.cfgh{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 12px}
.cfgh .h3{font-size:17px}
.cfgh small{font-size:10px;font-weight:800;letter-spacing:.14em;color:#9A8A6A;text-transform:uppercase}
.custprev{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:12px;background:#EFE8DA;margin-bottom:4px}
.custprev svg{height:74px;width:auto}
.custprev b{font-size:18px}

/* camera permission */
.perm{display:flex;flex-direction:column}
.perm .pc{margin:30px 16px 0;padding:28px 22px 22px;border-radius:24px;background:var(--ivory);color:var(--navy);text-align:center;animation:fadeIn .5s var(--ease)}
.perm .pc .ico{display:grid;place-items:center;width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:#EFE7D7;color:var(--gold)}
.perm .pc .ico .ic{width:36px;height:36px}
.perm .pc .h2{font-size:24px}
.perm .pc p{margin:12px 0 22px;color:#59606E;font-size:13.5px;line-height:1.6}
.perm .pc .btn{border-radius:99px}
.perm .pc .btn+.btn{margin-top:12px}
.perm .pc .btn.line{color:var(--navy);border-color:var(--ivline)}
.perm .back{display:flex;align-items:center;justify-content:center;gap:8px;margin:26px auto 0;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--ink2);text-transform:uppercase}
.perm .back .ic{width:15px;height:15px}
.perm ul{margin:0 0 20px;padding:0;list-style:none;text-align:left}
.perm li{display:flex;gap:10px;padding:7px 0;font-size:13px;color:#454D5C;line-height:1.45}
.perm li .ic{width:17px;height:17px;color:var(--gold);margin-top:1px}

/* collection */
.oc{padding:14px;margin-bottom:14px}
.oc .tp{display:flex;gap:14px}
.oc .im{position:relative;flex:none;width:92px;height:92px;border-radius:10px;overflow:hidden}
.oc .im .wimg{width:100%;height:100%}
.oc .im .live{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(98,192,143,.2)}
.oc .h3{font-size:16px}
.oc .ref{font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--mut);margin-top:3px}
.oc .ln{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11.5px;color:var(--ink2)}
.oc .ln .ic{width:13px;height:13px;color:var(--mut)}
.oc .ln.g{color:var(--gold3)}
.oc .ln.g .ic{color:var(--gold)}
.oc .ft{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.addc{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border:1px dashed var(--line2);border-radius:14px;color:var(--gold3);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.wl{display:flex;gap:14px;padding:12px;margin-bottom:12px}
.wl .im{flex:none;width:96px;height:112px;border-radius:10px;overflow:hidden}
.wl .im .wimg{height:100%}
.wl .cfg{margin-top:5px;font-size:11.5px;color:var(--mut);line-height:1.45}
.wl .pr{margin-top:6px;font-weight:800;font-size:14px}
.wl .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* details */
.dhero{position:relative;margin:4px 18px 0;padding:46px 0 16px;border-radius:16px;background:radial-gradient(80% 70% at 50% 40%,#223A5E,#132139);border:1px solid var(--line);text-align:center}
.dhero svg.w{height:200px;filter:drop-shadow(0 18px 18px rgba(0,0,0,.5))}
.auth{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:rgba(10,19,33,.7);border:1px solid var(--line2);font-size:9.5px;font-weight:800;letter-spacing:.14em;color:var(--gold3);text-transform:uppercase}
.auth i{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.dhero .auth{position:absolute;top:12px;right:12px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;width:1px;background:var(--line)}
.tli{position:relative;margin-bottom:12px;padding:14px;animation:cardIn .4s var(--ease) both}
.tli::before{content:"";position:absolute;left:-21px;top:18px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--mut2)}
.tli.first::before{border-color:var(--gold);background:var(--gold)}
.tli .th{display:flex;justify-content:space-between;gap:10px}
.tli .th b{font-family:var(--serif);font-size:15px;font-weight:600}
.tli .th small{color:var(--mut);font-size:11px;white-space:nowrap}
.tli p{margin:6px 0 0;color:var(--ink2);font-size:12.5px;line-height:1.5}
.tli .by{display:inline-block;margin-top:8px;padding:3px 8px;border-radius:3px;background:rgba(255,255,255,.05);font-size:10.5px;color:var(--mut)}
.vault{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vault button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;transition:border-color .2s}
.vault button:hover{border-color:var(--line2)}
.vault .ic{color:var(--gold);width:22px;height:22px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.notes{margin-top:12px;padding:14px;font-style:italic;font-size:12.5px;color:var(--ink2);line-height:1.55}
.notes .nh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-style:normal}

/* club */
.inv{position:relative;margin:18px 18px 0;border-radius:16px;overflow:hidden;min-height:440px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--line2)}
.inv .bg{position:absolute;inset:0}
.inv .ct{position:relative;padding:18px}
.inv .star{position:absolute;top:14px;left:14px;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:rgba(10,16,26,.55);backdrop-filter:blur(6px);color:var(--gold3);font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.inv .star .ic{width:12px;height:12px}
.inv .h1{font-size:28px}
.inv .meta{margin-top:6px;font-size:12px;color:#E5DCC8}
.inv .glass{margin-top:14px;padding:14px;border-radius:12px;background:rgba(10,16,26,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12.5px;line-height:1.55;color:#DFE3EA}
.inv .glass .btn{margin-top:14px;border-radius:6px}
.pv{width:190px;padding:12px;text-align:left}
.pv .wimg{height:150px;border-radius:10px}
.pv .h3{font-size:14.5px;margin-top:12px}
.pv p{margin:4px 0 12px;font-size:11.5px;color:var(--mut);line-height:1.4;min-height:32px}
.art{display:block;width:100%;margin-bottom:14px;text-align:left;overflow:hidden}
.art .ph{height:150px;position:relative}
.art .ph svg{width:100%;height:100%;display:block}
.art .ph .k{position:absolute;top:12px;left:12px;padding:3px 7px;border-radius:2px;background:rgba(10,16,26,.7);font-size:9px;font-weight:800;letter-spacing:.14em;color:#fff;text-transform:uppercase}
.art .bd{padding:14px 16px 16px}
.art .h3{font-size:16px}
.art p{margin:6px 0 10px;font-size:12.5px;color:var(--mut);line-height:1.5}
.art .rt{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.art .rt b{color:var(--gold)}
.conc{display:flex;gap:14px;padding:16px;text-align:left;width:100%}
.conc .av{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--navy)}
.conc .av .ic{width:20px;height:20px}
.conc p{margin:6px 0 10px;font-size:12.5px;color:var(--ink2);line-height:1.5}
.ev{display:flex;gap:14px;padding:14px;margin-bottom:12px}
.ev .dt{flex:none;width:58px;padding:8px 0;border-radius:10px;border:1px solid var(--line2);text-align:center}
.ev .dt b{display:block;font-family:var(--serif);font-size:24px;line-height:1;color:var(--gold2)}
.ev .dt small{font-size:9.5px;font-weight:800;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.ev .h3{font-size:15.5px}
.ev p{margin:4px 0 10px;font-size:12px;color:var(--mut);line-height:1.45}
.cd{display:flex;gap:8px;margin:10px 0 12px}
.cd div{flex:1;padding:8px 0;border-radius:8px;background:var(--bg2);text-align:center}
.cd b{display:block;font-size:17px;font-family:var(--serif)}
.cd small{font-size:9px;font-weight:800;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slots button{padding:12px 10px;border:1px solid var(--line);border-radius:10px;text-align:left;transition:all .2s}
.slots button b{display:block;font-size:13.5px}
.slots button small{color:var(--mut);font-size:11.5px}
.slots button[aria-pressed="true"]{border-color:var(--gold);background:var(--golds)}
.slots button[disabled]{opacity:.4;text-decoration:line-through}
.okmark{display:grid;place-items:center;width:84px;height:84px;margin:10px auto 18px;border-radius:50%;background:var(--golds);border:1px solid var(--gold);color:var(--gold)}
.okmark svg{width:40px;height:40px}
.okmark path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .6s .15s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* article */
.rbar{position:absolute;left:0;top:0;height:3px;background:var(--gold);z-index:6;width:0}
.reader .hero{height:250px;position:relative}
.reader .hero svg{width:100%;height:100%;display:block}
.reader .body{padding:22px 22px 40px}
.reader .body p{font-family:var(--serif);font-size:16.5px;line-height:1.75;color:#DCD8CF;margin:0 0 16px}
.reader .body p:first-of-type::first-letter{float:left;font-size:52px;line-height:.9;padding:6px 8px 0 0;color:var(--gold2)}
.reader blockquote{margin:22px 0;padding:4px 0 4px 18px;border-left:2px solid var(--gold);font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.5;color:var(--gold3)}

/* chat */
.chat{display:flex;flex-direction:column;padding-bottom:0!important}
.chat .msgs{flex:1;padding:8px 16px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:11px 14px;border-radius:16px;font-size:13.5px;line-height:1.5;animation:cardIn .35s var(--ease) both}
.msg.bot{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--gold);color:var(--navy);border-bottom-right-radius:4px;font-weight:600}
.msg.card{max-width:88%;padding:0;overflow:hidden}
.msg .mc{padding:14px}
.msg .mc .kv{font-size:12px}
.typing{align-self:flex-start;display:flex;gap:4px;padding:14px 16px;border-radius:16px;background:var(--card2)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:typ 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes typ{30%{transform:translateY(-4px);background:var(--gold)}}
.qr{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.qr::-webkit-scrollbar{display:none}
.qr .chip{flex:none;min-height:34px}
.cin{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;padding:10px 14px calc(14px + env(safe-area-inset-bottom));background:var(--bg3);border-top:1px solid var(--line)}
.cin input{flex:1;min-width:0;height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);outline:0;font-size:14px}
.cin input:focus{border-color:var(--gold)}
.cin .send{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--gold);color:var(--navy);flex:none}
.cin .send[disabled]{opacity:.4}
.advh{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.advh .av{position:relative;flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#E8D3A2,#B8914E);color:var(--navy);font-family:var(--serif);font-weight:700}
.advh .av::after{content:"";position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}
.app.offline .advh .av::after{background:var(--mut2)}
.advh b{display:block;font-family:var(--serif);font-size:16px}
.advh small{color:var(--mut);font-size:11.5px}

/* notifications */
.nf{position:relative;margin-bottom:10px;border-radius:14px;overflow:hidden}
.nf .under{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:22px;background:var(--gold);color:var(--navy);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;gap:8px}
.nf .under .ic{width:16px;height:16px}
.nf .body{position:relative;display:flex;gap:14px;width:100%;padding:16px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;touch-action:pan-y;transition:transform .3s var(--ease),opacity .3s}
.nf.read .body{background:#122038}
.nf.read .body .h3,.nf.read .body p{opacity:.7}
.nf .ni{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);color:var(--gold)}
.nf .ni .ic{width:18px;height:18px}
.nf .th{display:flex;justify-content:space-between;gap:8px}
.nf .h3{font-size:15px}
.nf small.tm{flex:none;font-size:10.5px;color:var(--mut)}
.nf p{margin:5px 0 0;font-size:12.5px;line-height:1.5;color:var(--ink2)}
.nf .cta{display:inline-flex;align-items:center;gap:4px;margin-top:8px;color:var(--gold);font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.nf .cta .ic{width:12px;height:12px}
.nf .ud{position:absolute;top:18px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.nf:not(.read) small.tm{margin-right:14px}

/* profile */
.prof{display:flex;align-items:center;gap:16px;padding:10px 18px 4px}
.avatar{position:relative;flex:none;width:84px;height:84px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,var(--gold3),var(--gold),#7A6235,var(--gold3))}
.avatar>div{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 40% 30%,#2A4166,#12203A);display:grid;place-items:center;font-family:var(--serif);font-size:28px;color:var(--gold3);border:3px solid var(--bg)}
.avatar .cr{position:absolute;right:-2px;bottom:0;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--navy);border:3px solid var(--bg)}
.avatar .cr .ic{width:13px;height:13px}
.prof .h2{font-size:22px}
.prof .em{color:var(--mut);font-size:13px;margin-top:2px}
.vip{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:99px;background:rgba(201,169,106,.14);border:1px solid var(--line2);color:var(--gold2);font-size:9.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.logout{display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 36px);margin:26px 18px 0;min-height:54px;border-radius:12px;border:1px solid var(--line);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.logout:hover{border-color:var(--line2)}
.ver{text-align:center;margin:18px 0 0;font-size:11px;color:var(--mut2)}
.paycard{position:relative;height:190px;margin:4px 18px 0;padding:20px;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#243B61,#0E1A2D 70%);border:1px solid var(--line2);display:flex;flex-direction:column;justify-content:space-between}
.paycard .chipc{width:40px;height:30px;border-radius:6px;background:linear-gradient(135deg,var(--gold3),var(--gold))}
.paycard .num{font-size:18px;letter-spacing:.18em;font-weight:700}
.dev{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line)}
.dev:first-child{border-top:0}
.dev .ic{color:var(--gold)}
.dev .x{flex:1}
.dev b{display:block;font-size:14px}
.dev small{color:var(--mut);font-size:12px}

/* stores */
.map{position:relative;height:250px;margin:4px 18px 0;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.map svg{width:100%;height:100%;display:block}
.pin{position:absolute;display:grid;place-items:center;width:30px;height:30px;margin:-30px 0 0 -15px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--gold);color:var(--navy);font-weight:800;font-size:12px;box-shadow:0 6px 12px rgba(0,0,0,.4);transition:transform .2s}
.pin span{transform:rotate(45deg)}
.pin.on{transform:rotate(-45deg) scale(1.2);background:#fff}
.me-dot{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#4F8DF7;border:3px solid #fff;box-shadow:0 0 0 8px rgba(79,141,247,.25)}
.store{display:block;width:100%;padding:14px 16px;margin-bottom:10px;text-align:left}
.store.on{border-color:var(--gold)}
.store .th{display:flex;justify-content:space-between;gap:10px}
.store .h3{font-size:15px}
.store small{color:var(--mut);font-size:12px}
.store .d{color:var(--gold2);font-weight:800;font-size:12.5px;white-space:nowrap}
.store .acts{display:flex;gap:8px;margin-top:12px}
.illus{display:inline-block;margin:10px 18px 0;font-size:11px;color:var(--mut)}

/* bio lock */
.bio{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(9,16,28,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);opacity:0;transition:opacity .35s;pointer-events:auto}
.bio.in{opacity:1}
.bio .fid{position:relative;width:120px;height:120px;color:var(--gold)}
.bio .fid svg{width:100%;height:100%}
.bio .fid .scan{position:absolute;left:10%;right:10%;height:2px;top:20%;background:linear-gradient(90deg,transparent,var(--gold3),transparent);animation:scan 1.1s ease-in-out infinite alternate}
.bio.ok .fid .scan{display:none}
@keyframes scan{to{top:80%}}
.bio .fid .face{transition:opacity .3s}
.bio .fid .chk{opacity:0;transition:opacity .3s}
.bio.ok .fid .face{opacity:0}
.bio.ok .fid .chk{opacity:1}
.bio .chk path{stroke-dasharray:40;stroke-dashoffset:40}
.bio.ok .chk path{animation:draw .5s var(--ease) forwards}
.bio .logo{font-size:26px;margin-bottom:26px}
.bio b{font-size:15px}
.bio small{color:var(--mut);font-size:12.5px}

/* certificate / invoice */
.cert{background:var(--ivory);color:var(--navy);border-radius:14px;padding:18px;border:1px solid var(--ivline);text-align:center}
.cert svg{width:100%;height:auto;display:block}
.inv-doc{background:#fff;color:#1B2230;border-radius:10px;padding:18px;font-size:12px;line-height:1.5}
.inv-doc h4{margin:0;font-family:var(--serif);font-size:20px;letter-spacing:.2em}
.inv-doc table{width:100%;border-collapse:collapse;margin-top:12px}
.inv-doc td{padding:6px 0;border-bottom:1px solid #EEE}
.inv-doc td:last-child{text-align:right}
.inv-doc .tot td{font-weight:800;border-bottom:0;font-size:13px}
.stamp{display:inline-block;margin-top:12px;padding:4px 10px;border:1px dashed #9A8A6A;color:#9A8A6A;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}

/* add watch flow */
.scanbox{position:relative;height:200px;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#1E3150,#0A1321);border:1px solid var(--line)}
.scanbox .card3{position:absolute;left:50%;top:50%;width:170px;height:110px;margin:-55px 0 0 -85px;border-radius:10px;background:linear-gradient(135deg,#F3ECDD,#D9CCB0);box-shadow:0 12px 24px rgba(0,0,0,.4);transform:rotate(-6deg);color:var(--navy);padding:12px;font-size:9px}
.scanbox .card3 b{font-family:var(--serif);font-size:14px;letter-spacing:.2em}
.scanbox .beam{position:absolute;left:12%;right:12%;height:2px;top:15%;background:linear-gradient(90deg,transparent,var(--gold3),transparent);box-shadow:0 0 12px var(--gold);animation:scan 1s ease-in-out infinite alternate}
.verif{text-align:center;padding:10px 0}
.verif .ring{position:relative;width:120px;height:120px;margin:10px auto 16px}
.verif .ring svg{width:100%;height:100%}
.verif .ring .arc{stroke-dasharray:340;stroke-dashoffset:340;animation:arc 1.6s var(--ease) forwards}
@keyframes arc{to{stroke-dashoffset:0}}
.verif ol{list-style:none;margin:0 auto;padding:0;text-align:left;max-width:260px}
.verif li{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:13px;color:var(--mut);transition:color .3s}
.verif li.on{color:var(--ink)}
.verif li i{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.verif li.on i{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.verif li i .ic{width:11px;height:11px}

/* ===== side panel ===== */
.panel{flex:none;width:400px;padding:26px 24px 22px;border-radius:22px;background:rgba(19,32,52,.78);border:1px solid #23375A;backdrop-filter:blur(10px);font-size:13.5px;line-height:1.55;color:#C3CAD6;max-height:calc(100vh - var(--bh) - 44px);overflow-y:auto;position:sticky;top:calc(var(--bh) + 22px);scrollbar-width:thin}
.panel .kicker{margin:0;font-size:10.5px;font-weight:800;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.panel h2{margin:8px 0 8px;font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.15;color:#fff}
.panel p{margin:0 0 14px}
.panel h3{margin:20px 0 10px;font-size:10.5px;font-weight:800;letter-spacing:.16em;color:#8E9AB0;text-transform:uppercase}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps button{display:flex;gap:12px;align-items:flex-start;width:100%;padding:10px 12px;border-radius:10px;border:1px solid #23375A;background:rgba(10,19,33,.4);text-align:left;transition:border-color .2s,background .2s}
.steps button:hover{border-color:var(--line2);background:rgba(201,169,106,.06)}
.steps .n{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid #3A4E70;font-size:11.5px;font-weight:800;color:#C3CAD6;transition:all .3s}
.steps .n .ic{width:13px;height:13px;display:none}
.steps li.done .n{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.steps li.done .n .ic{display:block}
.steps li.done .n em{display:none}
.steps b{display:block;color:#EEF1F6;font-size:13.5px}
.steps small{display:block;color:#8E9AB0;font-size:12px;line-height:1.45;margin-top:2px}
.idx{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.idx button{padding:7px 4px;border-radius:8px;border:1px solid #23375A;background:rgba(10,19,33,.4);font-size:11px;font-weight:700;color:#C3CAD6;text-align:center;line-height:1.2;transition:all .2s}
.idx button:hover,.idx button.cur{border-color:var(--gold);color:var(--gold3)}
.idx button small{display:block;font-size:9.5px;font-weight:600;color:#7F8BA0;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emp{display:flex;gap:6px;margin-top:6px}
.emp button{flex:1;padding:7px 6px;border-radius:8px;border:1px dashed #33476A;font-size:11.5px;color:#C3CAD6}
.emp button:hover{border-color:var(--gold);color:var(--gold3)}
.pctl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;margin-top:8px;border-radius:10px;border:1px solid #23375A;background:rgba(10,19,33,.4)}
.pctl b{color:#EEF1F6;font-size:13px;display:block}
.pctl small{font-size:11.5px;color:#8E9AB0}
.pfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid #23375A}
.pfoot small{font-size:11.5px;color:#7F8BA0;line-height:1.45}
.reset{flex:none;padding:9px 14px;border-radius:99px;border:1px solid var(--gold);color:var(--gold3);font-size:12px;font-weight:700}
.reset:hover{background:var(--golds)}
.team{font-size:12px;color:#8E9AB0}
.fab{display:none}


/* ===== v2: alive layer ===== */
.gold-t{color:#9A7A3A!important;border-bottom-color:var(--gold)!important;font-weight:800}
.bal{position:absolute;top:50%;left:50%;width:300px;height:300px;margin:-172px 0 0 -150px;opacity:.24;pointer-events:none}
.bal .osc{animation:osc 1s cubic-bezier(.45,0,.55,1) infinite alternate}
.bal .hair{animation:hair 1s cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes osc{from{transform:rotate(-140deg)}to{transform:rotate(140deg)}}
@keyframes hair{from{transform:rotate(-40deg) scale(.86)}to{transform:rotate(40deg) scale(1.08)}}
.splash .logo,.splash .gl,.splash .sub{position:relative}
.splash{cursor:pointer}
/* spring press */
.btn,.ibtn,.chip,.tile,.opt,.colc,.drop,.sto,.emb .rd,.shutter,.essai,.store,.nf .body{transition:transform .5s cubic-bezier(.34,1.56,.64,1),background .2s,border-color .2s,opacity .2s,box-shadow .2s,color .2s}
.btn:active,.ibtn:active,.chip:active,.tile:active,.opt:active,.colc:active,.drop:active,.sto:active,.essai:active,button.li:active{transform:scale(.955);transition-duration:.09s}
/* staggered entrances (first paint of a screen only) */
.scr.enter :is(.tile,.li,.oc,.wl,.nf,.ev,.store,.art,.tli,.sto,.spec,.drop,.essai,.pv){animation:cardIn .55s var(--ease) both}
.scr.enter :is(.tile,.li,.oc,.wl,.nf,.ev,.store,.art,.tli,.sto,.spec,.pv):nth-child(2){animation-delay:.05s}
.scr.enter :is(.tile,.li,.oc,.wl,.nf,.ev,.store,.art,.tli,.sto,.spec,.pv):nth-child(3){animation-delay:.1s}
.scr.enter :is(.tile,.li,.oc,.wl,.nf,.ev,.store,.art,.tli,.sto,.spec,.pv):nth-child(4){animation-delay:.15s}
.scr.enter :is(.li,.nf,.ev,.store,.tli,.pv):nth-child(5){animation-delay:.2s}
.scr.enter :is(.li,.nf,.ev,.store,.tli):nth-child(n+6){animation-delay:.25s}
@keyframes wIn{from{opacity:0;transform:scale(.94)}}
/* stories */
.stories{padding-top:16px;padding-bottom:2px}
.sto{display:flex;flex-direction:column;align-items:center;gap:6px;width:66px}
.sto .ring{position:relative;display:grid;place-items:center;width:64px;height:64px;border-radius:50%}
.sto .ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#F1DDB0,#C9A96A,#7A5A2A,#E8D3A2,#F1DDB0);-webkit-mask:radial-gradient(circle,transparent 29.5px,#000 30.5px);mask:radial-gradient(circle,transparent 29.5px,#000 30.5px);animation:spin 7s linear infinite}
.sto.seen .ring::before{background:var(--line);animation:none}
.sto .in{position:relative;width:56px;height:56px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#274474,#101D32)}
.sto .in svg{height:150%;width:auto;margin-top:34%}
.sto .in svg[viewBox="0 0 64 64"]{height:70%;margin:0}
.sto small{font-size:11px;font-weight:700;color:var(--ink2);white-space:nowrap}
.story{position:absolute;inset:0;z-index:92;display:flex;flex-direction:column;color:#fff;pointer-events:auto;animation:stIn .35s var(--ease);touch-action:none;user-select:none}
.story.out{animation:stOut .25s ease forwards}
@keyframes stIn{from{opacity:0;transform:scale(.94)}}
@keyframes stOut{to{opacity:0;transform:scale(.96)}}
.sbars{display:flex;gap:4px;padding:calc(var(--sb) + 8px) 12px 0}
.sbars i{flex:1;height:2.5px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}
.sbars b{display:block;height:100%;background:#fff}
.shd{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 8px 10px 14px}
.shd .ai{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--bg);color:var(--gold);font-family:var(--serif);font-weight:700;border:1px solid var(--line2)}
.shd>span:nth-child(2){flex:1}.shd b{display:block;font-size:13px}.shd small{font-size:11px;color:rgba(255,255,255,.7)}
.shd .xbtn{display:grid;place-items:center;width:42px;height:42px;color:#fff}
.snav{position:absolute;top:0;bottom:0;z-index:1}.snav.l{left:0;width:32%}.snav.r{right:0;width:68%}
.sbody{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:0 26px calc(40px + env(safe-area-inset-bottom));pointer-events:none}
.sbody .btn{pointer-events:auto;width:auto;margin-top:20px}
.sbody svg.w{height:44%;max-height:330px;margin:auto 0 20px;filter:drop-shadow(0 24px 24px rgba(0,0,0,.5));animation:floatS 6s ease-in-out infinite}
@keyframes floatS{50%{transform:translateY(-8px) rotate(-2deg)}}
.sart{width:100%;height:40%;margin:auto 0 20px;border-radius:18px;overflow:hidden}.sart svg{width:100%;height:100%;display:block}
.sbody .h1{font-size:28px;margin-top:8px}.sbody p{margin:10px 0 0;color:rgba(255,255,255,.82);font-size:14px;line-height:1.5}
/* live drop */
.drop{position:relative;display:flex;gap:14px;align-items:center;width:100%;margin-top:18px;padding:12px 14px;text-align:left;border-radius:14px;overflow:hidden;background:linear-gradient(110deg,rgba(201,169,106,.17),rgba(22,37,61,.92) 58%);border:1px solid var(--line2)}
.drop::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.09) 50%,transparent 60%);transform:translateX(-100%);animation:shine 6s ease-in-out 1.2s infinite;pointer-events:none}
@keyframes shine{25%,100%{transform:translateX(100%)}}
.drop .dw{flex:none;display:grid;place-items:center;width:70px;height:84px;border-radius:10px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#274474,#101D32)}
.drop .dw svg{height:100%;width:auto}
.drop .dx{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.drop .h3{font-size:16px}
.dl{font-size:12.5px;color:var(--ink2)}.dl b,.livebar b[data-left]{display:inline-block;color:var(--gold2);font-size:15px;font-variant-numeric:tabular-nums}
.bump{animation:bump .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{30%{transform:translateY(-4px) scale(1.3);color:#fff}}
.dbar{height:3px;border-radius:3px;background:var(--line);overflow:hidden}.dbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold3));transition:width .8s var(--ease)}
.dseen{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mut)}.dseen b{color:var(--ink);font-variant-numeric:tabular-nums}
.pulse{flex:none;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(98,192,143,.6);animation:pulseg 1.8s infinite}
@keyframes pulseg{70%{box-shadow:0 0 0 7px rgba(98,192,143,0)}100%{box-shadow:0 0 0 0 rgba(98,192,143,0)}}
.livebar{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:12px;color:var(--ink2)}.livebar b{color:var(--gold2)}
/* PDP hero */
.car .slide{position:relative;transition:background .8s}
.car .slide svg.w{transform-origin:50% 50%}
.car.lume .slide{background:radial-gradient(70% 60% at 50% 45%,#07101C,#010308 75%)}
.lumeL,.darkL{opacity:0;transition:opacity .9s;pointer-events:none}
.car.lume .lumeL{opacity:1}.car.lume .darkL{opacity:.86}
.lumebtn{position:absolute;right:18px;bottom:12px;z-index:3;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;border:1px solid var(--line2);background:rgba(10,19,33,.55);color:var(--gold3);font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;transition:all .4s}
.lumebtn .ic{width:14px;height:14px}
.lumebtn[aria-pressed="true"]{background:#A9F6D0;color:#05281A;border-color:#A9F6D0;box-shadow:0 0 22px rgba(169,246,208,.55)}
.car .vlabel{bottom:18px}
.crownhit{position:absolute;left:-99px;width:44px;height:44px;border-radius:50%;touch-action:none;cursor:ns-resize;z-index:2}
.crownhit::after{content:"";position:absolute;inset:11px;border-radius:50%;border:1.5px solid rgba(201,169,106,.75);animation:pulse 2.2s infinite}
.crownhit.used::after{animation:none;opacity:.35}.crownhit.on::after{border-color:#fff;opacity:1}
.settime{position:absolute;top:calc(var(--sb) + 64px);left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:99px;background:rgba(10,19,33,.78);border:1px solid var(--line2);font-size:15px;font-weight:800;letter-spacing:.08em;color:var(--gold3);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .3s;pointer-events:none}
.settime.on{opacity:1}
/* compare */
.cmpk{flex-wrap:nowrap;overflow-x:auto;margin:0 -20px;padding:0 20px 6px;scrollbar-width:none}.cmpk .chip{flex:none}
.cmph{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}.cmph>div{text-align:center;min-width:0}
.cmph .wimg{height:160px;border-radius:12px}.cmph .h3{display:block;margin-top:8px;font-size:14px}
.cmpr{display:grid;grid-template-columns:1fr 92px 1fr;gap:6px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px;text-align:center}
.cmpr small{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.cmpr.diff span{color:var(--gold3);font-weight:700}
/* wrist */
.wrv{margin:8px 0 2px;text-align:center;font-size:14px;color:var(--mut)}.wrv b{font-family:var(--serif);font-size:46px;font-weight:600;color:var(--ink)}
.wrr{width:100%;height:30px;accent-color:var(--gold)}
/* AR detection */
.frame .scanl{position:absolute;left:10px;right:10px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold3),transparent);box-shadow:0 0 14px 2px rgba(201,169,106,.6);animation:scanf 1.2s ease-in-out infinite alternate}
@keyframes scanf{to{top:calc(100% - 2px)}}
.frame.lock .scanl{opacity:0;transition:opacity .3s}
.frame.lock i{animation:lockin .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes lockin{0%{transform:scale(1.6);opacity:0}}
.frame.lock::after{content:"";position:absolute;inset:40px;border-radius:50%;border:2px solid var(--gold3);animation:ringout 1s ease-out forwards}
@keyframes ringout{from{transform:scale(.3);opacity:1}to{transform:scale(1.35);opacity:0}}
.wov.show svg{animation:land .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes land{from{transform:scale(1.35) translateY(-14px);opacity:0}}
.ar.cust .rail,.ar.cust .custbtn,.ar.cust .arbot{opacity:0;pointer-events:none;transition:opacity .3s}
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:96}
/* portfolio screenshot mode (?shot=home|pdp|ar|club|collection) */
html.shot{--sb:47px}
html.shot body::before,html.shot .banner,html.shot .panel,html.shot .fab{display:none!important}
html.shot .stage{display:block;padding:0;min-height:0}
html.shot .phone{position:relative;top:0;width:100vw;height:100vh;padding:0;border-radius:0;background:none;box-shadow:none}
html.shot .phone::before{display:none}html.shot .app{border-radius:0}html.shot .sbar{display:flex}
html.shot .crownhit::after{animation:none;opacity:0}
@media (prefers-reduced-motion:reduce){.bal .osc,.bal .hair,.sto .ring::before,.drop::after,.frame .scanl{animation:none!important}}
@media (max-width:1180px){.stage{gap:32px}.panel{width:360px}}
@media (max-width:860px){.stage{flex-direction:column;align-items:center}.phone{position:relative;top:0}.panel{position:relative;top:0;width:560px;max-width:100%;max-height:none}}
@media (max-width:500px){
  :root{--sb:env(safe-area-inset-top,0px);--bh:40px}
  body::before{display:none}
  .banner{position:relative;padding:0 12px;gap:10px;font-size:12px}
  .banner .long{display:none}.banner .short{display:inline}
  .stage{display:block;padding:0;min-height:0}
  .phone{width:100%;height:calc(100vh - var(--bh));height:calc(100dvh - var(--bh));padding:0;border-radius:0;background:none;box-shadow:none}
  .phone::before{display:none}
  .app{border-radius:0}
  .sbar{display:none}
  .app.offline .scr{padding-top:calc(var(--sb) + 34px)}
  .scr{padding-top:var(--sb)}
  .splash,.ar,.wel{padding-top:0}
  .panel{position:fixed;inset:0;z-index:100;width:auto;max-height:none;border-radius:0;background:#0C1626;padding:22px 18px 40px;transform:translateY(100%);transition:transform .4s var(--ease);visibility:hidden}
  .panel.open{transform:none;visibility:visible}
  .fab{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--navy);font-family:var(--serif);font-weight:700;font-size:16px;font-style:italic;animation:fabIn 2.4s 3s ease-in-out 2}
  @keyframes fabIn{50%{box-shadow:0 0 0 7px rgba(201,169,106,.25)}}
  .panel .pclose{display:grid}
  .panel .kicker{padding-right:52px}
}
.pclose{display:none;position:absolute;top:16px;right:16px;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid #2A3D5C;color:#fff}
