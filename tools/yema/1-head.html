<style>
:root{
 --bg:#0F1B2D;--bg2:#0A1321;--bg3:#13223A;--card:#16253D;--card2:#1B2D49;--line:#24385A;--line2:rgba(201,169,106,.32);
 --gold:#C9A96A;--gold2:#D4B36F;--gold3:#E8D3A2;--golds:rgba(201,169,106,.12);
 --ink:#EFE9DD;--ink2:#C9CFDA;--mut:#8E9AB0;--mut2:#66748B;
 --ivory:#F7F2E8;--ivline:#E0D6C3;--navy:#13223A;--ok:#62C08F;--err:#E8816F;
 --serif:"Playfair Display",Georgia,"Times New Roman",serif;
 --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --ios:cubic-bezier(.32,.72,0,1);
 --sb:46px;--bh:44px;--nav:44px;--tabh:84px;--sab:20px;
 color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#08111D;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 600px at 30% 10%,rgba(201,169,106,.10),transparent 60%),radial-gradient(700px 500px at 85% 90%,rgba(40,70,120,.35),transparent 60%)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.ic{width:20px;height:20px;flex:none;display:block}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== page shell (desktop) ===== */
.banner{position:sticky;top:0;z-index:60;height:var(--bh);display:flex;align-items:center;gap:16px;padding:0 22px;background:rgba(8,15,26,.92);backdrop-filter:blur(8px);border-bottom:1px solid #1B2A42;color:#BFC7D4;font-size:13px}
.banner a{color:var(--gold3);font-weight:700;text-decoration:none;white-space:nowrap}
.banner a:hover{text-decoration:underline}
.banner .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner .txt b{color:#fff}
.lng{border:1px solid #2A3D5C;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;color:#DCE3EE;white-space:nowrap}
.stage{position:relative;min-height:calc(100vh - var(--bh));display:flex;align-items:flex-start;justify-content:center;gap:56px;padding:22px 24px 30px}
.phone{position:sticky;top:calc(var(--bh) + 22px);flex:none;width:392px;height:clamp(640px,calc(100vh - var(--bh) - 50px),846px);padding:10px;border-radius:56px;background:linear-gradient(145deg,#2B3A52,#0B111B 40%,#1E2A3D);box-shadow:0 0 0 1px #33445F inset,0 40px 90px -30px rgba(0,0,0,.8),0 10px 30px rgba(0,0,0,.35)}
.app{position:relative;width:100%;height:100%;overflow:hidden;border-radius:46px;background:var(--bg);font-size:14px;line-height:1.45;color:var(--ink);isolation:isolate;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app input,.app textarea,.app .sel{-webkit-user-select:text;user-select:text}
.sbar{position:absolute;top:0;left:0;right:0;height:var(--sb);z-index:80;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 36px;font-weight:700;font-size:14px;color:#fff;pointer-events:none}
.sbar::after{content:"";position:absolute;left:50%;top:10px;width:116px;height:32px;margin-left:-58px;border-radius:20px;background:#000}
.sbar .r{display:flex;gap:6px;align-items:center}.sbar svg{height:12px;width:auto}
.sbar .off{display:none}.app.offline .sbar .wifi{display:none}.app.offline .sbar .off{display:block}
.hind{position:absolute;left:50%;bottom:7px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(255,255,255,.55);z-index:85;pointer-events:none}

/* ===== screens & navigation ===== */
.view{position:absolute;inset:0;overflow:hidden}
.scr{position:absolute;inset:0;background:var(--bg);overflow:hidden;contain:layout paint}
.scr.off{visibility:hidden;pointer-events:none}
.scr.anim{will-change:transform}
.scr>.dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:30}
.sc{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-top:calc(var(--sb) + var(--nav));padding-bottom:28px;touch-action:pan-y}
.sc::-webkit-scrollbar{display:none}
.tabs-on .sc{padding-bottom:calc(var(--tabh) + 22px)}
.scr.hero .sc{padding-top:0}
.scr.bar .sc{padding-bottom:calc(128px + var(--sab))}
.nb{position:absolute;top:0;left:0;right:0;z-index:20;height:calc(var(--sb) + var(--nav));padding:var(--sb) 8px 0;display:flex;align-items:center;gap:4px;transition:background .25s,border-color .25s,box-shadow .25s;border-bottom:.5px solid transparent}
.nb::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(15,27,45,.72);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);opacity:0;transition:opacity .25s}
.scr.solid .nb::before,.scr.scd .nb::before{opacity:1}
.scr.scd .nb{border-bottom-color:rgba(255,255,255,.08)}
.nb .nt{position:absolute;left:96px;right:96px;bottom:0;height:var(--nav);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;transition:opacity .2s,transform .2s}
.scr.lt:not(.scd) .nb .nt,.scr.hero:not(.scd) .nb .nt{opacity:0;transform:translateY(4px)}
.bk.io span{display:none}
.nb .sp{flex:1}
.bk{display:flex;align-items:center;gap:0;height:40px;padding:0 10px 0 2px;border-radius:20px;color:var(--gold2);font-size:16px;font-weight:600;max-width:150px;white-space:nowrap}
.bk .ic{width:26px;height:26px;margin-right:-2px}
.bk span{overflow:hidden;text-overflow:ellipsis}
.scr.hero:not(.scd) .bk{background:rgba(10,19,33,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;padding-right:12px}
.nbb{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:var(--ink);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.nbb:active{transform:scale(.88);transition-duration:.08s}
.nbb .ic{width:21px;height:21px}
.scr.hero:not(.scd) .nbb{background:rgba(10,19,33,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.nbb[aria-pressed="true"]{color:var(--gold2)}
.badge{position:absolute;top:1px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--gold);color:var(--navy);font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.badge[data-n="0"]{transform:scale(0)}
.badge.bump{animation:bump .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{40%{transform:scale(1.45)}}
.lt-h{margin:6px 18px 4px;font-family:var(--serif);font-weight:600;font-size:32px;line-height:1.1;letter-spacing:-.01em}
.lt-s{margin:0 18px;color:var(--mut);font-size:13px}
.edge{position:absolute;left:0;top:calc(var(--sb) + var(--nav));bottom:0;width:18px;z-index:40;touch-action:none;display:none}
.edge.on{display:block}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:50;height:var(--tabh);display:grid;grid-template-columns:repeat(5,1fr);align-items:start;padding:8px 6px 0;border-top:.5px solid rgba(255,255,255,.08);transition:transform .32s var(--ios)}
.tabbar::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(12,22,37,.78);backdrop-filter:saturate(1.6) blur(20px);-webkit-backdrop-filter:saturate(1.6) blur(20px)}
.app:not(.tabs-on) .tabbar{transform:translateY(150%);pointer-events:none}
.tb{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:4px;color:var(--mut);font-size:10px;font-weight:700;letter-spacing:.04em;transition:color .2s}
.tb .ic{width:24px;height:24px;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.tb:active .ic{transform:scale(.85);transition-duration:.08s}
.tb[aria-current="page"]{color:var(--gold2)}
.tb.c .ring{display:grid;place-items:center;width:52px;height:52px;margin-top:-22px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#1D3151,#0F1B2D);border:1px solid var(--line2);box-shadow:0 8px 18px -8px rgba(0,0,0,.7),0 0 0 4px rgba(12,22,37,.9);color:var(--ink)}
.tb.c[aria-current="page"] .ring{border-color:var(--gold);color:var(--gold2)}

/* ===== type & primitives ===== */
.serif{font-family:var(--serif)}
.h1{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.12;margin:0}
.h2{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.2;margin:0}
.h3{font-family:var(--serif);font-weight:600;font-size:16.5px;line-height:1.25;margin:0}
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.lbl.g{color:var(--gold)}
.p{margin:6px 0 0;color:var(--ink2);font-size:13.5px;line-height:1.55}
.small{font-size:12.5px}.muted{color:var(--mut)}.center{text-align:center}
.pad{padding:0 18px}.sec{margin-top:26px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 18px 12px}
.link{white-space:nowrap;color:var(--gold2);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.link .ic{width:14px;height:14px}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding:0 20px;border-radius:12px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;width:100%;text-align:center;transition:transform .45s cubic-bezier(.34,1.56,.64,1),background .2s,opacity .2s}
.btn:active{transform:scale(.965);transition-duration:.08s}
.btn .ic{width:18px;height:18px}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--navy);box-shadow:0 10px 24px -14px rgba(201,169,106,.8)}
.btn.line{border:1px solid var(--gold);color:var(--gold2)}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--ink)}
.btn.navy{background:var(--navy);color:var(--gold2)}
.btn.black{background:#000;color:#fff;letter-spacing:.02em;text-transform:none;font-size:16px;font-weight:600}
.btn.danger{background:#B54A3A;color:#fff}
.btn.sm{min-height:38px;font-size:10.5px;padding:0 14px;width:auto;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.loading{color:transparent!important}
.btn.loading::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;border:2px solid var(--navy);border-right-color:transparent;animation:spin .7s linear infinite}
.btn.line.loading::after,.btn.ghost.loading::after{border-color:var(--gold);border-right-color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink2);transition:all .18s}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold2);background:var(--golds)}
.chip:active{transform:scale(.95)}
.seg{display:flex;gap:6px;overflow-x:auto;padding:4px 18px 2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;min-height:34px;padding:0 14px;border-radius:99px;font-size:12.5px;font-weight:700;color:var(--mut);background:rgba(255,255,255,.04);transition:all .2s}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--navy)}
.pills{display:flex;gap:4px;padding:3px;margin:0 18px;border-radius:10px;background:rgba(118,118,128,.24)}
.pills button{flex:1;min-height:32px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--ink2);transition:all .25s var(--ios)}
.pills button[aria-selected="true"]{background:#4A5669;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tgl{position:relative;width:51px;height:31px;flex:none;border-radius:99px;background:rgba(120,120,128,.32);transition:background .25s}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.3);transition:transform .3s var(--ios)}
.tgl[aria-checked="true"]{background:var(--gold)}
.tgl[aria-checked="true"]::after{transform:translateX(20px)}
.tgl[disabled]{opacity:.45}
.list{background:var(--card);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:11px 16px;text-align:left;font-size:15px;font-weight:600;position:relative}
.li+.li::before{content:"";position:absolute;top:0;left:50px;right:0;height:.5px;background:rgba(255,255,255,.1)}
button.li:active{background:rgba(255,255,255,.06)}
.li>.ic{color:var(--gold2)}
.li .chev{width:15px;height:15px;color:var(--mut2)}
.li .v{color:var(--mut);font-weight:500;font-size:14px}
.li .tx{flex:1;min-width:0}
.li .tx small{display:block;color:var(--mut);font-weight:500;font-size:12px;margin-top:2px;line-height:1.4}
.grp{margin:24px 18px 0}
.grp>.lbl{display:block;margin:0 4px 8px}
.card{background:var(--card);border-radius:14px}
.fld{display:block;margin-top:14px}
.fld>span{display:flex;justify-content:space-between;margin-bottom:7px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.inp{display:flex;align-items:center;gap:8px;min-height:50px;padding:0 14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);transition:border-color .2s}
.inp input,.inp select,.inp textarea{flex:1;min-width:0;height:48px;border:0;outline:0;background:none;color:var(--ink);font-size:16px}
.inp select option{background:var(--bg2)}
.inp textarea{height:auto;min-height:88px;padding:12px 0;resize:vertical;line-height:1.5}
.inp:focus-within{border-color:var(--gold)}
.inp.err{border-color:var(--err);animation:shake .35s}
.inp.lt{background:#fff;border-color:transparent;color:var(--navy)}
.inp.lt input{color:var(--navy)}
.ferr{display:block;margin-top:6px;font-size:12px;color:var(--err);font-weight:600}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.srch{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;margin:8px 18px 0;border-radius:11px;background:rgba(118,118,128,.24)}
.srch input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font-size:16px}
.srch input::placeholder{color:var(--mut)}
.srch .ic{width:17px;height:17px;color:var(--mut)}
.bdg{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:6px;background:var(--golds);color:var(--gold3);font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.bdg .ic{width:12px;height:12px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:0 18px 4px;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-padding:0 18px;touch-action:pan-x pan-y}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:none}

/* photos */
.ph{position:relative;display:block;aspect-ratio:3/4;overflow:hidden;background:radial-gradient(90% 70% at 50% 42%,#20355A,#122036 72%)}
.ph::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.06) 50%,transparent 70%);background-size:220% 100%;animation:shim 1.3s linear infinite}
.ph.ok::before{display:none}
@keyframes shim{from{background-position:130% 0}to{background-position:-90% 0}}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .35s;-webkit-user-drag:none}
.ph.ok img{opacity:1}
.ph.sq{aspect-ratio:1}
.ph.zoom img{transform:scale(1.35) translateY(4%)}

/* watch card */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px}
.wc{position:relative;display:flex;flex-direction:column;background:var(--card);border-radius:14px;overflow:hidden;text-align:left}
.wc .main{display:flex;flex-direction:column;text-align:left;width:100%;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.wc .main:active{transform:scale(.97);transition-duration:.08s}
.wc .meta{padding:10px 12px 12px}
.wc .nm{display:block;font-family:var(--serif);font-weight:600;font-size:14.5px;line-height:1.25;margin-top:3px;min-height:36px}
.wc .pr{display:block;margin-top:5px;font-size:13.5px;font-weight:800}
.wc .lbl{font-size:9.5px}
.hscroll .wc{width:162px}
.tag{position:absolute;top:9px;left:9px;z-index:2;padding:3px 7px;border-radius:5px;background:var(--gold);color:var(--navy);font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.tag.o{background:rgba(10,19,33,.72);color:var(--gold3)}
.heart{position:absolute;top:6px;right:6px;z-index:2;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;color:var(--ink);transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.heart .ic{width:18px;height:18px}
.heart[aria-pressed="true"]{color:var(--gold2)}
.heart:active{transform:scale(.8);transition-duration:.08s}
.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{40%{transform:scale(1.35)}}

/* overlays */
.layer{position:absolute;inset:0;z-index:70;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .35s var(--ios);pointer-events:auto}
.scrim.in{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - var(--sb) - 12px);display:flex;flex-direction:column;background:var(--bg3);border-radius:16px 16px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.45);transform:translateY(105%);transition:transform .42s var(--ios);pointer-events:auto;will-change:transform}
.sheet.in{transform:none}
.sheet.drag{transition:none}
.sheet.light{background:var(--ivory);color:var(--navy)}
.sheet.light .p{color:#4F5869}.sheet.light .lbl{color:#7A7F8A}
.grab{flex:none;display:grid;place-items:center;height:22px;cursor:grab;touch-action:none}
.grab i{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.22)}
.sheet.light .grab i{background:rgba(19,34,58,.2)}
.sh-h{display:flex;align-items:center;gap:10px;padding:2px 16px 12px 20px;touch-action:none}
.sh-h .h2{flex:1}
.sh-b{flex:1;min-height:0;overflow-y:auto;padding:0 20px 18px;overscroll-behavior:contain;scrollbar-width:none}
.sh-b::-webkit-scrollbar{display:none}
.sh-f{flex:none;display:flex;gap:10px;padding:12px 20px calc(14px + var(--sab));border-top:.5px solid rgba(255,255,255,.08)}
.sheet.light .sh-f{border-top-color:var(--ivline)}
.xbtn{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);color:var(--ink2)}
.xbtn .ic{width:16px;height:16px}
.sheet.light .xbtn{background:rgba(19,34,58,.08);color:#4F5869}
.dlg{position:absolute;left:36px;right:36px;top:50%;padding:22px 18px 16px;border-radius:16px;background:rgba(36,46,66,.96);backdrop-filter:blur(20px);text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.5);transform:translateY(-50%) scale(1.1);opacity:0;transition:all .28s var(--ios);pointer-events:auto}
.dlg.in{transform:translateY(-50%);opacity:1}
.dlg .h3{font-family:var(--sans);font-weight:700;font-size:17px;margin-bottom:6px}
.dlg p{margin:0 0 16px;color:var(--ink2);font-size:13.5px;line-height:1.5}
.dlg .acts{display:flex;flex-direction:column;gap:8px}
.toasts{position:absolute;left:10px;right:10px;top:calc(var(--sb) + 6px);z-index:90;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;max-width:100%;padding:11px 16px;border-radius:18px;background:rgba(40,52,74,.9);backdrop-filter:saturate(1.6) blur(20px);-webkit-backdrop-filter:saturate(1.6) blur(20px);color:#fff;font-size:13.5px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:tIn .45s var(--ios);pointer-events:auto}
.toast .ic{width:18px;height:18px;color:var(--gold2)}
.toast button{margin-left:4px;color:var(--gold2);font-weight:800;font-size:13px}
.toast.out{animation:tOut .3s var(--ios) forwards}
@keyframes tIn{from{opacity:0;transform:translateY(-30px) scale(.95)}}
@keyframes tOut{to{opacity:0;transform:translateY(-24px)}}
.pushb{position:absolute;left:8px;right:8px;top:calc(var(--sb) + 4px);z-index:95;display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:22px;background:rgba(236,230,218,.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#141A24;box-shadow:0 20px 40px rgba(0,0,0,.45);text-align:left;transform:translateY(-150%);transition:transform .5s var(--ios);pointer-events:auto}
.pushb.in{transform:none}
.pushb .ai{flex:none;width:38px;height:38px;border-radius:9px;background:var(--bg);display:grid;place-items:center;color:var(--gold2);font-family:var(--serif);font-weight:700;font-size:19px}
.pushb .x{flex:1;min-width:0}.pushb .x b{display:block;font-size:13.5px}.pushb .x span{display:block;font-size:13px;line-height:1.35;color:#333A46}
.pushb .ap{font-size:11px;font-weight:700;color:#6A717D;margin-bottom:1px}
.pushb small{position:absolute;top:11px;right:14px;font-size:11px;color:#6A717D}
.offbar{position:absolute;left:12px;right:12px;bottom:calc(var(--tabh) + 10px);z-index:55;display:none;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:6px 12px;border-radius:12px;background:rgba(58,47,28,.94);backdrop-filter:blur(12px);color:var(--gold3);font-size:12px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.offbar .ic{width:15px;height:15px}
.app.offline .offbar{display:flex}
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:96}
.bio{position:absolute;inset:0;z-index:97;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(9,16,28,.94);backdrop-filter:blur(16px);opacity:0;transition:opacity .3s;pointer-events:auto}
.bio.in{opacity:1}
.bio .fid{position:relative;width:96px;height:96px;color:var(--gold2)}
.bio .fid svg{width:100%;height:100%}
.bio .scan{position:absolute;left:12%;right:12%;height:2px;top:22%;background:linear-gradient(90deg,transparent,var(--gold3),transparent);animation:scanv .9s ease-in-out infinite alternate}
.bio.ok .scan{display:none}
@keyframes scanv{to{top:78%}}
.bio .face{transition:opacity .25s}.bio .chk{opacity:0;transition:opacity .25s}
.bio.ok .face{opacity:0}.bio.ok .chk{opacity:1}
.bio small{color:var(--mut)}
.ptr{position:absolute;left:50%;top:calc(var(--sb) + var(--nav) + 6px);z-index:19;width:30px;height:30px;margin-left:-15px;border-radius:50%;display:grid;place-items:center;background:var(--card2);box-shadow:0 6px 14px rgba(0,0,0,.35);opacity:0;transform:scale(.6);pointer-events:none}
.ptr i{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold2);border-right-color:transparent}
.ptr.spin i{animation:spin .7s linear infinite}

/* ===== screens ===== */
/* splash */
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(80% 60% at 50% 45%,#1A2D4B,#0A1321 75%)}
.splash .appi{width:96px;height:96px;border-radius:24px;box-shadow:0 20px 40px rgba(0,0,0,.5);animation:appi .9s var(--ios) both}
.splash .wm{font-family:var(--serif);font-size:26px;letter-spacing:.34em;margin-right:-.34em;color:#fff;animation:fadeUp .8s .2s var(--ios) both}
.splash small{position:absolute;bottom:calc(36px + var(--sab));font-size:10px;font-weight:800;letter-spacing:.2em;color:#7E8AA0;animation:fadeUp .8s .35s both}
@keyframes appi{from{transform:scale(.6);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
/* welcome */
.wel .sc{display:flex;flex-direction:column;padding:0}
.wel .hero{position:relative;flex:1;min-height:330px;background:radial-gradient(70% 55% at 50% 45%,#233C64,#0F1B2D 72%)}
.wel .hero .ph{position:absolute;left:50%;top:calc(var(--sb) + 8px);bottom:6px;aspect-ratio:3/4;transform:translateX(-50%);background:none;animation:floatw 7s ease-in-out infinite}
@keyframes floatw{50%{transform:translateX(-50%) translateY(-8px)}}
.wel .ar{position:absolute;left:18px;bottom:18px;display:grid;place-items:center;width:74px;height:66px;border:1px solid rgba(255,255,255,.25);font-family:var(--serif);font-size:30px;color:#fff;background:rgba(15,27,45,.4);backdrop-filter:blur(6px)}
.wel .ar sup{position:absolute;top:8px;right:10px;font-size:14px;color:var(--gold2)}
.wel .sr{position:absolute;right:18px;bottom:20px;text-align:right;font-size:10px;font-weight:800;letter-spacing:.22em;line-height:1.9;color:#D9DEE6}
.wel .ws{padding:26px 22px calc(20px + var(--sab));border-radius:22px 22px 0 0;margin-top:-16px;position:relative;background:var(--ivory);color:var(--navy)}
.wel .ws .h1{color:var(--navy)}
.wel .ws p{margin:10px 0 20px;color:#59606E;font-size:14px;line-height:1.55}
.wel .alt{display:flex;justify-content:space-between;margin-top:16px}
.tbtn{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#6B7385;padding:8px 0}
.tbtn.g{color:#9A7A3A}
/* login */
.or{display:flex;align-items:center;gap:14px;margin:22px 0;color:var(--mut);font-size:11px;font-weight:700;letter-spacing:.14em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.sso{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:50px;border-radius:12px;background:rgba(255,255,255,.06);font-weight:700;font-size:15px}
.sso+.sso{margin-top:10px}
.hint{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--gold3);font-size:12.5px}
.hint .ic{width:15px;height:15px}
/* consent */
.crow{display:flex;gap:14px;align-items:flex-start;padding:15px 0;border-top:1px solid var(--ivline)}
.crow b{display:block;font-size:14px}
.crow small{display:block;margin-top:4px;color:#6B7385;font-size:12.5px;line-height:1.45}
.crow .x{flex:1}
.crow .always{font-size:11px;font-weight:700;color:#9A8A6A;white-space:nowrap;padding-top:2px}
.dk .crow{border-top-color:rgba(255,255,255,.08)}.dk .crow small{color:var(--mut)}
.rg{background:linear-gradient(#0E1A2C,#0F1B2D)}
.rg .ivs{min-height:calc(100% - 60px);margin-top:12px;padding:14px 22px 28px;border-radius:22px 22px 0 0;background:var(--ivory);color:var(--navy)}
.rg .ivs .tgl{background:#DCD3C1}.rg .ivs .tgl[aria-checked="true"]{background:var(--gold)}
/* prefs */
.opt3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;border:1px solid var(--line);border-radius:12px;transition:all .2s}
.opt b{font-size:14px}.opt small{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--golds)}
.colc{position:relative;width:112px;border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;transition:border-color .2s}
.colc b{display:block;padding:8px 10px 9px;font-size:11.5px;font-weight:800;letter-spacing:.06em}
.colc .ck{position:absolute;top:7px;right:7px;z-index:2;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--navy);transform:scale(0);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.colc .ck .ic{width:13px;height:13px}
.colc[aria-pressed="true"]{border-color:var(--gold)}.colc[aria-pressed="true"] .ck{transform:scale(1)}
.rng{width:100%;accent-color:var(--gold);height:30px}
.scale{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;color:var(--mut2)}
/* home */
.hhead{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 18px 0}
.stories{padding-top:14px;padding-bottom:4px}
.sto{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px}
.sto .ring{position:relative;display:grid;place-items:center;width:66px;height:66px;border-radius:50%;padding:3px;background:conic-gradient(from 0deg,#F1DDB0,#C9A96A,#7A5A2A,#E8D3A2,#F1DDB0)}
.sto.seen .ring{background:var(--line)}
.sto .ring .ph{width:100%;height:100%;border-radius:50%;border:2.5px solid var(--bg);aspect-ratio:1}
.sto .ring .ph img{transform:scale(1.9) translateY(3%)}
.sto small{font-size:11px;font-weight:600;color:var(--ink2);white-space:nowrap}
.drop{position:relative;display:flex;gap:14px;align-items:center;width:100%;margin-top:16px;padding:10px 14px 10px 8px;text-align:left;border-radius:16px;overflow:hidden;background:linear-gradient(110deg,rgba(201,169,106,.2),rgba(22,37,61,.95) 60%);border:1px solid var(--line2)}
.drop .ph{flex:none;width:92px;border-radius:12px;background:none}
.drop .ph img{transform:scale(1.25)}
.drop .dx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.drop .h3{font-size:17px}
.drop .pr{font-weight:800;color:var(--gold2)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{padding:14px;text-align:left;background:var(--card);border-radius:14px}
.tile .t{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:12.5px;font-weight:700}
.tile .t .ic{width:17px;height:17px;color:var(--gold2)}
.tile .n{margin-top:8px;font-size:12.5px;color:var(--mut)}
.tile .n b{font-size:24px;font-weight:800;color:var(--ink);margin-right:6px}
.tile.wide{grid-column:1/-1;display:flex;align-items:center;gap:12px;border:1px solid var(--line2)}
.essai{position:relative;display:block;width:100%;margin-top:14px;padding:18px 16px;min-height:120px;text-align:left;border-radius:16px;overflow:hidden;background:linear-gradient(100deg,#1A2B46 40%,#0F1B2D)}
.essai .ph{position:absolute;right:-18px;top:-6px;width:150px;background:none;transform:rotate(12deg)}
.essai .ib{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--navy);vertical-align:middle;margin-right:10px}
.essai .h2{display:inline;vertical-align:middle;font-size:20px}
.essai p{position:relative;max-width:210px;margin:10px 0 8px;color:var(--ink2);font-size:13px;line-height:1.5}
.cercle{position:relative;overflow:hidden;margin:0 18px;border-radius:16px;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px}
.cercle .bg{position:absolute;inset:0}.cercle .bg svg{width:100%;height:100%;display:block}
.cercle>*:not(.bg){position:relative}
.cercle .h1{font-size:24px;margin-top:8px}
.cercle p{margin:8px 0 14px;color:#D2D6DE;font-size:13px;line-height:1.5}
.emb{display:flex;flex-direction:column;align-items:center;gap:8px;width:92px}
.emb .ph{width:88px;border-radius:50%;aspect-ratio:1;border:1px solid var(--line)}
.emb .ph img{transform:scale(1.6) translateY(4%)}
.emb b{font-size:12.5px;font-weight:700}
/* catalogue */
.cnt{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 10px;font-size:12.5px;color:var(--mut)}
.cnt b{color:var(--ink)}
.cache{display:inline-flex;align-items:center;gap:6px;margin:10px 18px 0;padding:6px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--gold3);font-size:11.5px;font-weight:700}
.cache .ic{width:13px;height:13px}
.ckrow{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:42px;font-size:15px;font-weight:600;text-align:left}
.ckb{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid #4A5C7A;color:transparent;transition:all .2s}
.ckb .ic{width:13px;height:13px}
[aria-checked="true"]>.ckb{border-color:var(--gold);color:var(--navy);background:var(--gold)}
.fgrp{padding:16px 0;border-top:.5px solid rgba(255,255,255,.1)}
.fgrp:first-child{border-top:0;padding-top:2px}
.fgrp>.lbl{display:block;margin-bottom:10px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 30px 10px}
.empty svg{width:130px;height:130px;margin-bottom:12px}
.empty p{margin:6px 0 18px;color:var(--mut);font-size:13.5px;line-height:1.55;max-width:270px}
.empty .btn{width:auto}
/* pdp */
.gal{position:relative;background:radial-gradient(70% 55% at 50% 48%,#243E66,#0F1B2D 75%)}
.gal .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x pan-y}
.gal .track::-webkit-scrollbar{display:none}
.gal .slide{flex:none;width:100%;scroll-snap-align:center;padding-top:calc(var(--sb) + 20px)}
.gal .slide .ph{width:74%;margin:0 auto;background:none;touch-action:pan-x pan-y}
.gal .slide .ph img{transition:opacity .35s,transform .3s var(--ios)}
.gal .vl{position:absolute;left:18px;bottom:12px;font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.28);transition:all .3s var(--ios)}
.dots i.on{width:18px;background:var(--gold2)}
.pinfo{padding:16px 18px 0}
.ttl{display:flex;align-items:flex-start;gap:14px;margin-top:6px}
.ttl .h1{flex:1;font-size:26px}
.ttl .pr{font-size:18px;font-weight:800;color:var(--gold2);white-space:nowrap;padding-top:5px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.vopt{margin-top:18px}
.vopt .lbl{display:flex;justify-content:space-between;margin-bottom:8px}
.vopt .lbl b{color:var(--ink);letter-spacing:0;text-transform:none;font-size:12.5px}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.spec{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 6px;text-align:center;background:var(--card);border-radius:12px}
.spec .ic{color:var(--gold2)}
.spec small{font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.spec b{font-size:12.5px;line-height:1.25}
.acc{border-top:.5px solid rgba(255,255,255,.12)}
.acc:last-child{border-bottom:.5px solid rgba(255,255,255,.12)}
.acc>button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;font-family:var(--serif);font-size:16px;font-weight:600;text-align:left}
.acc>button .ic{width:16px;height:16px;color:var(--gold2);transition:transform .3s var(--ios)}
.acc.open>button .ic{transform:rotate(45deg)}
.acc .ab{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ios)}
.acc.open .ab{grid-template-rows:1fr}
.acc .ab>div{overflow:hidden}
.acc .in{padding:0 0 16px;color:var(--ink2);font-size:13.5px;line-height:1.6}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:.5px solid rgba(255,255,255,.07);font-size:13px}
.kv:first-child{border-top:0}.kv span{color:var(--mut)}.kv b{text-align:right;font-weight:700}
.cta{position:absolute;left:0;right:0;bottom:0;z-index:22;padding:10px 16px calc(12px + var(--sab));border-top:.5px solid rgba(255,255,255,.08)}
.cta::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(12,22,37,.84);backdrop-filter:saturate(1.6) blur(20px);-webkit-backdrop-filter:saturate(1.6) blur(20px)}
.cta .pl{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;font-size:12px;color:var(--mut)}
.cta .pl b{font-size:18px;color:var(--ink);font-weight:800}
.cta .bt{display:flex;gap:10px}
.cta .btn{min-height:48px;font-size:11.5px;letter-spacing:.04em;padding:0 12px;white-space:nowrap}
.zoomhint{position:absolute;right:16px;bottom:10px;display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--mut);font-weight:700}
.zoomhint .ic{width:13px;height:13px}
/* cart & checkout */
.ci{display:flex;gap:12px;padding:12px 0;border-top:.5px solid rgba(255,255,255,.1)}
.ci:first-child{border-top:0}
.ci .ph{flex:none;width:74px;border-radius:12px}
.ci .x{flex:1;min-width:0}
.ci .h3{font-size:15px}
.ci small{display:block;color:var(--mut);font-size:12px;margin-top:3px}
.ci .row{margin-top:8px}
.qty{display:inline-flex;align-items:center;border-radius:10px;background:rgba(255,255,255,.07)}
.qty button{display:grid;place-items:center;width:32px;height:32px}.qty button .ic{width:14px;height:14px}
.qty b{min-width:22px;text-align:center;font-size:14px}
.sum .kv{font-size:14px}.sum .kv.t{font-size:16px;padding-top:12px}.sum .kv.t b{font-size:18px}
.steps3{display:flex;gap:6px;margin:4px 18px 16px}
.steps3 i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
.steps3 i::after{content:"";position:absolute;inset:0;background:var(--gold2);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ios)}
.steps3 i.on::after{transform:none}
.opc{display:flex;gap:12px;align-items:flex-start;width:100%;padding:14px;margin-bottom:10px;text-align:left;border-radius:14px;background:var(--card);border:1.5px solid transparent;transition:border-color .2s}
.opc[aria-checked="true"]{border-color:var(--gold)}
.opc .rd{flex:none;width:20px;height:20px;margin-top:1px;border-radius:50%;border:1.5px solid #4A5C7A;display:grid;place-items:center}
.opc[aria-checked="true"] .rd{border-color:var(--gold)}.opc[aria-checked="true"] .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold)}
.opc b{display:block;font-size:14.5px}.opc small{display:block;margin-top:3px;color:var(--mut);font-size:12.5px;line-height:1.45}
.simu{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(98,192,143,.1);color:#9FE0BD;font-size:12.5px;font-weight:700;margin-bottom:14px}
.simu .ic{width:16px;height:16px}
.ok-hero{text-align:center;padding:6px 18px 4px}
.okmark{display:grid;place-items:center;width:78px;height:78px;margin:6px auto 14px;border-radius:50%;background:var(--golds);border:1px solid var(--gold);color:var(--gold2)}
.okmark svg{width:36px;height:36px}
.okmark path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .6s .15s var(--ios) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tl{position:relative;margin:0 18px;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:12px;bottom:12px;width:2px;background:var(--line)}
.tl .st{position:relative;padding:8px 0 16px}
.tl .st::before{content:"";position:absolute;left:-24px;top:10px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--mut2);transition:all .3s}
.tl .st.done::before{background:var(--gold);border-color:var(--gold)}
.tl .st.cur::before{box-shadow:0 0 0 5px rgba(201,169,106,.22)}
.tl .st b{display:block;font-size:14.5px}.tl .st small{color:var(--mut);font-size:12.5px}
.tl .st:not(.done) b{color:var(--mut)}
.ordc{display:flex;gap:12px;align-items:center;width:100%;padding:12px;margin-bottom:10px;text-align:left;background:var(--card);border-radius:14px}
.ordc .ph{flex:none;width:56px;border-radius:10px}
/* AR */
.ar{background:#05080D}
.ar .sc{padding:0;overflow:hidden}
.arst{position:absolute;inset:0;transition:transform .45s var(--ios)}
.bgl{position:absolute;inset:0;overflow:hidden}
.bgl video,.bgl svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame{position:absolute;left:50%;top:44%;width:230px;height:230px;margin:-115px 0 0 -115px;pointer-events:none;z-index:2;transition:opacity .3s}
.frame i{position:absolute;width:32px;height:32px;border:0 solid var(--gold);transition:all .5s var(--ios)}
.frame i:nth-of-type(1){left:0;top:0;border-left-width:2px;border-top-width:2px}
.frame i:nth-of-type(2){right:0;top:0;border-right-width:2px;border-top-width:2px}
.frame i:nth-of-type(3){left:0;bottom:0;border-left-width:2px;border-bottom-width:2px}
.frame i:nth-of-type(4){right:0;bottom:0;border-right-width:2px;border-bottom-width:2px}
.frame .scanl{position:absolute;left:10px;right:10px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold3),transparent);box-shadow:0 0 14px 2px rgba(201,169,106,.6);animation:scanf 1.1s ease-in-out infinite alternate}
@keyframes scanf{to{top:calc(100% - 2px)}}
.frame.lock .scanl{opacity:0}
.frame.lock i{width:20px;height:20px;opacity:.5}
.guide{position:absolute;left:50%;top:calc(44% - 158px);z-index:3;transform:translateX(-50%);padding:8px 14px;border-radius:99px;background:rgba(10,16,26,.6);backdrop-filter:blur(8px);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;transition:opacity .4s}
.guide.ok{color:var(--gold3)}
.wov{position:absolute;left:50%;top:44%;z-index:4;touch-action:none;cursor:grab;opacity:0;transition:opacity .5s}
.wov.show{opacity:1}
.wov img{display:block;width:100%;height:auto;-webkit-mask-image:linear-gradient(to bottom,transparent 6%,#000 30%,#000 70%,transparent 94%);mask-image:linear-gradient(to bottom,transparent 6%,#000 30%,#000 70%,transparent 94%);filter:drop-shadow(0 16px 14px rgba(0,0,0,.55));-webkit-user-drag:none;pointer-events:none}
.wov.show img{animation:land .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes land{from{transform:scale(1.3) translateY(-12px);opacity:0}}
.artop{position:absolute;left:0;right:0;top:var(--sb);z-index:6;display:flex;align-items:center;justify-content:space-between;padding:6px 14px}
.glass{background:rgba(10,16,26,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff}
.rapill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.rapill i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 1.8s infinite}
.rapill.live i{background:var(--ok)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,169,106,.6)}70%{box-shadow:0 0 0 8px rgba(201,169,106,0)}100%{box-shadow:0 0 0 0 rgba(201,169,106,0)}}
.rail{position:absolute;right:12px;top:calc(44% - 100px);z-index:6;display:flex;flex-direction:column;gap:10px;transition:opacity .3s}
.rail .nbb{width:44px;height:44px}
.arbot{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:20px 24px calc(26px + var(--sab));background:linear-gradient(transparent,rgba(3,6,10,.72));transition:opacity .3s}
.arbot .q{width:64px;font-size:12px;font-weight:800;letter-spacing:.1em;color:#fff;text-transform:uppercase;text-align:left}
.shutter{width:74px;height:74px;border-radius:50%;border:4px solid rgba(255,255,255,.85);display:grid;place-items:center}
.shutter::after{content:"";width:58px;height:58px;border-radius:50%;background:#fff;transition:transform .15s}
.shutter:active::after{transform:scale(.86)}
.thumb{width:62px;height:62px;border-radius:14px;overflow:hidden;background:rgba(20,32,50,.7);border:1px solid rgba(255,255,255,.2)}
.thumb .ph{width:100%;height:100%;aspect-ratio:auto;background:none}.thumb .ph img{transform:scale(1.5) translateY(3%)}
.varbtn{position:absolute;left:50%;bottom:calc(122px + var(--sab));z-index:6;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:99px;background:rgba(201,169,106,.94);color:var(--navy);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;transition:opacity .3s}
.varbtn .ic{width:15px;height:15px}
.ar.cust .rail,.ar.cust .arbot,.ar.cust .varbtn,.ar.cust .guide,.ar.cust .frame{opacity:0;pointer-events:none}
.flash{position:absolute;inset:0;z-index:20;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .45s ease}
@keyframes flash{10%{opacity:.9}}
.perm .pc{margin:18px 16px 0;padding:26px 22px 20px;border-radius:24px;background:var(--ivory);color:var(--navy);text-align:center}
.perm .pc .ico{display:grid;place-items:center;width:78px;height:78px;margin:0 auto 16px;border-radius:50%;background:#EFE7D7;color:var(--gold)}
.perm .pc .ico .ic{width:34px;height:34px}
.perm .pc p{margin:10px 0 18px;color:#59606E;font-size:14px;line-height:1.55}
.perm .pc .btn+.btn{margin-top:10px}
.perm .pc .btn.line{color:var(--navy);border-color:var(--ivline)}
.perm ul{margin:0 0 18px;padding:0;list-style:none;text-align:left}
.perm li{display:flex;gap:10px;padding:6px 0;font-size:13px;color:#454D5C;line-height:1.45}
.perm li .ic{width:17px;height:17px;color:var(--gold)}
.wrv{margin:6px 0 2px;text-align:center;font-size:14px;color:var(--mut)}.wrv b{font-family:var(--serif);font-size:44px;font-weight:600;color:var(--ink)}
/* collection */
.oc{padding:12px;margin-bottom:12px}
.oc .tp{display:flex;gap:12px;text-align:left;width:100%}
.oc .ph{flex:none;width:84px;border-radius:12px}
.oc .ref{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--mut);margin-top:3px}
.oc .ln{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--ink2)}
.oc .ln .ic{width:13px;height:13px;color:var(--mut)}
.oc .ln.g{color:var(--gold3)}.oc .ln.g .ic{color:var(--gold2)}.oc .ln.w{color:#F0B37E}
.oc .ft{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:.5px solid rgba(255,255,255,.1)}
.addc{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border:1px dashed var(--line2);border-radius:14px;color:var(--gold3);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.wl{display:flex;gap:12px;padding:12px;margin-bottom:12px}
.wl .ph{flex:none;width:86px;border-radius:12px}
.wl .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.dhero{position:relative;margin:0 18px;padding:14px 0 16px;border-radius:18px;background:radial-gradient(80% 70% at 50% 40%,#243E66,#132139);text-align:center}
.dhero .ph{width:56%;margin:0 auto;background:none}
.auth{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:rgba(10,19,33,.7);border:1px solid var(--line2);font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--gold3);text-transform:uppercase}
.auth i{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.dhero .auth{position:absolute;top:12px;right:12px;z-index:2}
.tli{position:relative;margin:0 18px 10px 40px;padding:12px 14px}
.tli::before{content:"";position:absolute;left:-19px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--mut2)}
.tli.first::before{border-color:var(--gold);background:var(--gold)}
.tli::after{content:"";position:absolute;left:-14px;top:30px;bottom:-12px;width:1px;background:var(--line)}
.tli:last-of-type::after{display:none}
.tli .th{display:flex;justify-content:space-between;gap:10px}.tli .th b{font-family:var(--serif);font-size:15px;font-weight:600}.tli .th small{color:var(--mut);font-size:11.5px;white-space:nowrap}
.tli p{margin:5px 0 0;color:var(--ink2);font-size:12.5px;line-height:1.5}
.vault{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:0 18px}
.vault button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px;background:var(--card);border-radius:14px;font-size:11px;font-weight:700;line-height:1.3}
.vault .ic{color:var(--gold2);width:22px;height:22px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 18px 0}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.notes{margin:12px 18px 0;padding:14px;font-size:13px;color:var(--ink2);line-height:1.55}
.cert{background:var(--ivory);color:var(--navy);border-radius:16px;padding:18px 16px;text-align:center;border:1px solid var(--ivline);position:relative}
.cert::before{content:"";position:absolute;inset:6px;border:1px solid rgba(201,169,106,.5);border-radius:12px;pointer-events:none}
.cert .wm{font-family:var(--serif);font-size:26px;letter-spacing:.3em;margin-right:-.3em}
.cert .ph{width:46%;margin:6px auto;background:none}
.cert .kv{border-top-color:rgba(19,34,58,.1)}.cert .kv span{color:#7A7F8A}
.cert .qrr{display:flex;gap:12px;align-items:center;margin-top:10px;text-align:left;font-size:11.5px;color:#59606E}
.cert .qrr svg{flex:none}
.inv-doc{background:#fff;color:#1B2230;border-radius:12px;padding:18px;font-size:12px;line-height:1.5}
.inv-doc h4{margin:0;font-family:var(--serif);font-size:20px;letter-spacing:.2em}
.inv-doc table{width:100%;border-collapse:collapse;margin-top:12px}
.inv-doc td{padding:6px 0;border-bottom:1px solid #EEE;vertical-align:top}.inv-doc td:last-child{text-align:right}
.inv-doc .tot td{font-weight:800;border-bottom:0;font-size:13px}
.stamp{display:inline-block;margin-top:12px;padding:4px 10px;border:1px dashed #9A8A6A;color:#9A8A6A;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.verif{text-align:center;padding:6px 0}
.verif .rg2{position:relative;width:120px;height:120px;margin:6px auto 14px}
.verif .rg2 svg{position:absolute;inset:0;width:100%;height:100%}
.verif .rg2 .ph{position:absolute;inset:14px;border-radius:50%;aspect-ratio:auto}
.verif .rg2 .ph img{transform:scale(1.7) translateY(3%)}
.verif .arc{stroke-dasharray:340;stroke-dashoffset:340;animation:arc 1.6s var(--ios) forwards}
@keyframes arc{to{stroke-dashoffset:0}}
.verif ol{list-style:none;margin:0 auto;padding:0;text-align:left;max-width:270px}
.verif li{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:13px;color:var(--mut);transition:color .3s}
.verif li.on{color:var(--ink)}
.verif li i{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.verif li.on i{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.verif li i .ic{width:11px;height:11px}
.scanbox{position:relative;height:180px;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#1E3150,#0A1321)}
.scanbox .c3{position:absolute;left:50%;top:50%;width:170px;height:106px;margin:-53px 0 0 -85px;border-radius:10px;background:linear-gradient(135deg,#F3ECDD,#D9CCB0);box-shadow:0 12px 24px rgba(0,0,0,.4);transform:rotate(-6deg);color:var(--navy);padding:12px;font-size:9px}
.scanbox .c3 b{font-family:var(--serif);font-size:14px;letter-spacing:.2em}
.scanbox .beam{position:absolute;left:12%;right:12%;height:2px;top:15%;background:linear-gradient(90deg,transparent,var(--gold3),transparent);box-shadow:0 0 12px var(--gold);animation:scanv 1s ease-in-out infinite alternate}
/* club */
.inv{position:relative;margin:14px 18px 0;border-radius:18px;overflow:hidden;min-height:420px;display:flex;flex-direction:column;justify-content:flex-end}
.inv .bg{position:absolute;inset:0}.inv .bg svg{width:100%;height:100%;display:block}
.inv .bg .ph{position:absolute;left:50%;top:6%;width:34%;transform:translateX(-50%);background:none}
.inv .ct{position:relative;padding:16px}
.inv .star{position:absolute;top:12px;left:12px;z-index:2}
.inv .h1{font-size:27px}
.inv .meta{margin-top:4px;font-size:12.5px;color:#E5DCC8}
.inv .gl{margin-top:12px;padding:14px;border-radius:14px;background:rgba(10,16,26,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;line-height:1.55;color:#DFE3EA}
.inv .gl .btn{margin-top:12px}
.pv{width:172px;padding:10px;text-align:left}
.pv .ph{border-radius:12px}
.pv .h3{font-size:14px;margin-top:10px}
.pv p{margin:4px 0 10px;font-size:12px;color:var(--mut);line-height:1.4;min-height:34px}
.art{display:block;width:100%;margin-bottom:12px;text-align:left;overflow:hidden}
.art .ah{height:140px;position:relative;overflow:hidden}
.art .ah svg{width:100%;height:100%;display:block}
.art .ah .k{position:absolute;top:10px;left:10px}
.art .bd{padding:12px 14px 14px}
.art p{margin:5px 0 8px;font-size:12.5px;color:var(--mut);line-height:1.5}
.conc{display:flex;gap:12px;padding:14px;text-align:left;width:100%}
.conc .av{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#E8D3A2,#B8914E);color:var(--navy);font-family:var(--serif);font-weight:700}
.conc p{margin:5px 0 8px;font-size:12.5px;color:var(--ink2);line-height:1.5}
.ev{display:flex;gap:12px;padding:14px;margin-bottom:10px}
.ev .dt{flex:none;width:56px;padding:8px 0;border-radius:12px;background:var(--golds);text-align:center}
.ev .dt b{display:block;font-family:var(--serif);font-size:23px;line-height:1;color:var(--gold2)}
.ev .dt small{font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.ev p{margin:4px 0 10px;font-size:12.5px;color:var(--mut);line-height:1.45}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slots button{padding:12px;border:1px solid var(--line);border-radius:12px;text-align:left;transition:all .2s}
.slots button b{display:block;font-size:14px}.slots button small{color:var(--mut);font-size:12px}
.slots button[aria-pressed="true"]{border-color:var(--gold);background:var(--golds)}
.slots button[disabled]{opacity:.4;text-decoration:line-through}
.reader .hero{height:250px;position:relative;overflow:hidden}.reader .hero svg{width:100%;height:100%;display:block}
.reader .body{padding:20px 22px 40px}
.reader .body p{font-family:var(--serif);font-size:16.5px;line-height:1.72;color:#DCD8CF;margin:0 0 16px}
.reader blockquote{margin:20px 0;padding:4px 0 4px 16px;border-left:2px solid var(--gold);font-family:var(--serif);font-style:italic;font-size:18.5px;line-height:1.5;color:var(--gold3)}
.chat .sc{padding-bottom:0;display:flex;flex-direction:column}
.msgs{flex:1;padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:10px 13px;border-radius:18px;font-size:14px;line-height:1.45;animation:fadeUp .3s var(--ios) both}
.msg.bot{align-self:flex-start;background:var(--card2);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--gold);color:var(--navy);border-bottom-right-radius:6px;font-weight:600}
.msg.card{max-width:86%;padding:0;overflow:hidden}.msg .mc{padding:12px 14px}
.typing{align-self:flex-start;display:flex;gap:4px;padding:13px 15px;border-radius:18px;background:var(--card2)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:typ 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes typ{30%{transform:translateY(-4px);background:var(--gold)}}
.qr{display:flex;gap:8px;overflow-x:auto;padding:8px 14px;scrollbar-width:none}.qr::-webkit-scrollbar{display:none}.qr .chip{flex:none}
.cin{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;padding:8px 12px calc(10px + var(--sab));background:rgba(19,34,58,.92);backdrop-filter:blur(18px);border-top:.5px solid rgba(255,255,255,.08)}
.cin input{flex:1;min-width:0;height:40px;padding:0 15px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);outline:0;font-size:16px}
.cin .send{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--navy);flex:none}
.advh{display:flex;align-items:center;gap:10px;min-width:0}
.advh .av{position:relative;flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#E8D3A2,#B8914E);color:var(--navy);font-family:var(--serif);font-weight:700;font-size:13px}
.advh .av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}
.advh b{display:block;font-size:15px}.advh small{display:block;color:var(--mut);font-size:11.5px}
/* notifications */
.nf{position:relative;margin:0 18px 10px;border-radius:16px;overflow:hidden}
.nf .under{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:20px;background:var(--gold);color:var(--navy);font-size:12px;font-weight:800;gap:8px}
.nf .body{position:relative;display:flex;gap:12px;width:100%;padding:14px;text-align:left;background:var(--card);border-radius:16px;touch-action:pan-y;transition:transform .3s var(--ios)}
.nf.read .body{background:#132238}.nf.read .body .h3,.nf.read .body p{opacity:.72}
.nf .ni{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--golds);color:var(--gold2)}
.nf .ni .ic{width:18px;height:18px}
.nf .th{display:flex;justify-content:space-between;gap:8px}.nf .h3{font-size:15px}
.nf small.tm{flex:none;font-size:11px;color:var(--mut)}
.nf p{margin:4px 0 0;font-size:13px;line-height:1.45;color:var(--ink2)}
.nf .ud{position:absolute;top:18px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.nf:not(.read) small.tm{margin-right:12px}
/* profile */
.prof{display:flex;align-items:center;gap:16px;padding:6px 18px 4px}
.avatar{position:relative;flex:none;width:76px;height:76px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,var(--gold3),var(--gold),#7A6235,var(--gold3))}
.avatar>div{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 40% 30%,#2A4166,#12203A);display:grid;place-items:center;font-family:var(--serif);font-size:26px;color:var(--gold3);border:3px solid var(--bg)}
.vip{display:inline-block;margin-top:6px}
.paycard{position:relative;height:180px;margin:4px 18px 0;padding:18px;border-radius:18px;background:linear-gradient(135deg,#243B61,#0E1A2D 70%);border:1px solid var(--line2);display:flex;flex-direction:column;justify-content:space-between}
.paycard .chipc{width:40px;height:30px;border-radius:6px;background:linear-gradient(135deg,var(--gold3),var(--gold))}
.dev{display:flex;align-items:center;gap:12px;padding:12px 16px}
.dev+.dev{border-top:.5px solid rgba(255,255,255,.08)}
.dev .x{flex:1}.dev b{display:block;font-size:14px}.dev small{color:var(--mut);font-size:12px}
.map{position:relative;height:230px;margin:0 18px;border-radius:16px;overflow:hidden}
.map svg{width:100%;height:100%;display:block}
.pin{position:absolute;display:grid;place-items:center;width:28px;height:28px;margin:-28px 0 0 -14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--gold);color:var(--navy);font-weight:800;font-size:12px;box-shadow:0 6px 12px rgba(0,0,0,.4)}
.pin span{transform:rotate(45deg)}.pin.on{background:#fff}

/* ===== side panel (desktop) ===== */
.panel{flex:none;width:380px;padding:24px 22px 20px;border-radius:22px;background:rgba(19,32,52,.78);border:1px solid #23375A;backdrop-filter:blur(10px);font-size:13.5px;line-height:1.55;color:#C3CAD6;max-height:calc(100vh - var(--bh) - 44px);overflow-y:auto;position:sticky;top:calc(var(--bh) + 22px);scrollbar-width:thin}

/* ===== alive: motion layer (transform/opacity; reduced-motion safe) ===== */
.flip{position:absolute;z-index:98;object-fit:contain;pointer-events:none;transform-origin:0 0;will-change:transform}

.tbi::after{content:"";position:absolute;left:50%;top:0;width:22px;height:2px;margin-left:-11px;border-radius:2px;background:var(--gold2);box-shadow:0 0 10px rgba(212,179,111,.7)}
.tb.c .ring{position:relative}

.sto .ring{background:none;isolation:isolate}
.sto .ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#F1DDB0,#C9A96A,#7A5A2A,#E8D3A2,#F1DDB0);animation:spin 7s linear infinite;z-index:-1}

@supports (animation-timeline:view()){.hscroll .wc,.hscroll .pv{animation:car linear both;animation-timeline:view(inline);animation-range:cover}@keyframes car{0%,100%{transform:scale(.9);opacity:.6}30%,72%{transform:none;opacity:1}}}

.tgl::after{transition:transform .4s cubic-bezier(.34,1.56,.64,1)}

@keyframes fl{50%{translate:0 -8px}}
