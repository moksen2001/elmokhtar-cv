    <div class="about" style="margin:0 0 18px"><b>Prototype du challenge professionnel de fin d\u2019\xE9tudes (MBA ESG, sept. 2026) \xB7 donn\xE9es fictives</b><p class="small" style="margin:8px 0 0"><a href="../#projets">\u2190 Retour au CV d\u2019El Mokhtar Berrada</a></p></div>
