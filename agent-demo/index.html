<style>
:root{
 --red:#E9041E;--red-d:#BE0318;--red-t:#FDECEE;--red-l:#F4B7BF;
 --black:#000;--ink:#1A1A1A;--ink2:#525252;--muted:#6B6B6B;--grey:#8C8C8C;
 --line:#E6E6E6;--line2:#D4D4D4;--bg:#F4F4F4;--surface:#FFFFFF;--sunk:#FAFAFA;
 --ok:#1F8A4C;--ok-t:#E8F3EC;--ok-l:#B5D9C3;--warn:#B26B00;--warn-t:#FBF2E1;--warn-l:#E9CB96;
 --sans:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
 --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 --topH:48px;--stepH:52px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body{overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus{outline:none}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;box-shadow:0 0 0 4px #fff}
.top :focus-visible{box-shadow:none;outline-color:#fff}
.mono{font-family:var(--mono)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:square;stroke-linejoin:miter}
kbd{font-family:var(--mono);font-size:.68rem;line-height:1;padding:2px 4px;border:1px solid currentColor;border-radius:2px;opacity:.7;min-width:16px;text-align:center}

/* top bar */
.top{background:var(--black);color:#fff;position:sticky;top:0;z-index:40;border-bottom:3px solid var(--red)}
.top-in{max-width:1600px;margin:0 auto;height:var(--topH);padding:0 24px;display:flex;align-items:center;gap:16px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;color:#CFCFCF;text-decoration:none;white-space:nowrap}
.back:hover{color:#fff;text-decoration:underline;text-underline-offset:3px}
.vr{width:1px;height:20px;background:#3D3D3D;flex:none}
.prod{display:flex;align-items:baseline;gap:10px;min-width:0;white-space:nowrap}
.prod b{font-weight:600;font-size:1rem;letter-spacing:.01em}
.prod small{font-size:.84rem;color:#A3A3A3;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.tag-demo{font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#CFCFCF;border:1px solid #555;padding:2px 7px;border-radius:2px;white-space:nowrap}
.lang{display:flex;border:1px solid #555;border-radius:2px;overflow:hidden;flex:none}
.lang a{padding:3px 9px;font-size:.78rem;font-weight:600;text-decoration:none;color:#BDBDBD;letter-spacing:.03em}
.lang a+a{border-left:1px solid #555}
.lang a[aria-current]{background:#fff;color:#000}
.tb{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;background:none;border:1px solid #555;border-radius:2px;color:#D6D6D6;font-size:.82rem;cursor:pointer;white-space:nowrap}
.tb:hover{border-color:#999;color:#fff}

/* stepper bar */
.stepbar{background:var(--surface);border-bottom:1px solid var(--line2);position:sticky;top:calc(var(--topH) + 3px);z-index:35}
.stepbar-in{max-width:1600px;margin:0 auto;padding:0 24px;height:var(--stepH);display:flex;align-items:center;gap:24px}
ol.stepper{display:flex;align-items:stretch;list-style:none;margin:0;padding:0;height:100%}
.stepper li{display:flex;align-items:center}
.stepper li+li::before{content:"";width:36px;height:1px;background:var(--line2);margin:0 14px}
.stepper li.past+li::before{background:var(--ink)}
.stepper button{display:flex;align-items:center;gap:9px;height:100%;background:none;border:0;border-bottom:2px solid transparent;padding:2px 2px 0;cursor:pointer;font-size:.92rem;color:var(--muted);white-space:nowrap}
.stepper .n{width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:2px;font-size:.78rem;font-weight:600;color:var(--ink2);background:#fff}
.stepper .n svg{width:13px;height:13px;stroke-width:2.2}
.stepper li.past button{color:var(--ink2)}
.stepper li.past .n{background:var(--ink);border-color:var(--ink);color:#fff}
.stepper li.cur button{color:var(--ink);font-weight:600;border-bottom-color:var(--red)}
.stepper li.cur .n{background:var(--red);border-color:var(--red);color:#fff}
.stepper button:disabled{cursor:default}
.stepper li:not(.cur):not(.past) button:disabled{opacity:.6}
.stepper button:not(:disabled):hover .l{text-decoration:underline;text-underline-offset:3px}
.ctx{margin-left:auto;display:flex;align-items:baseline;gap:10px;min-width:0;font-size:.86rem;color:var(--ink2);white-space:nowrap}
.ctx .mono{font-size:.78rem;color:var(--ink)}
.ctx span:last-child{overflow:hidden;text-overflow:ellipsis}

main{flex:1;width:100%;max-width:1600px;margin:0 auto;padding:24px}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line2);border-radius:2px;min-width:0}
.ph{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 16px;border-bottom:1px solid var(--line)}
.ph-t{font-size:.74rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.ph .r{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:7px 14px;border-radius:2px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:.9rem;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red-d);border-color:var(--red-d)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:#000}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2);padding-left:8px;padding-right:8px}
.btn.ghost:hover{color:var(--ink);border-color:var(--line2)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:.84rem}
.btn[disabled]{background:var(--bg);border-color:var(--line2);color:var(--grey);cursor:not-allowed}
.btn kbd{margin-left:2px}
.lnk{background:none;border:0;padding:0;color:var(--ink);font-size:.86rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px}
.lnk:hover{color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:2px;border:1px solid var(--line2);color:var(--ink2);background:#fff;white-space:nowrap;line-height:1.35}
.chip.bad{color:var(--red);border-color:var(--red-l);background:var(--red-t)}
.chip.warn{color:var(--warn);border-color:var(--warn-l);background:var(--warn-t)}
.chip.ok{color:var(--ok);border-color:var(--ok-l);background:var(--ok-t)}
.chip.dark{color:#fff;background:var(--ink);border-color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--grey);display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--red)}.dot.warn{background:var(--warn)}
.c-bad{color:var(--red)}.c-warn{color:var(--warn)}.c-ok{color:var(--ok)}
.meter{display:inline-block;width:44px;height:4px;background:var(--line);vertical-align:middle;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.meter.low i{background:var(--warn)}
.pbar{height:3px;background:var(--line)}
.pbar i{display:block;height:100%;width:0;background:var(--red);transition:width .3s linear}
.pbar.dark i{background:var(--ink)}

/* ---------- step 1 ---------- */
.s1{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin:0 0 14px}
.eyebrow{margin:0 0 6px;font-size:.74rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pagehead h1{margin:0;font-size:1.6rem;line-height:1.2;font-weight:600;letter-spacing:-.005em;display:flex;align-items:center;gap:12px}
.pagehead h1::before{content:"";width:4px;height:1.15em;background:var(--red);flex:none}
.ctxline{margin:8px 0 0;color:var(--ink2);font-size:.95rem;max-width:80ch}
.hm{display:flex;gap:20px;font-size:.84rem;color:var(--ink2)}
.hm b{display:block;font-size:1.25rem;font-weight:600;color:var(--ink);line-height:1.1}
details.how{margin:0 0 16px;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
details.how>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 0;font-size:.9rem;font-weight:600}
details.how>summary::-webkit-details-marker{display:none}
details.how>summary .chev,.chev{transition:transform .2s}
details[open]>summary .chev{transform:rotate(180deg)}
details.how>summary small{font-weight:400;color:var(--muted)}
.how-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding:4px 0 16px}
.how-g>div{padding:0 20px}
.how-g>div:first-child{padding-left:0}
.how-g>div+div{border-left:1px solid var(--line)}
.how-g h3{margin:0 0 8px;font-size:.74rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.how-g p{margin:0 0 8px;font-size:.88rem;color:var(--ink2)}
.how-g ol{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:s}
.how-g ol li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:.88rem;color:var(--ink2);counter-increment:s}
.how-g ol li::before{content:counter(s);width:20px;height:20px;border:1px solid var(--ink);display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--ink)}
.how-g ol b{color:var(--ink);font-weight:600}
dl.gl{margin:0;display:grid;gap:8px;font-size:.88rem}
dl.gl dt{font-weight:600}
dl.gl dd{margin:0;color:var(--ink2)}

table.q{width:100%;border-collapse:collapse}
.q thead th{text-align:left;font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line2);background:var(--sunk);white-space:nowrap}
.q td{padding:14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.9rem}
.q tbody tr:last-child td{border-bottom:0}
.q tbody tr{cursor:pointer;transition:background .15s}
.q tbody tr:hover{background:var(--sunk)}
.q tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.q .ref{font-family:var(--mono);font-size:.78rem;color:var(--ink);white-space:nowrap}
.q .typ{display:block;margin-top:4px;font-size:.8rem;color:var(--muted)}
.q .nm{font-weight:600;font-size:.98rem;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.q .bl{margin:3px 0 0;color:var(--ink2);font-size:.88rem;max-width:72ch}
.q .mt{margin:6px 0 0;font-size:.8rem;color:var(--muted)}
.q .amt{font-family:var(--mono);font-size:.82rem;text-align:right;white-space:nowrap}
.q th.amt{font-family:var(--sans)}
.q .dt{white-space:nowrap;color:var(--ink2)}
.q .stt{white-space:nowrap;font-size:.86rem}
.q .stt span{display:inline-flex;align-items:center;gap:7px}
.q .stt small{display:block;color:var(--muted);font-size:.8rem;margin:2px 0 0 14px;white-space:normal}
.q .go{text-align:right;width:1%}
.s1-side{display:grid;gap:16px}
.side-b{padding:14px 16px}
.side-b p{margin:0 0 8px;font-size:.88rem;color:var(--ink2)}
.side-b p:last-child{margin:0}
ul.scope{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:.88rem;color:var(--ink2)}
ul.scope li{display:grid;grid-template-columns:18px 1fr;gap:6px}
ul.scope li svg{margin-top:2px}
.side-b .scope-h{font-size:.8rem;font-weight:600;color:var(--ink);margin:14px 0 6px}
.side-b .scope-h:first-child{margin-top:0}
.refs{display:flex;flex-wrap:wrap;gap:6px}
.refs span{font-family:var(--mono);font-size:.74rem;border:1px solid var(--line2);padding:2px 6px;border-radius:2px;color:var(--ink2)}

/* ---------- step 2 ---------- */
.casebar{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;margin:0 0 14px}
.casebar .ref{font-family:var(--mono);font-size:.8rem;background:var(--ink);color:#fff;padding:2px 7px;border-radius:2px}
.casebar h1{margin:0;font-size:1.25rem;font-weight:600;line-height:1.3}
.casebar .facts{font-size:.86rem;color:var(--ink2);display:flex;flex-wrap:wrap;gap:2px 14px}
.casebar .facts span+span::before{content:"";display:inline-block;width:1px;height:11px;background:var(--line2);margin-right:14px;vertical-align:-1px}
.split{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(420px,1fr);gap:16px;height:calc(100vh - var(--topH) - 3px - var(--stepH) - 130px);min-height:540px}
.split>.panel{display:flex;flex-direction:column;min-height:0}
.vtabs{display:flex;gap:2px;margin-left:auto}
.vtabs button{background:none;border:1px solid transparent;border-radius:2px;padding:3px 8px;font-size:.8rem;color:var(--ink2);cursor:pointer;white-space:nowrap}
.vtabs button:hover{border-color:var(--line2);color:var(--ink)}
.paper{flex:1;min-height:0;overflow:auto;scroll-behavior:smooth;padding:0 0 16px;position:relative}
.dsec{padding:0}
.dsec-h{position:sticky;top:0;z-index:2;background:#fff;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.dsec-h b{font-size:.88rem;font-weight:600}
.dsec-h span{font-size:.8rem;color:var(--muted)}
.dsec+.dsec{margin-top:10px;border-top:1px solid var(--line2)}
.row{display:grid;grid-template-columns:70px 136px minmax(0,1fr) auto;gap:0 12px;align-items:baseline;padding:5px 16px 5px 13px;border-left:3px solid transparent;font-size:.86rem;transition:background .25s,border-color .25s}
.row+.row{border-top:1px solid #F0F0F0}
.row .k{font-family:var(--mono);font-size:.76rem;color:var(--ink);font-weight:500}
.row .lb{font-size:.8rem;color:var(--muted)}
.row .v{font-family:var(--mono);font-size:.76rem;line-height:1.6;color:var(--ink);word-break:break-word}
.row .mk{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.row .mk:empty{display:none}
.row.miss .v{color:var(--red);text-decoration:line-through;text-decoration-thickness:1px}
.row.scan{background:#F5F5F5;border-left-color:var(--grey)}
.row.look{background:#F2F2F2;border-left-color:var(--ink)}
.row.hl-c{background:#F2F2F2;border-left-color:var(--ink)}
.row.hl-c .mk{color:var(--ink)}
.row.hl-x{background:var(--red-t);border-left-color:var(--red)}
.row.hl-x .mk{color:var(--red)}
.row.pulse{animation:pulse 1.4s ease-out 1}
@keyframes pulse{0%{box-shadow:inset 0 0 0 2px var(--red)}70%{box-shadow:inset 0 0 0 2px rgba(233,4,30,.15)}100%{box-shadow:inset 0 0 0 2px transparent}}
.hand{font-family:var(--sans);font-style:italic;font-size:.9rem;color:#1D3C8F;border:1px dashed #6A7FB8;padding:0 5px;margin:0 2px;border-radius:2px;white-space:nowrap}
.hand small{font-style:normal;font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-left:4px}

/* right pane */
.live{display:inline-flex;align-items:center;gap:7px;font-size:.84rem;color:var(--ink2);white-space:nowrap}
.live .mono{font-size:.76rem;color:var(--ink)}
.live .dot.run{background:var(--red);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.pbody{flex:1;min-height:0;overflow:auto}
ol.rlog{list-style:none;margin:0;padding:8px 16px 12px;font-size:.88rem}
.rlog li{display:grid;grid-template-columns:66px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid #F0F0F0;animation:lin .25s ease-out}
.rlog li:last-child{border-bottom:0}
@keyframes lin{from{opacity:0;transform:translateY(3px)}}
.rlog time{font-family:var(--mono);font-size:.74rem;color:var(--muted);padding-top:2px}
.rlog .t{color:var(--ink)}
.rlog .r{display:block;font-size:.84rem;color:var(--ink2)}
.rlog .r.bad{color:var(--red)}.rlog .r.warn{color:var(--warn)}
.rlog li.run .r{color:var(--muted)}
.rlog li.run .r::after{content:"";display:inline-block;width:6px;height:6px;background:var(--red);margin-left:6px;animation:blink 1s steps(2) infinite}
.pf{border-top:1px solid var(--line2);background:var(--sunk);padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.pf p{margin:0;font-size:.85rem;color:var(--ink2);flex:1;min-width:200px}
.pf p b{color:var(--ink);font-weight:600}
.keys{width:100%;font-size:.76rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.keys span{display:inline-flex;align-items:center;gap:5px}
.keys kbd{opacity:1;border-color:var(--line2);color:var(--ink2);background:#fff}

.sumg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
.sumg div{padding:10px 16px}
.sumg div+div{border-left:1px solid var(--line)}
.sumg dt{font-size:.72rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.sumg dd{margin:2px 0 0;font-size:1.15rem;font-weight:600}
dl.sumg{margin:0}
details.runlog{border-bottom:1px solid var(--line)}
details.runlog>summary,details.passed>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:.86rem;color:var(--ink2)}
details.runlog>summary::-webkit-details-marker,details.passed>summary::-webkit-details-marker{display:none}
details.runlog>summary .chev,details.passed>summary .chev{margin-left:auto;color:var(--muted)}
details.runlog ol.rlog{padding-top:0}
details.runlog .rlog li{animation:none}
.sech{display:flex;align-items:center;gap:12px;padding:12px 16px 8px}
.sech .ph-t{color:var(--ink)}
.sech .cnt{margin-left:auto;font-size:.84rem;color:var(--ink2);display:flex;align-items:center;gap:10px}
.sech .cnt .pbar{width:90px}
ol.flist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.f{border-bottom:1px solid var(--line);background:#fff;position:relative}
.f.act{box-shadow:inset 3px 0 0 var(--red)}
.f-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 10px;width:100%;text-align:left;background:none;border:0;padding:12px 16px;cursor:pointer;align-items:start}
.f:not(.act) .f-row:hover{background:var(--sunk)}
.f-no{font-family:var(--mono);font-size:.76rem;color:var(--muted);padding-top:2px}
.f-t{font-weight:600;font-size:.96rem;line-height:1.35;color:var(--ink)}
.f.done:not(.act) .f-t{color:var(--ink2);font-weight:500}

function rlogLi(l,run){return `<li class="${run?'run':''}"><time>${l.time}</time><span><span class="t">${esc(l.t)}</span><span class="r ${l.c||''}">${run?x('en cours','running'):esc(l.r)}</span></span></li>`;}
async function runAnim(c,tok){
 const n=c.run.length;
 await wait(300);
 for(let i=0;i<n;i++){
  if(S.tok!==tok)return;
  const s=c.run[i],l={time:clk(i?2:1),t:s.t,r:s.r,c:s.c};
  const ol=$('#rlog');if(!ol)return;
  ol.insertAdjacentHTML('beforeend',rlogLi(l,true));const li=ol.lastElementChild;
  if(s.scan!=null){
   const ids=c.docs[s.scan].rows.map(r=>r[1]);
   if(isDesk())scrollPaper($('#paper'),$('#ds-'+s.scan),true);
   for(const id of ids){if(S.tok!==tok)return;const el=document.getElementById('r-'+id);if(el)el.classList.add('scan');await wait(65);}
   await wait(160);ids.forEach(id=>{const el=document.getElementById('r-'+id);if(el)el.classList.remove('scan');});
  }else if(s.rows){
   s.rows.forEach(id=>{const el=document.getElementById('r-'+id);if(el)el.classList.add('look');});
   if(isDesk())scrollPaper($('#paper'),document.getElementById('r-'+s.rows[0]),true,true);
   await wait(720);
   if(S.tok!==tok)return;
   s.rows.forEach(id=>{const el=document.getElementById('r-'+id);if(el)el.classList.remove('look');});
  }else await wait(560);
  if(S.tok!==tok)return;
  S.rlog.push(l);li.outerHTML=rlogLi(l,false);
  const pb=$('#pb');if(pb)pb.style.width=Math.round(100*(i+1)/n)+'%';
 }
 await wait(600);
 if(S.tok!==tok)return;
 finishRun(c);
}
function finishRun(c){
 S.tok++;
 for(let i=S.rlog.length;i<c.run.length;i++){const s=c.run[i];S.rlog.push({time:clk(i?2:1),t:s.t,r:s.r,c:s.c});}
 S.tEnd=S.rlog[S.rlog.length-1].time;
 const ko=c.findings.filter(f=>f.k==='ko').length,ck=c.findings.length-ko;
 S.clock+=1;
 logp(x('Analyse terminée par l\'agent : ','Analysis completed by the agent: ')+(c.kind==='amd'?c.findings.length+x(' points relevés',' points raised'):ko+x(' anomalie(s), ',' discrepancy(ies), ')+ck+x(' point(s) à confirmer',' point(s) to confirm')),1);
 S.analysed=true;S.act=c.findings[0].id;
 clearHL();paneReview();applyHL(true);stepbar();
 say(x('Analyse terminée. ','Analysis complete. ')+c.findings.length+x(' point(s) à valider.',' point(s) to validate.'));
}

   <div class="evt"><div class="evt-h"><span class="ph-t">${x('Éléments de preuve','Evidence')}</span><button type="button" class="lnk" data-loc="${f.id}">${ic(isDesk()?'loc':'doc')}${isDesk()?x('Localiser dans le document','Locate in document'):x('Voir la preuve','View evidence')}</button></div>
    <table>${f.ev.map(e=>`<tr><td>${e[0]}</td><td>${e[1]}</td></tr>`).join('')}</table></div>
   ${d?`<div class="decl">${iss?ic(c.kind==='amd'?'help':'xc',c.kind==='amd'?'c-warn':'c-bad'):ic('ok','c-ok')}<b>${esc(d==='yes'?f.yesS:f.noS)}</b><button type="button" class="lnk" data-undo="${f.id}">${x('Modifier','Change')}</button></div>`
    :`<div class="sugg"><b>${x("Proposition de l'agent","Agent's suggestion")}</b>${esc(f.ag.charAt(0).toUpperCase()+f.ag.slice(1))}</div>
   <div class="acts"><button type="button" class="btn pri" data-yes="${f.id}">${ic('check')}${esc(f.yes)}<kbd>A</kbd></button><button type="button" class="btn" data-no="${f.id}">${esc(f.no)}<kbd>R</kbd></button><button type="button" class="btn ghost" data-com="${f.id}" aria-expanded="${S.comOpen===f.id}">${ic('note')}${x('Commenter','Comment')}<kbd>C</kbd></button></div>`}
   ${S.comOpen===f.id?`<div class="cmt"><label for="cmt-in">${x('Commentaire interne (journal du dossier)','Internal comment (file log)')}</label><textarea id="cmt-in" rows="2">${esc(S.comDraft||'')}</textarea><div class="acts"><button type="button" class="btn dark sm" data-csave="${f.id}">${x('Enregistrer','Save')}</button><button type="button" class="btn ghost sm" data-ccancel>${x('Annuler','Cancel')}</button></div></div>`:''}
   ${com?`<p class="cmts"><b>${x('Commentaire','Comment')}</b><time>${com.t}</time>${esc(com.txt)}</p>`:''}
  </div>`:''}</li>`;
}
function paneReview(){
 const c=S.c,pane=$('#pane');if(!pane)return;
 const old=pane.querySelector('.pbody'),st=old?old.scrollTop:0;
 const ko=c.findings.filter(f=>f.k==='ko').length,ck=c.findings.length-ko;
 const dn=nDecided(c),tot=c.findings.length,left=tot-dn,o=OUT[outcome(c)];
 const kv=c.kind==='amd'
  ?[[x('Questions client','Client questions'),ko,'c-warn'],[x('À vérifier','To check'),ck,'c-warn']]
  :[[x('Anomalies','Discrepancies'),ko,ko?'c-bad':''],[x('À vérifier','To check'),ck,ck?'c-warn':'']];
 kv.push([x('Conformes','Passed'),c.passed.length,'c-ok'],[x('Seuil confiance','Confidence bar'),'85 %','']);
 const runOpen=pane.querySelector('details.runlog[open]')?' open':'';
 const pasOpen=pane.querySelector('details.passed[open]')?' open':'';
 pane.innerHTML=`<div class="ph"><span class="ph-t">${x('Analyse automatique','Automated analysis')}</span><span class="live"><i class="dot ok"></i>${x('Terminée à ','Completed at ')}<span class="mono">${S.tEnd}</span></span></div>
  <div class="pbody">
   <dl class="sumg">${kv.map(k=>`<div><dt>${k[0]}</dt><dd class="${k[2]}">${k[1]}</dd></div>`).join('')}</dl>
   <details class="runlog"${runOpen}><summary>${ic('doc')}${x("Journal d'analyse","Analysis log")} (${S.rlog.length})${ic('chev','chev')}</summary><ol class="rlog">${S.rlog.map(l=>rlogLi(l,false)).join('')}</ol></details>
   <div class="mob-docs"><button type="button" class="btn sm" data-docs>${ic('doc')}${x('Consulter les documents','View the documents')}</button></div>
   <div class="sech"><span class="ph-t">${x('Points à valider','Points to validate')}</span><span class="cnt"><span><b>${dn}</b>/${tot} ${x(dn>1?'validés':'validé','validated')}</span><span class="pbar dark"><i style="width:${Math.round(100*dn/tot)}%"></i></span></span></div>
   <ol class="flist" id="flist">${c.findings.map(f=>fHtml(c,f)).join('')}</ol>
   <details class="passed"${pasOpen}><summary>${ic('ok','c-ok')}${c.passed.length} ${x('contrôles conformes','checks passed')}${ic('chev','chev')}</summary>
    <ul>${c.passed.map(p=>`<li><b>${esc(p[0])}</b>${x(' : ',': ')}${esc(p[1])}</li>`).join('')}</ul></details>
  </div>
  <div class="pf${isDesk()?'':' sticky'}"><p id="next">${left?x(`${left} point${left>1?'s':''} à décider.`,`${left} point${left>1?'s':''} left to decide.`):`${x('Suite : ','Next step: ')}<b>${esc(o.next)}</b>`}</p>
   <button type="button" class="btn pri" id="gen"${left?' disabled':''}>${x('Préparer le message','Prepare the message')}${ic('right')}</button>
   <span class="keys" aria-hidden="true"><span><kbd>J</kbd><kbd>K</kbd>${x('point suivant / précédent','next / previous point')}</span><span><kbd>A</kbd>${x('accepter','accept')}</span><span><kbd>R</kbd>${x('rejeter','reject')}</span><span><kbd>C</kbd>${x('commenter','comment')}</span></span></div>`;
 const nb=pane.querySelector('.pbody');if(nb&&isDesk())nb.scrollTop=st;
}
function select(id,focus){
 if(!S.c.findings.some(f=>f.id===id))return;
 S.act=id;S.comOpen=null;S.comDraft='';paneReview();applyHL(true);
 const el=$('#f-'+id);
 if(el){
  if(isDesk())el.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});
  else{const r=el.getBoundingClientRect();if(r.top<110||r.top>innerHeight-160)window.scrollTo({top:scrollY+r.top-110,behavior:reduce?'auto':'smooth'});}
  if(focus)el.querySelector('.f-row').focus({preventScroll:true});
 }
}
function decide(id,v){
 const c=S.c,f=c.findings.find(k=>k.id===id);if(!f||S.dec[id])return;S.dec[id]=v;
 logp(x('Opérateur · ','Operator · ')+f.t+' → '+(v==='yes'?f.yesS:f.noS),25);
 const nx=c.findings.find(k=>!S.dec[k.id]);
 stepbar();
 say((v==='yes'?f.yesS:f.noS)+'. '+(nx?x('Point suivant : ','Next point: ')+nx.t:x('Tous les points sont validés.','All points are validated.')));
 if(nx)select(nx.id,true);
 else{S.act=id;S.comOpen=null;paneReview();applyHL(false);const g=$('#gen');if(g){g.focus({preventScroll:true});if(!isDesk())g.scrollIntoView({block:'nearest'});}}
}
function undo(id){const c=S.c,f=c.findings.find(k=>k.id===id);delete S.dec[id];logp(x('Décision rouverte : ','Decision reopened: ')+f.t,8);stepbar();select(id,true);}
function openComment(id){S.act=id;S.comOpen=id;S.comDraft=(S.com[id]&&S.com[id].txt)||'';paneReview();applyHL(false);const t=$('#cmt-in');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length);}}
function saveComment(id){
 const t=$('#cmt-in'),v=t?t.value.trim():'';const f=S.c.findings.find(k=>k.id===id);
 if(v){S.clock+=10;const tt=clk(0);S.com[id]={t:tt.slice(0,5),txt:v};S.log.push({t:tt,txt:x('Commentaire · ','Comment · ')+f.t+x(' : ',': ')+v});toast(x('Commentaire enregistré','Comment saved'));}
 S.comOpen=null;S.comDraft='';paneReview();applyHL(false);const b=document.querySelector(`#f-${id} [data-com], #f-${id} .f-row`);if(b)b.focus({preventScroll:true});
}
function onPane(e){
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(b.id==='skip'){if(S.analysed)return;finishRun(S.c);return;}
 if(b.id==='gen'){if(allDecided(S.c))go(3);return;}
 if(d.sel){if(S.act!==d.sel)select(d.sel,false);else if(isDesk())applyHL(true);return;}
 if(d.yes)return decide(d.yes,'yes');
 if(d.no)return decide(d.no,'no');
 if(d.undo)return undo(d.undo);
 if(d.com)return S.comOpen===d.com?(S.comOpen=null,paneReview(),applyHL(false)):openComment(d.com);
 if(d.csave)return saveComment(d.csave);
 if('ccancel' in d){const id=S.comOpen;S.comOpen=null;S.comDraft='';paneReview();applyHL(false);const bb=document.querySelector(`#f-${id} [data-com]`);if(bb)bb.focus();return;}
 if(d.loc){if(isDesk())applyHL(true);else openSheet(d.loc,b);return;}
 if('docs' in d)return openSheet(null,b);
}

/* ---------- bottom sheet (mobile evidence) ---------- */
let sheetRet=null;
function openSheet(fid,from){
 const c=S.c,sh=$('#sheet');sheetRet=from||null;
 const f=fid&&c.findings.find(k=>k.id===fid);
 $('#sheet-t').innerHTML=f?`${x('Preuve','Evidence')} ${fno(c,f)} · ${esc(f.t)}<small>${esc(f.tags)} · ${esc(f.refs)}</small>`:`${x('Documents du dossier','File documents')}<small>${c.ref}</small>`;
 const ids=f?[...f.bad,...f.hl]:null;
 $('#sheetc').innerHTML=f?c.docs.map((d,i)=>{const rr=d.rows.filter(r=>ids.includes(r[1]));return rr.length?`<div class="dsec"><div class="dsec-h"><b>${esc(d.h)}</b><span>${x('Extrait','Extract')} · ${rr.length}/${d.rows.length} ${x('champs','fields')}</span></div>${rr.map(rowHtml).join('')}</div>`:'';}).join('')+`<div class="sheet-more"><button type="button" class="btn sm" id="sheet-all">${ic('doc')}${x('Afficher le dossier complet','Show the full file')}</button></div>`:paperHtml(c);
 sh.hidden=false;document.body.style.overflow='hidden';
 $('#sheetc').scrollTop=0;
 if(f){const keep=S.act;S.act=fid;applyHL(true);S.act=keep;$('#sheetc').scrollTop=0;
  $('#sheet-all').addEventListener('click',()=>{$('#sheetc').innerHTML=paperHtml(c);const k=S.act;S.act=fid;applyHL(false);S.act=k;});}
 $('#sheet-x').focus();
}
function closeSheet(){
 const sh=$('#sheet');if(sh.hidden)return;
 sh.hidden=true;document.body.style.overflow='';$('#sheetc').innerHTML='';
 if(sheetRet&&document.contains(sheetRet))sheetRet.focus();sheetRet=null;
}
$('#sheet').addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeSheet();});

/* ---------- step 3 : message ---------- */
function renderMessage(){
 const c=S.c;if(!allDecided(c))return;
 S.step=3;
 const oid=outcome(c),o=OUT[oid],m=draft(c),sig=JSON.stringify(S.dec);
 if(!S.edit||S.edit.sig!==sig){
  S.edit={sig,sub:m.sub,body:m.body,mod:false};
  logp(x('Dossier validé par l\'opérateur','File validated by the operator'),20);
  logp(x('Message préparé : ','Message prepared: ')+o.msg+x(' (non envoyé, démo)',' (not sent, demo)'),4);
 }
 S.done[c.id]=o.msg;stepbar();
 const n=issues(c).length,saved=c.man-c.ag,tot=c.findings.length;
 const nextC=CASES.find(k=>!S.done[k.id]);
 $('#app').innerHTML=`<div class="s3 fade">
  <section class="panel outc ${o.col}"><span class="ic c-${o.col}">${ic(o.ic)}</span><div><h1>${esc(o.t)}</h1><p>${esc(o.d)}</p></div></section>
  <div class="res">
   <section class="panel msg" aria-label="${esc(o.msg)}">
    <div class="ph"><span class="ph-t">${esc(o.msg)}</span><span class="edited" id="edited"${S.edit.mod?'':' hidden'}>· ${x('modifié','edited')}</span>
     <span class="r"><button type="button" class="btn sm" id="copy">${ic('copy')}${x('Copier','Copy')}</button><button type="button" class="btn sm ghost" id="restart">${ic('redo')}${x('Recommencer','Start over')}</button></span></div>
    <div class="mf"><span>${x('À','To')}</span><b>${esc(m.to)}</b></div>
    <div class="mf"><label for="msub" class="sr">${x('Objet','Subject')}</label><span aria-hidden="true">${x('Objet','Subject')}</span><input id="msub" type="text"></div>
    <div class="mf"><span>${x('Canal','Channel')}</span><b class="ch">${esc(o.ch)}</b></div>
    <label for="mbody" class="sr">${x('Corps du message','Message body')}</label>
    <textarea class="mbody${m.swift?' swift':''}" id="mbody" spellcheck="false"></textarea>
    <div class="pf"><p>${x("Rédigé par l'agent, relu et modifiable par vous. Rien n'est envoyé : c'est une démo simulée avec des données fictives.","Drafted by the agent, reviewed and editable by you. Nothing is sent: this is a simulated demo with fictional data.")}</p></div>
   </section>
   <aside class="res-side">
    <section class="panel"><div class="ph"><span class="ph-t">${x('Récapitulatif','Summary')}</span></div><dl class="kv">
     <div><dt>${x('Dossier','File')}</dt><dd class="mono" style="font-size:.8rem">${c.ref}</dd></div>
     <div><dt>${x('Décision','Decision')}</dt><dd>${esc(o.next)}</dd></div>
     <div><dt>${c.kind==='amd'?x('Points retenus','Points kept'):x('Anomalies retenues','Discrepancies kept')}</dt><dd>${n} ${x('sur','of')} ${tot}</dd></div>
     <div><dt>${x('Points validés','Points validated')}</dt><dd>${tot}/${tot} <span class="pbar dark" style="display:inline-block;width:70px;vertical-align:middle;margin-left:6px"><i style="width:100%"></i></span></dd></div>
     <div><dt>${x('Contrôles conformes','Checks passed')}</dt><dd>${c.passed.length}</dd></div>
    </dl></section>
    <section class="panel"><div class="ph"><span class="ph-t">${x('Temps de traitement','Processing time')}</span></div>
     <div class="time"><div><span>${x('À la main','By hand')}</span><i style="width:100%"></i><b>${c.man} min</b></div>
      <div class="ag"><span>${x('Avec l\'agent','With the agent')}</span><i style="width:${Math.round(100*c.ag/c.man)}%"></i><b>${c.ag} min</b></div></div>
     <p class="note">${x(`Estimation illustrative, non mesurée : environ ${saved} minutes gagnées, surtout sur la lecture et la rédaction.`,`Illustrative estimate, not measured: about ${saved} minutes saved, mostly on reading and drafting.`)}</p></section>
    <details class="panel logbox"${isDesk()?' open':''}><summary class="ph"><span class="ph-t">${x('Journal du dossier','File log')}</span><span class="edited">(${S.log.length})</span><span class="r">${ic('chev','chev')}</span></summary>
     <ol class="log">${S.log.map(l=>`<li><time>${l.t}</time><span>${esc(l.txt)}</span></li>`).join('')}</ol></details>
    <div class="ctas">${nextC?`<button type="button" class="btn pri" id="nextf">${x('Dossier suivant','Next file')} · <span class="mono" style="font-weight:500;font-size:.8rem">${nextC.ref}</span>${ic('right')}</button>`:''}
     <button type="button" class="btn" id="tolist">${ic('left')}${x('Retour à la liste','Back to the list')}</button></div>
   </aside></div></div>`;
 const sub=$('#msub'),body=$('#mbody');
 sub.value=S.edit.sub;body.value=S.edit.body;
 const fit=()=>{body.style.height='auto';body.style.height=Math.max(isDesk()?360:300,body.scrollHeight+2)+'px';};
 fit();
 const mark=()=>{S.edit.mod=true;$('#edited').hidden=false;};
 sub.addEventListener('input',()=>{S.edit.sub=sub.value;mark();});
 body.addEventListener('input',()=>{S.edit.body=body.value;mark();fit();});
 $('#copy').addEventListener('click',()=>{
  const t=x('À : ','To: ')+m.to+'\n'+x('Objet : ','Subject: ')+sub.value+'\n\n'+body.value;
  const ok=()=>toast(x('Texte copié','Text copied')),ko=()=>toast(x('Copie impossible dans ce navigateur','Copy not available in this browser'));
  try{navigator.clipboard.writeText(t).then(ok,ko);}catch(e){ko();}
 });
 $('#restart').addEventListener('click',()=>{
  S.dec={};S.com={};S.comOpen=null;S.edit=null;S.act=c.findings[0].id;
  logp(x('Contrôle recommencé par l\'opérateur','Review restarted by the operator'),10);
  delete S.done[c.id];S.step=2;renderCheck();window.scrollTo(0,0);
 });
 const nf=$('#nextf');if(nf)nf.addEventListener('click',()=>startCase(nextC.id));
 $('#tolist').addEventListener('click',()=>go(1));
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(!$('#sheet').hidden){closeSheet();return;}if(S.comOpen){const id=S.comOpen;S.comOpen=null;paneReview();applyHL(false);const b=document.querySelector(`#f-${id} [data-com]`);if(b)b.focus();}return;}
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 const tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.isContentEditable))return;
 if(S.step!==2||!S.analysed||!$('#sheet').hidden)return;
 const c=S.c,k=e.key.toLowerCase(),i=c.findings.findIndex(f=>f.id===S.act);
 if(k==='j'){e.preventDefault();select(c.findings[Math.min(c.findings.length-1,i+1)].id,true);}
 else if(k==='k'){e.preventDefault();select(c.findings[Math.max(0,i-1)].id,true);}
 else if(k==='a'&&S.act&&!S.dec[S.act]){e.preventDefault();decide(S.act,'yes');}
 else if(k==='r'&&S.act&&!S.dec[S.act]){e.preventDefault();decide(S.act,'no');}
 else if(k==='c'&&S.act){e.preventDefault();openComment(S.act);}
});

/* ---------- boot ---------- */
$('#reset').addEventListener('click',()=>{S.tok++;closeSheet();S=fresh();renderFiles();window.scrollTo(0,0);toast(x('Démo réinitialisée','Demo reset'));});
MQ.addEventListener('change',()=>{closeSheet();if(S.step===2&&S.analysed)renderCheck();else if(S.step===3)renderMessage();});
renderFiles();
})();
</script>
</body>
</html>
