<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500&display=swap">
<style>
:root{
 --bg:#F2F3F5;--surface:#FFFFFF;--sunken:#F7F8F9;--ink:#15191E;--ink2:#3B444F;--muted:#67707C;--line:#D8DCE1;--line2:#E8EBEE;
 --accent:#143F74;--accent-h:#0E2F58;--accent-soft:#EAF0F7;
 --bad:#A3262B;--bad-soft:#FBEEEE;--warn:#8A5800;--warn-soft:#FCF3E0;--ok:#22683C;--ok-soft:#EBF4EE;--hl:#FFF1BF;
 --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--accent)}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;height:52px;padding:0 24px;display:flex;align-items:center;gap:18px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;font-weight:500;text-decoration:none;color:var(--ink2)}
.back:hover{color:var(--accent)}
.top .vr{width:1px;height:22px;background:var(--line)}
.prod{font-weight:600;font-size:.95rem;display:flex;align-items:center;gap:8px;min-width:0}
.prod .mk{width:22px;height:22px;border-radius:3px;background:var(--accent);color:#fff;display:grid;place-items:center}
.prod .mk svg{width:14px;height:14px;stroke-width:1.8}
.prod small{font-weight:400;color:var(--muted);font-size:.85rem}
.top .sp{flex:1}
.lang{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.lang a{padding:3px 10px;font-size:.8rem;font-weight:500;text-decoration:none;color:var(--muted)}
.lang a+a{border-left:1px solid var(--line)}
.lang a[aria-current]{background:var(--ink);color:#fff}
.disc{background:#E9EDF2;border-bottom:1px solid var(--line)}
.disc p{max-width:1280px;margin:0 auto;padding:8px 24px;font-size:.84rem;color:var(--ink2);display:flex;gap:8px;align-items:flex-start}
.disc svg{color:var(--accent);margin-top:1px;width:16px;height:16px}
.disc b{color:var(--ink);font-weight:600}

main{flex:1;width:100%;max-width:1280px;margin:0 auto;padding:28px 24px 48px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:8px 16px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.9rem;font-weight:500;cursor:pointer;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:#B6BDC6;background:var(--sunken)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.lg{min-height:44px;padding:10px 20px;font-size:.95rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.pri[disabled]:hover{background:var(--accent)}
.lnk{background:none;border:0;padding:0;color:var(--accent);font-size:.86rem;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:5px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#B8C6D8}
.lnk:hover{text-decoration-color:var(--accent)}
.lnk svg{width:15px;height:15px}

/* intro */
.intro{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:32px;align-items:start}
.intro h1{font-size:1.75rem;line-height:1.25;font-weight:600;letter-spacing:-.01em;margin:0 0 10px;max-width:34ch}
.lead{font-size:1.02rem;color:var(--ink2);margin:0 0 22px;max-width:62ch}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);background:var(--surface);margin:0 0 28px;padding:0;list-style:none;counter-reset:s}
.how li{padding:14px 16px;counter-increment:s;font-size:.9rem;color:var(--ink2)}
.how li+li{border-left:1px solid var(--line)}
.how b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.how b::before{content:counter(s)". ";color:var(--accent)}
h2.sec{font-size:1.05rem;font-weight:600;margin:0 0 4px}
.sub{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.cases{border:1px solid var(--line);background:var(--surface)}
.case{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;align-items:center;padding:16px 18px}
.case+.case{border-top:1px solid var(--line)}
.case h3{margin:0;font-size:1rem;font-weight:600;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.case h3 small{font-weight:400;font-size:.82rem;color:var(--muted)}
.case p{margin:3px 0 0;color:var(--ink2);font-size:.9rem;max-width:64ch}
.case .meta{margin-top:6px;font-size:.8rem;color:var(--muted);font-family:var(--mono)}
.case .done{display:inline-flex;align-items:center;gap:5px;color:var(--ok);font-weight:500;font-size:.82rem;font-family:var(--sans)}
.case .done svg{width:15px;height:15px}
.case .btn{grid-row:span 2}
.aside{display:grid;gap:16px}
.box{background:var(--surface);border:1px solid var(--line);padding:16px 18px}
.box h2{font-size:.95rem;font-weight:600;margin:0 0 8px}
.box p{margin:0 0 8px;font-size:.88rem;color:var(--ink2)}
.box p:last-child{margin:0}
dl.gl{margin:0;display:grid;gap:10px;font-size:.87rem}
dl.gl dt{font-weight:600}
dl.gl dd{margin:1px 0 0;color:var(--ink2)}

/* case header */
.chead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin:0 0 18px}
.chead .crumb{font-size:.84rem;color:var(--muted);margin:0 0 2px}
.chead .crumb button{font-size:.84rem}
.chead h1{font-size:1.35rem;font-weight:600;margin:0;line-height:1.3}
.chead .facts{margin:4px 0 0;font-size:.86rem;color:var(--ink2);display:flex;flex-wrap:wrap;gap:2px 16px}
.chead .facts span{white-space:nowrap}
.chead .facts b{font-weight:500;color:var(--ink)}
.steps{display:flex;list-style:none;margin:0;padding:0;font-size:.85rem;color:var(--muted)}
.steps li{display:flex;align-items:center;gap:8px;padding:0 0 6px;border-bottom:2px solid var(--line)}
.steps li+li{padding-left:18px}
.steps li i{font-style:normal;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.72rem;background:var(--surface)}
.steps li.cur{color:var(--ink);font-weight:600;border-color:var(--accent)}
.steps li.cur i{background:var(--accent);border-color:var(--accent);color:#fff}
.steps li.ok{color:var(--ink2);border-color:var(--accent)}
.steps li.ok i{border-color:var(--accent);color:var(--accent)}
.steps li.ok i svg{width:12px;height:12px;stroke-width:2.2}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
/* document */
.doc{background:var(--surface);border:1px solid var(--line);position:sticky;top:12px}
.doc>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:.88rem;font-weight:600;cursor:default}
.doc>summary::-webkit-details-marker{display:none}
.doc>summary small{font-weight:400;color:var(--muted)}
.doc>summary .chev{margin-left:auto;display:none;color:var(--muted);transition:transform .2s}
.doc[open]>summary .chev{transform:rotate(180deg)}
.paper{max-height:calc(100vh - 220px);min-height:420px;overflow:auto;padding:4px 0 12px;scroll-behavior:smooth;position:relative}
.dsec{padding:12px 16px 4px}
.dsec h3{margin:0;font-size:.82rem;font-weight:600;color:var(--ink)}
.dsec h3+p{margin:1px 0 8px;font-size:.78rem;color:var(--muted)}
.dsec+.dsec{border-top:1px dashed var(--line);margin-top:8px}
.row{display:grid;grid-template-columns:62px minmax(0,1fr) 128px;gap:10px;padding:3px 8px;margin:0 -8px;font-family:var(--mono);font-size:.75rem;line-height:1.55;border-left:3px solid transparent;transition:background .25s,border-color .25s}
.row .k{color:var(--muted)}
.row .v{color:var(--ink);word-break:break-word}
.row .lb{font-family:var(--sans);font-size:.76rem;color:var(--muted);text-align:right}
.row.scan{background:var(--accent-soft);border-left-color:#8AA3C4}
.row.look{background:var(--accent-soft);border-left-color:var(--accent)}
.row.hl-ev{background:var(--hl);border-left-color:#B98A00}
.row.hl-bad{background:#FBE3E2;border-left-color:var(--bad)}
.row.miss .v{color:var(--bad)}
.hand{font-family:"Caveat",cursive;font-size:1.25rem;line-height:1;color:#1E3F9A;display:inline-block;transform:rotate(-3deg);padding:0 6px;border:1.5px solid #4863A8;border-radius:2px;margin-left:4px}

/* work pane */
.work{background:var(--surface);border:1px solid var(--line);min-width:0}
.work-h{padding:14px 18px;border-bottom:1px solid var(--line)}
.work-h h2{margin:0;font-size:1.05rem;font-weight:600}
.work-h p{margin:2px 0 0;font-size:.88rem;color:var(--ink2)}
.bar{height:3px;background:var(--line2)}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s linear}
.alist{list-style:none;margin:0;padding:8px 18px 14px}
.alist li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);color:var(--muted);font-size:.92rem}
.alist li:last-child{border-bottom:0}
.alist .st{width:18px;height:18px;margin-top:2px;display:grid;place-items:center}
.alist .st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line)}
.alist li.run{color:var(--ink)}
.alist li.run .st::before{width:14px;height:14px;background:none;border:2px solid var(--accent);border-right-color:transparent;animation:spin .7s linear infinite}
.alist li.ok{color:var(--ink)}
.alist li.ok .st::before{display:none}
.alist li.ok .st svg{color:var(--ok);width:18px;height:18px;stroke-width:2}
.alist small{display:block;font-size:.84rem;color:var(--muted)}
.alist li.ok small.bad{color:var(--bad)}
.alist li.ok small.warn{color:var(--warn)}
@keyframes spin{to{transform:rotate(360deg)}}
.work-f{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;border-top:1px solid var(--line);background:var(--sunken)}
.work-f p{margin:0;font-size:.86rem;color:var(--ink2);max-width:52ch}

/* findings */
.tally{display:flex;flex-wrap:wrap;gap:4px 18px;margin:6px 0 0;font-size:.86rem;color:var(--ink2)}
.tally span{display:inline-flex;align-items:center;gap:6px}
.tally svg{width:16px;height:16px}
.c-bad{color:var(--bad)}.c-warn{color:var(--warn)}.c-ok{color:var(--ok)}
.flist{list-style:none;margin:0;padding:0}
.f{padding:16px 18px;border-bottom:1px solid var(--line);border-left:3px solid transparent;cursor:pointer}
.f.act{border-left-color:var(--accent);background:#FBFCFD;cursor:default}
.f-h{display:flex;gap:10px;align-items:flex-start}
.f-h svg{margin-top:2px}
.f-h h3{margin:0;font-size:.98rem;font-weight:600;flex:1;line-height:1.35}
.f-h .kind{font-size:.8rem;font-weight:500;white-space:nowrap;margin-top:2px}
.f-b{margin:8px 0 0 28px}
.f-b p{margin:0 0 10px;font-size:.9rem;color:var(--ink2)}
.ev{border:1px solid var(--line2);background:var(--sunken);padding:8px 10px;font-size:.84rem;margin:0 0 10px}
.ev table{border-collapse:collapse;width:100%}
.ev td{padding:2px 0;vertical-align:top}
.ev td:first-child{color:var(--muted);padding-right:12px;width:1%;white-space:nowrap}
.ev td b{font-weight:600}
.ev td b.x{color:var(--bad)}
.ev .foot{display:flex;justify-content:flex-end;margin-top:4px}
.stamp{display:flex;align-items:center;gap:14px;border:1px solid var(--line2);background:#FAFAF7;padding:10px 12px;margin:0 0 10px;font-size:.8rem;color:var(--muted)}
.stamp .scan{flex:none;width:150px;height:64px;background:repeating-linear-gradient(0deg,#F1EFE8 0 1px,#F7F6F1 1px 3px);border:1px solid #E1DED4;display:grid;place-items:center;position:relative}
.stamp .scan span{font-family:"Caveat",cursive;font-size:1.7rem;color:#1E3F9A;transform:rotate(-4deg);border:2px solid #4863A8;padding:0 8px;border-radius:2px;opacity:.9;filter:blur(.25px)}
.agent{font-size:.86rem;color:var(--ink2);margin:0 0 10px;padding-left:10px;border-left:2px solid var(--line)}
.agent b{font-weight:600;color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.dec{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:.88rem}
.dec span{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.f:not(.act) .f-b{display:none}
.f:not(.act):hover{background:var(--sunken)}
.pend{font-size:.84rem;color:var(--muted)}
.f.decided .f-h h3{color:var(--ink2)}
.f .dline{margin:6px 0 0 28px}
.passed{border-bottom:1px solid var(--line)}
.passed>summary{list-style:none;cursor:pointer;padding:12px 18px;font-size:.9rem;display:flex;align-items:center;gap:8px;color:var(--ink2)}
.passed>summary::-webkit-details-marker{display:none}
.passed>summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
.passed[open]>summary .chev{transform:rotate(180deg)}
.passed ul{list-style:none;margin:0;padding:0 18px 12px 44px;display:grid;gap:8px;font-size:.86rem}
.passed li b{font-weight:500;color:var(--ink)}
.passed li{color:var(--ink2)}
.next{font-size:.86rem;color:var(--ink2)}
.next b{color:var(--ink);font-weight:600}

/* result */
.res{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.res-h{display:flex;gap:12px;align-items:flex-start;margin:0 0 16px}
.res-h .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.res-h .ic svg{width:20px;height:20px;stroke-width:2}
.res-h h2{margin:0;font-size:1.25rem;font-weight:600;line-height:1.3}
.res-h p{margin:3px 0 0;color:var(--ink2);font-size:.92rem;max-width:62ch}
.msg{background:var(--surface);border:1px solid var(--line)}
.msg-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--sunken)}
.msg-h h3{margin:0;font-size:.9rem;font-weight:600}
.msg-h small{color:var(--muted);font-weight:400}
.mhead{padding:12px 18px 0;font-size:.86rem}
.mhead div{display:grid;grid-template-columns:64px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--line2)}
.mhead span{color:var(--muted)}
.mbody{margin:0;padding:14px 18px 18px;white-space:pre-wrap;font-family:var(--sans);font-size:.9rem;line-height:1.6;color:var(--ink)}
.mbody.swift{font-family:var(--mono);font-size:.78rem;line-height:1.7}
.sent{font-size:.82rem;color:var(--muted);margin:8px 0 0}
.sum dl{margin:0;display:grid;font-size:.88rem}
.sum dl div{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line2)}
.sum dl div:last-child{border-bottom:0}
.sum dt{color:var(--muted)}
.sum dd{margin:0}
.time{display:grid;gap:8px;font-size:.84rem;margin-top:4px}
.time div{display:grid;grid-template-columns:96px 1fr 52px;gap:10px;align-items:center}
.time i{display:block;height:8px;background:#B7C0CB}
.time div.ag i{background:var(--accent)}
.time b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.box .note{font-size:.78rem;color:var(--muted);margin-top:8px}
ol.log{list-style:none;margin:0;padding:0;font-size:.84rem;display:grid;gap:7px}
ol.log li{display:grid;grid-template-columns:44px 1fr;gap:8px;color:var(--ink2)}
ol.log time{font-family:var(--mono);font-size:.76rem;color:var(--muted);padding-top:1px}
ol.log b{font-weight:500;color:var(--ink)}
.ctas{display:grid;gap:8px}
.logbox>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:.95rem;font-weight:600}
.logbox>summary::-webkit-details-marker{display:none}
.logbox>summary small{font-weight:400;color:var(--muted)}
.logbox>summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
.logbox[open]>summary .chev{transform:rotate(180deg)}
.logbox[open]>summary{margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,12px);opacity:0;background:var(--ink);color:#fff;padding:9px 14px;border-radius:4px;font-size:.86rem;transition:opacity .2s,transform .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fade{animation:fade .3s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}

@media (max-width:1100px){.intro{grid-template-columns:minmax(0,1fr) 320px}.res{grid-template-columns:minmax(0,1fr) 300px}.row{grid-template-columns:58px minmax(0,1fr)}.row .lb{display:none}}
@media (max-width:900px){
 .intro,.res,.split{grid-template-columns:minmax(0,1fr)}
 .doc{position:static}
 .doc>summary{cursor:pointer}
 .doc:not([open])>summary{border-bottom:0}
 .doc>summary .chev{display:block}
 .paper{max-height:360px;min-height:0}
}
@media (max-width:640px){
 html,body{font-size:14.5px}
 .top-in{padding:0 16px;gap:12px}
 .prod small,.top .vr{display:none}
 .prod{font-size:.9rem}
 .disc p{padding:8px 16px;font-size:.8rem}
 main{padding:18px 16px 32px}
 .intro h1{font-size:1.4rem}
 .lead{font-size:.95rem}
 .how{grid-template-columns:1fr}
 .how li+li{border-left:0;border-top:1px solid var(--line)}
 .case{grid-template-columns:1fr;padding:14px}
 .case .btn{grid-row:auto;width:100%;margin-top:8px}
 .chead{margin-bottom:14px}
 .chead h1{font-size:1.15rem}
 .steps{width:100%}
 .steps li{flex:1;font-size:.78rem;gap:6px}
 .steps li+li{padding-left:8px}
 .f{padding:14px}
 .f-b{margin-left:0}
 .f .dline{margin-left:0}
 .work-h,.alist{padding-left:14px;padding-right:14px}
 .work-f{padding:10px 14px}
 .work-f.ready{position:sticky;bottom:0;z-index:5;box-shadow:0 -4px 12px rgba(20,25,30,.08)}
 .work-f .btn{width:100%}
 .stamp{flex-direction:column;align-items:flex-start}
 .acts .btn{flex:1 1 auto}
 .sum dl div{grid-template-columns:104px 1fr}
 .mhead,.mbody{padding-left:14px;padding-right:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

 wireShell();window.scrollTo(0,0);
 const tok=++S.runToken;
 $('#skip').addEventListener('click',()=>{if(S.runToken!==tok)return;S.runToken++;finishRun(c);});

async function runAnim(c,tok){
 const lis=[...document.querySelectorAll('#alist li')],bar=$('#pbar'),n=c.run.length;
 await wait(350);
 for(let i=0;i<n;i++){
  if(S.runToken!==tok)return;
  const s=c.run[i],li=lis[i];li.className='run';
  if(s.scan!=null){
   const rows=c.docs[s.scan].rows.map(r=>r[1]);
   for(const id of rows){if(S.runToken!==tok)return;const el=document.getElementById('r-'+id);if(el){el.classList.add('scan');if(isDesk())scrollDocTo(id);}await wait(70);}
   await wait(150);rows.forEach(id=>{const el=document.getElementById('r-'+id);if(el)el.classList.remove('scan');});
  }else if(s.rows){
   s.rows.forEach(id=>{const el=document.getElementById('r-'+id);if(el)el.classList.add('look');});
   if(isDesk())scrollDocTo(s.rows[0]);
   await wait(750);
   if(S.runToken!==tok)return;
   s.rows.forEach(id=>{const el=document.getElementById('r-'+id);if(el)el.classList.remove('look');});
  }else await wait(600);
  if(S.runToken!==tok)return;
  li.className='ok';li.querySelector('.st').innerHTML=ic('check');const sm=li.querySelector('small');sm.textContent=s.r;if(s.c)sm.className=s.c;
  bar.style.width=Math.round(100*(i+1)/n)+'%';
 }
 await wait(700);
 if(S.runToken!==tok)return;
 S.runToken++;finishRun(c);
}
function finishRun(c){

 S.act=c.findings[0].id;renderReview();
}

   <div class="ev"><table>${f.ev.map(e=>`<tr><td>${e[0]}</td><td>${e[1]}</td></tr>`).join('')}</table>
    <div class="foot"><button class="lnk" data-see="${f.id}">${ic('eye')}${x('Voir dans le document','Show in the document')}</button></div></div>
   ${d?'':`<p class="agent"><b>${x("Proposition de l'agent :","Agent's suggestion:")}</b> ${esc(f.ag)}</p>
   <div class="acts"><button class="btn pri" data-yes="${f.id}">${esc(f.yes)}</button><button class="btn" data-no="${f.id}">${esc(f.no)}</button></div>`}
  </div></li>`;
}
function renderReview(){
 const c=S.c;S.scr='review';
 const ko=c.findings.filter(f=>f.k==='ko').length,ck=c.findings.length-ko;
 const left=c.findings.filter(f=>!S.dec[f.id]).length;
 const o=OUT[outcome(c)];
 const tally=c.kind==='amd'
  ?`<span class="c-warn">${ic('help')}${ko} ${x('questions pour le client','questions for the client')}</span><span class="c-warn">${ic('help')}${ck} ${x('point à vérifier par vous','point for you to check')}</span>`
  :(ko?`<span class="c-bad">${ic('alert')}${ko} ${x(ko>1?'anomalies':'anomalie',ko>1?'discrepancies':'discrepancy')}</span>`:'')+(ck?`<span class="c-warn">${ic('help')}${ck} ${x('point à vérifier par vous','point for you to check')}</span>`:'');
 $('#app').innerHTML=`<div>${headHtml(c,1)}<div class="split">${docHtml(c)}
  <section class="work"><div class="work-h"><h2>${x("Conclusions de l'agent","The agent's findings")}</h2>
   <p>${x('Pour chaque point, lisez l\'explication puis décidez. La décision finale vous appartient.','For each point, read the explanation, then decide. The final decision is yours.')}</p>
   <p class="tally">${tally}<span class="c-ok">${ic('circleCheck')}${c.passed.length} ${x('contrôles conformes','checks passed')}</span></p></div>
   <ul class="flist" id="flist">${c.findings.map(f=>fHtml(c,f)).join('')}</ul>
   <details class="passed"><summary>${ic('circleCheck','c-ok')}${x('Voir les ','See the ')+c.passed.length+x(' contrôles conformes',' checks that passed')}${ic('chev','chev')}</summary>
    <ul>${c.passed.map(p=>`<li><b>${esc(p[0])}</b>${x(' : ',': ')}${esc(p[1])}</li>`).join('')}</ul></details>
   <div class="work-f${left?'':' ready'}"><p class="next" id="next">${left?x(`Encore ${left} point${left>1?'s':''} à décider.`,`${left} point${left>1?'s':''} left to decide.`):`${x('Suite : ','Next step: ')}<b>${esc(o.next)}</b>`}</p>
    <button class="btn pri lg" id="validate"${left?' disabled':''}>${x('Valider le dossier','Validate the file')} ${ic('right')}</button></div>
  </section></div></div>`;
 wireShell();
 applyHL();
 const fl=$('#flist');
 fl.addEventListener('click',e=>{
  const b=e.target.closest('button');const li=e.target.closest('.f');
  if(b&&b.dataset.yes)return decide(b.dataset.yes,'yes');
  if(b&&b.dataset.no)return decide(b.dataset.no,'no');
  if(b&&b.dataset.undo){delete S.dec[b.dataset.undo];S.act=b.dataset.undo;logp(x('Décision rouverte : ','Decision reopened: ')+c.findings.find(f=>f.id===b.dataset.undo).t);return rerender(b.dataset.undo);}
  if(b&&b.dataset.see){S.act=b.dataset.see;applyHL(true);return;}
  if(li&&S.act!==li.dataset.f){S.act=li.dataset.f;rerender(li.dataset.f);}
 });
 $('#validate').addEventListener('click',()=>{if(!allDecided(c))return;finish();});
}
function rerender(focusId){
 const y=window.scrollY;renderReview();window.scrollTo(0,y);
 if(focusId){const el=document.querySelector(`.f[data-f="${focusId}"]`);if(el&&!isDesk()){const r=el.getBoundingClientRect();if(r.top<60||r.top>innerHeight-120)el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});}}
}
function applyHL(open){
 clearHL();const c=S.c,f=c.findings.find(k=>k.id===S.act);if(!f)return;
 f.hl.forEach(id=>{const el=document.getElementById('r-'+id);if(el)el.classList.add('hl-ev');});
 f.bad.forEach(id=>{const el=document.getElementById('r-'+id);if(el)el.classList.add('hl-bad');});
 const first=(f.bad[0]||f.hl[0]);
 if(isDesk()||open)scrollDocTo(first,open);
}
function decide(id,v){
 const c=S.c,f=c.findings.find(k=>k.id===id);S.dec[id]=v;
 logp(x('Opérateur · ','Operator · ')+f.t+' → '+(v==='yes'?f.yesS:f.noS));
 const nx=c.findings.find(k=>!S.dec[k.id]);S.act=nx?nx.id:null;
 rerender(nx?nx.id:null);
 if(!nx&&!isDesk()){const v2=$('#validate');if(v2)v2.focus({preventScroll:true});}
}

/* ---------- result ---------- */
function finish(){
 const c=S.c,oid=outcome(c),o=OUT[oid],m=draft(c);
 logp(x('Dossier validé par l\'opérateur','File validated by the operator'));
 logp(x('Message préparé : ','Message prepared: ')+o.msg+x(' (non envoyé, démo)',' (not sent, demo)'));
 S.done[c.id]=o.msg;S.scr='result';
 const n=issues(c).length;const saved=c.man-c.ag;
 const colBg={bad:'var(--bad-soft)',ok:'var(--ok-soft)',warn:'var(--warn-soft)'}[o.col];
 $('#app').innerHTML=`<div class="fade">${headHtml(c,2)}<div class="res">
  <div><div class="res-h"><span class="ic c-${o.col}" style="background:${colBg}">${ic(o.ic)}</span><div><h2>${esc(o.t)}</h2><p>${esc(o.d)}</p></div></div>
   <section class="msg"><div class="msg-h"><h3>${esc(o.msg)} <small>· ${x("rédigé par l'agent, relu par vous",'drafted by the agent, reviewed by you')}</small></h3><button class="btn" id="copy">${ic('copy')}${x('Copier','Copy')}</button></div>
    <div class="mhead"><div><span>${x('À','To')}</span><b>${esc(m.to)}</b></div><div><span>${x('Objet','Subject')}</span><b>${esc(m.sub)}</b></div></div>
    <pre class="mbody${m.swift?' swift':''}" id="mbody">${esc(m.body)}</pre></section>
   <p class="sent">${x("Rien n'est envoyé : c'est une démo simulée avec des données fictives.",'Nothing is sent: this is a simulated demo with fictional data.')}</p></div>
  <div class="aside">
   <section class="box sum"><h2>${x('Récapitulatif','Summary')}</h2><dl>
    <div><dt>${x('Dossier','File')}</dt><dd>${c.ref}</dd></div>
    <div><dt>${x('Décision','Decision')}</dt><dd>${esc(o.next)}</dd></div>
    <div><dt>${c.kind==='amd'?x('Points retenus','Points kept'):x('Anomalies retenues','Discrepancies kept')}</dt><dd>${n} ${x('sur','of')} ${c.findings.length}</dd></div>
    <div><dt>${x('Contrôles conformes','Checks passed')}</dt><dd>${c.passed.length}</dd></div>
   </dl></section>
   <section class="box"><h2>${x('Temps de traitement','Processing time')}</h2>
    <div class="time"><div><span>${x('À la main','By hand')}</span><i style="width:100%"></i><b>${c.man} min</b></div>
     <div class="ag"><span>${x('Avec l\'agent','With the agent')}</span><i style="width:${Math.round(100*c.ag/c.man)}%"></i><b>${c.ag} min</b></div></div>
    <p class="note">${x(`Estimation illustrative, non mesurée : environ ${saved} minutes gagnées, surtout sur la lecture et la rédaction.`,`Illustrative estimate, not measured: about ${saved} minutes saved, mostly on reading and drafting.`)}</p></section>
   <details class="box logbox"${isDesk()?' open':''}><summary>${x('Journal du dossier','File log')} <small>(${S.log.length})</small>${ic('chev','chev')}</summary><ol class="log">${S.log.map(l=>`<li><time>${l.t}</time><span>${esc(l.txt)}</span></li>`).join('')}</ol></details>
   <div class="ctas"><button class="btn pri lg" id="again">${ic('redo')}${x('Essayer un autre cas','Try another case')}</button><a class="btn lg" href="${EN?'../en/#projets':'../#projets'}">${ic('left')}${x('Retour au CV','Back to CV')}</a></div>
  </div></div></div>`;
 wireShell();window.scrollTo(0,0);
 $('#again').addEventListener('click',goHome);
 $('#copy').addEventListener('click',()=>{const t=(x('À : ','To: ')+m.to+'\n'+x('Objet : ','Subject: ')+m.sub+'\n\n'+m.body);
  const ok=()=>toast(x('Texte copié','Text copied'));
  try{navigator.clipboard.writeText(t).then(ok,()=>toast(x('Copie impossible dans ce navigateur','Copy not available in this browser')));}catch(e){toast(x('Copie impossible dans ce navigateur','Copy not available in this browser'));}});
}

/* ---------- boot ---------- */
document.querySelectorAll('.lang a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();location.href='?lang='+a.dataset.l;}));
renderIntro();
})();
</script>
</body>
</html>
