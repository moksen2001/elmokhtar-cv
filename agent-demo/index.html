<style>
:root{--bg:#0C1413;--surface:#131F1E;--s2:#1A2927;--ink:#E5ECE9;--ink2:#C0CCC8;--muted:#8D9D98;--line:#253734;--teal:#46B99D;--teal-soft:#153029;--sun:#E6AE48;--sun-soft:#2D2413;--red:#F08A68;--red-soft:#34201A;--ok:#6BD39A;--blue:#8CB8F0;--blue-soft:#172536;--vio:#B9A3F0;--vio-soft:#241E38;
--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Instrument Sans",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
a{color:var(--teal)}
button,input,textarea{font:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:9px 20px;background:#07100F;border-bottom:1px solid var(--line);font-size:.84rem}
.bar a{font-weight:600;text-decoration:none;color:var(--sun)}
.bar .tag{font-family:var(--mono);font-size:.72rem;padding:3px 8px;border-radius:6px;background:var(--sun);color:#2A1D05;font-weight:500}
.bar .sp{flex:1}
.bar .dis{color:var(--ink2)}
.bar .lang{display:flex;gap:4px}.bar .lang a{color:var(--muted);padding:2px 6px;border-radius:6px}.bar .lang a[aria-current]{background:var(--teal);color:#06201A}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 40px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 24px;margin-bottom:14px}
.head h1{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,3vw,2.3rem);letter-spacing:-.02em;margin:0;line-height:1.1}
.head p{margin:6px 0 0;color:var(--ink2);max-width:70ch}
.head .meta{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.disc{display:flex;gap:10px;align-items:flex-start;margin:0 0 18px;padding:10px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--sun) 45%,var(--line));background:var(--sun-soft);color:#F2D39A;font-size:.86rem}
.disc b{color:var(--sun)}
.ico{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.72rem;background:var(--sun);color:#2A1D05;margin-top:1px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);font-size:.85rem;font-weight:600;color:var(--ink);line-height:1.25}
.btn:hover{border-color:var(--teal);color:var(--teal)}
.btn.p{background:var(--teal);border-color:var(--teal);color:#06201A}
.btn.p:hover{filter:brightness(1.08);color:#06201A}
.btn.sm{padding:5px 10px;font-size:.8rem;border-radius:8px}
.btn.warn:hover{border-color:var(--red);color:var(--red)}
.btn[disabled],.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;filter:none}
.btn:focus-visible{outline:2px solid var(--sun)}
.mut{color:var(--muted);font-size:.84rem}
/* ---------- queue ---------- */
.guide{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:0 0 14px;font-size:.84rem;color:var(--ink2)}
.guide b{color:var(--ink);margin-right:4px}
.guide span{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--s2);border:1px solid var(--line)}
.guide i{font-style:normal;font-family:var(--mono);font-size:.7rem;color:var(--sun)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{padding:14px 16px}
.kpi .l{font-size:.8rem;color:var(--muted)}
.kpi .v{font-family:var(--display);font-weight:800;font-size:1.75rem;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.kpi .s{font-size:.78rem;color:var(--muted);margin-top:2px}
.kpi .meter{height:5px;border-radius:9px;background:var(--s2);margin-top:8px;overflow:hidden}
.kpi .meter i{display:block;height:100%;background:var(--red);border-radius:9px}
.qtools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-size:.8rem;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--teal);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#06201A;font-weight:600}
.chip .n{font-family:var(--mono);font-size:.7rem;opacity:.75}
.search{display:flex;gap:8px;align-items:center}
.search input{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 11px;color:var(--ink);width:230px;max-width:100%}
.search input:focus{outline:none;border-color:var(--teal)}
.qhead,.qrow{display:grid;grid-template-columns:1.35fr 2fr 1fr .85fr 1fr 1.25fr 18px;gap:12px;align-items:center;padding:11px 16px}
.qhead{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
.qrow{border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:.88rem;transition:background .2s}
.qrow:last-child{border-bottom:0;border-radius:0 0 18px 18px}
a.qrow:hover{background:var(--s2)}
.qrow.bg{cursor:pointer;color:var(--ink2)}
.qrow.bg:hover{background:color-mix(in srgb,var(--s2) 50%,transparent)}
.qrow .ref{font-family:var(--mono);font-size:.8rem;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.scn{font-family:var(--mono);font-size:.62rem;padding:2px 6px;border-radius:5px;background:var(--sun);color:#2A1D05;font-weight:500;white-space:nowrap}
.bgt{font-family:var(--mono);font-size:.62rem;padding:2px 6px;border-radius:5px;background:var(--s2);color:var(--muted)}
.par small{display:block;color:var(--muted);font-size:.8rem}
.amt{font-family:var(--mono);font-size:.8rem}
.dl small{display:block;font-size:.76rem;color:var(--muted)}
.dl .hot{color:var(--red)}
.go{color:var(--muted)}
.empty-q{padding:26px 16px;text-align:center;color:var(--muted)}
.qfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-new{background:var(--blue-soft);color:var(--blue)}
.s-run{background:var(--s2);color:var(--ink2)}
.s-run::before{background:none;border:2px solid var(--teal);border-top-color:transparent;width:6px;height:6px;animation:spin .8s linear infinite}
.s-anom{background:var(--red-soft);color:var(--red)}
.s-ready{background:var(--sun-soft);color:var(--sun)}
.s-client{background:var(--vio-soft);color:var(--vio)}
.s-done{background:var(--teal-soft);color:var(--teal)}
/* ---------- case ---------- */
.case-h{padding:16px 18px;margin-bottom:14px}
.case-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.case-top h2{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:-.01em;margin:0;line-height:1.2}
.case-top .sp{flex:1}
.case-meta{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:8px;font-size:.86rem;color:var(--ink2)}
.case-meta b{color:var(--ink);font-weight:600}
.case-meta .hot{color:var(--red)}
.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:14px 0 0;list-style:none;padding:0}
.stepper li{font-size:.76rem;color:var(--muted);padding-top:7px;border-top:3px solid var(--line);line-height:1.3}
.stepper li.done{border-color:var(--teal);color:var(--ink2)}
.stepper li.cur{border-color:var(--sun);color:var(--ink);font-weight:600}
.cgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:16px;align-items:start}
.doc{position:sticky;top:58px;overflow:hidden}
.doc summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:.85rem;color:var(--muted);cursor:pointer}
.doc summary::-webkit-details-marker{display:none}
.doc summary b{color:var(--ink);font-weight:600}
.doc summary .pl{margin-left:auto;font-family:var(--mono);font-size:.68rem;padding:3px 8px;border-radius:6px;background:var(--s2);color:var(--muted)}
.doc summary .car{transition:transform .2s;color:var(--muted)}
.doc details:not([open]) summary{border-bottom:0}
.doc details[open] summary .car{transform:rotate(90deg)}
.paper{margin:14px;padding:18px 20px;border-radius:10px;background:#F4F1E8;color:#23201A;font-family:var(--mono);font-size:.72rem;line-height:1.6;max-height:calc(100vh - 200px);overflow:auto;position:relative}
.paper h2{font-family:var(--mono);font-size:.78rem;margin:0 0 8px;letter-spacing:.05em;padding-right:80px}
.paper .row{display:grid;grid-template-columns:58px 1fr;gap:8px;padding:2px 4px;border-radius:5px;transition:background .4s,box-shadow .4s}
.paper .row .k{color:#7B7466}
.paper .row.hl{background:#FFE9A8;box-shadow:inset 3px 0 0 #D29A12}
.paper .row.bad{background:#FFD6C8;box-shadow:inset 3px 0 0 #D0613F}
.paper .row.flash{animation:flash 1s}
@keyframes flash{30%{box-shadow:inset 3px 0 0 #D0613F,0 0 0 3px #D29A12}}
.paper .sep{border-top:1px dashed #C9C1AE;margin:10px 0}
.paper .pres h2{color:#4D5CC4;padding-right:0}
.stamp{position:absolute;right:14px;top:14px;font-family:var(--mono);font-size:.6rem;color:#A0342A;border:1.5px solid #A0342A;padding:2px 6px;border-radius:4px;transform:rotate(6deg);opacity:.75}
.work{min-width:0}
.tabs{display:flex;gap:2px;padding:4px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;padding:11px 11px 10px;font-size:.87rem;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--teal)}
.tab .n{font-family:var(--mono);font-size:.66rem;padding:1px 6px;border-radius:999px;background:var(--s2);color:var(--ink2)}
.tab .n.hot{background:var(--red);color:#2A0F07}
.tab:focus-visible{outline:2px solid var(--sun);outline-offset:-2px}
.panel{padding:16px 18px}
.panel h3{font-family:var(--display);font-size:1.1rem;margin:0 0 6px}
.empty{padding:6px 2px}
.empty p{color:var(--ink2);margin:0 0 12px}
.plan{margin:0 0 16px;padding:0;list-style:none;display:grid;gap:8px;counter-reset:p}
.plan li{counter-increment:p;display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:.9rem}
.plan li::before{content:counter(p);width:22px;height:22px;border-radius:50%;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:.7rem;color:var(--ink2)}
.plan small{display:block;color:var(--muted);font-size:.8rem}
.bub{background:var(--s2);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:12px 14px}
.bub p{margin:0 0 6px}.bub p:last-child{margin:0}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.step{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;font-size:.92rem}
.step .ic{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px}
.step.run .ic{border-color:var(--teal);border-top-color:transparent;animation:spin .8s linear infinite}
.step.done .ic{border-color:var(--teal);background:var(--teal)}
.step.done .ic::after{content:"";width:6px;height:10px;border:solid #06201A;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.step small{display:block;color:var(--muted);font-size:.8rem}
.step .t{font-family:var(--mono);font-size:.7rem;color:var(--muted);padding-top:2px}
@keyframes spin{to{transform:rotate(360deg)}}
.sumbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.sumbar div{padding:9px 11px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:.76rem;color:var(--muted)}
.sumbar b{display:block;font-family:var(--display);font-size:1.3rem;color:var(--ink);line-height:1.1}
.sumbar .k b{color:var(--red)}.sumbar .c b{color:var(--sun)}.sumbar .o b{color:var(--teal)}
.prog{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px;font-size:.84rem;color:var(--ink2)}
.prog .track{flex:1;min-width:120px;height:6px;border-radius:9px;background:var(--s2);overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--teal);transition:width .4s}
.flist{display:grid;gap:10px}
.f{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;background:var(--bg);transition:border-color .2s}
.f.ko{border-color:color-mix(in srgb,var(--red) 55%,var(--line));background:var(--red-soft)}
.f.check{border-color:color-mix(in srgb,var(--sun) 50%,var(--line));background:var(--sun-soft)}
.f.okd{opacity:.92}
.f-top{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.f-top h4{margin:0;font-size:.95rem;flex:1;min-width:150px;line-height:1.35}
.f-top h4 .num{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-right:6px}
.bdg{font-family:var(--mono);font-size:.64rem;padding:3px 7px;border-radius:6px;white-space:nowrap;letter-spacing:.02em}
.b-ok{background:var(--teal-soft);color:var(--teal)}
.b-ko{background:var(--red);color:#2A0F07}
.b-check{background:var(--sun);color:#2A1D05}
.opt{font-size:.74rem;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
.opt.a{background:var(--teal-soft);color:var(--teal)}
.opt.o{background:var(--vio-soft);color:var(--vio)}
.f p{margin:0;font-size:.88rem;color:var(--ink2)}
.rule{font-size:.8rem;color:var(--muted)}
.rule b{font-family:var(--mono);font-size:.66rem;font-weight:500;color:var(--ink2);margin-right:4px;letter-spacing:.04em}
.srcs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.src{all:unset;cursor:pointer;font-family:var(--mono);font-size:.66rem;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--ink2);background:var(--surface)}
.src:hover,.src:focus-visible{border-color:var(--sun);color:var(--sun)}
.dec{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px}
.coms{display:grid;gap:4px}
.com{font-size:.82rem;color:var(--ink2);border-left:2px solid var(--vio);padding:1px 0 1px 8px}
.com span{font-family:var(--mono);font-size:.66rem;color:var(--muted);margin-right:6px}
.ed{display:grid;gap:6px}
.ed label{font-size:.8rem;color:var(--ink2)}
textarea{width:100%;min-height:62px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--ink)}
textarea:focus{outline:none;border-color:var(--teal)}
.ed .err{color:var(--red);font-size:.78rem}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.valbox{margin-top:14px;padding:14px;border-radius:12px;border:1px dashed var(--line);display:grid;gap:10px}
.valbox p{margin:0;font-size:.88rem;color:var(--ink2)}
.valbox .rec{color:var(--ink)}
.state{padding:12px 14px;border-radius:12px;font-size:.88rem;display:grid;gap:8px}
.state.cl{background:var(--vio-soft);color:#D8CCF7}
.state.dn{background:var(--teal-soft);color:#BDEBDD}
.state b{color:var(--ink)}
.hitl{display:flex;gap:8px;padding:10px 12px;border-radius:10px;background:var(--sun-soft);color:#F2D39A;font-size:.85rem;margin-top:12px}
table.ext{width:100%;border-collapse:collapse;font-size:.84rem}
table.ext th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
table.ext td{padding:7px 8px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.ext tr{cursor:pointer}
table.ext tbody tr:hover td{background:color-mix(in srgb,var(--s2) 60%,transparent)}
table.ext td.tg{font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
table.ext td.lb{color:var(--ink2);width:30%}
.conf{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.7rem;white-space:nowrap}
.conf .m{width:44px;height:5px;border-radius:9px;background:var(--s2);overflow:hidden}
.conf .m i{display:block;height:100%;background:var(--teal)}
.conf.lo{color:var(--sun)}.conf.lo .m i{background:var(--sun)}
.flag{font-family:var(--mono);font-size:.6rem;color:#2A1D05;background:var(--sun);padding:1px 5px;border-radius:4px;margin-left:4px}
.exth{margin:18px 0 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.exsum{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.84rem;color:var(--ink2);margin-bottom:10px}
.exsum b{color:var(--ink)}
/* chat */
.chat{display:flex;flex-direction:column;margin:-16px -18px}
.chat-h{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--teal),#2E7F6B);color:#06201A;font-weight:800;font-family:var(--display);font-size:.85rem}
.chat-h b{display:block;font-size:.92rem}
.chat-h small{color:var(--muted);font-size:.78rem}
.chat-h .st{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.chat-h .st i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.log{padding:16px 18px;display:flex;flex-direction:column;gap:12px;overflow:auto;height:min(520px,calc(100vh - 380px));min-height:340px;scroll-behavior:smooth}
.msg{max-width:92%}
.msg.new{animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.msg.me{align-self:flex-end;background:var(--teal);color:#06201A;padding:9px 13px;border-radius:14px 14px 4px 14px;font-weight:500;font-size:.92rem}
.msg.ai{align-self:flex-start}
.msg.ai .bub{font-size:.92rem}

.inp{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}

 A:[{q:x('Pourquoi le montant est-il en réserve ?','Why is the amount a discrepancy?'),re:/(montant|amount|factur|invoice|toléran|toleran)/i,needs:1,hl:()=>[['amt','bad'],['tol','bad'],['p-inv','bad']],a:sc=>x(`<p>Le crédit est de <b>1 250 000 USD</b> avec une tolérance de ± 5 % (39A) : le maximum tirable est donc <b>1 312 500 USD</b>.</p><p>La facture et le montant réclamé s'élèvent à <b>1 318 750 USD</b>, soit 6 250 USD de trop.</p><p>L'UCP 600 (art. 18(b)) permet d'accepter une facture excédentaire si la banque ne paie pas au-delà du montant autorisé. Comme le montant réclamé dépasse lui-même le crédit, je laisse le point en réserve : c'est à vous de trancher.</p>`,`<p>The credit is <b>USD 1,250,000</b> with a ±5% tolerance (39A), so the maximum drawable is <b>USD 1,312,500</b>.</p><p>The invoice and the amount claimed are <b>USD 1,318,750</b>, i.e. USD 6,250 too much.</p><p>UCP 600 (art. 18(b)) allows accepting an invoice in excess if the bank does not pay more than permitted. Since the amount claimed itself exceeds the credit, I keep it as a discrepancy: your call.</p>`)+decNote(sc,'amt')},
  {q:x('Jusqu’à quand le certificat phytosanitaire peut-il être présenté ?','Until when can the phytosanitary certificate be presented?'),re:/(phyto|manquant|missing|jusqu|until|corrig|cure)/i,needs:1,hl:()=>[['per','hl'],['ship','hl'],['p-bl','hl'],['p-phy','bad']],a:()=>x(`<p>Pas jusqu'au 15 déc. : le champ 48 impose une présentation dans les <b>21 jours suivant l'expédition</b>. Avec une mise à bord le 18 nov., une présentation complémentaire doit intervenir au plus tard le <b>9 déc. 2025</b>, et toujours avant la validité.</p><p>J'ai ajouté ce rappel dans le brouillon d'avis de refus.</p>`,`<p>Not until 15 Dec: field 48 requires presentation within <b>21 days after shipment</b>. With an on-board date of 18 Nov, a further presentation must be made by <b>9 Dec 2025</b> at the latest, and always before expiry.</p><p>I added this reminder to the draft refusal notice.</p>`)},
  {q:x('Quel est notre délai pour répondre ?','What is our deadline to respond?'),re:/(délai|delai|deadline|quand|when|jours ouvr|banking day|notif|répondre|respond)/i,a:()=>x(`<p>Présentation reçue le <b>vendredi 5 déc.</b> La banque dispose au maximum de <b>5 jours ouvrés suivant le jour de présentation</b> pour se prononcer (UCP 600, art. 14(b)) : échéance le <b>vendredi 12 déc. 2025</b>.</p><p>Un éventuel refus doit être notifié en une seule fois, avec toutes les réserves, au plus tard à la clôture de ce 5e jour ouvré (art. 16(c) et 16(d)). Jours fériés non pris en compte dans la démo.</p>`,`<p>Presentation received on <b>Friday 5 Dec</b>. The bank has a maximum of <b>5 banking days following the day of presentation</b> (UCP 600, art. 14(b)): deadline <b>Friday 12 Dec 2025</b>.</p><p>Any refusal must be given in a single notice listing every discrepancy, no later than the close of that 5th banking day (art. 16(c) and 16(d)). Bank holidays ignored in the demo.</p>`)},
  {q:x('Et si le donneur d’ordre accepte les réserves ?','What if the applicant waives the discrepancies?'),re:/(donneur|applicant|client|lev[ée]|waive|accept)/i,a:()=>x(`<p>La banque émettrice peut, à sa seule appréciation, solliciter le donneur d'ordre pour qu'il lève les réserves (UCP 600, art. 16(b)). Cette démarche <b>ne prolonge pas</b> le délai d'examen du 12 déc.</p><p>Je prépare ce message si vous choisissez « Solliciter la levée des réserves » à la validation.</p>`,`<p>The issuing bank may, in its sole judgement, approach the applicant for a waiver (UCP 600, art. 16(b)). This <b>does not extend</b> the 12 Dec examination deadline.</p><p>I will draft that message if you pick “Ask the applicant to waive” at validation.</p>`)}],
 B:[{q:x('Pourquoi confirmer la date du B/L ?','Why confirm the B/L date?'),re:/(confirm|b\/l|connaissement|bill of lading|tampon|stamp|confiance|confidence|72)/i,needs:1,hl:()=>[['p-bl','hl'],['ship','hl']],a:sc=>x(`<p>La date de mise à bord figure sur un <b>tampon manuscrit</b>. Je l'ai lue « 24.11.2025 » avec <b>72 %</b> de confiance, sous le seuil de 85 % fixé pour ce type de champ.</p><p>Cette date conditionne trois contrôles : la date limite d'expédition, le délai de présentation et l'échéance du paiement différé. D'où la confirmation visuelle demandée.</p>`,`<p>The on-board date is a <b>handwritten stamp</b>. I read “24.11.2025” with <b>72%</b> confidence, below the 85% threshold for this kind of field.</p><p>That date drives three checks: latest shipment, presentation period and the deferred payment maturity. Hence the visual confirmation.</p>`)+decNote(sc,'bl')},
  {q:x('Quelle est la date d’échéance du paiement ?','When is payment due?'),re:/(échéance|echeance|maturity|différé|deferred|60|payer|pay|due)/i,needs:1,hl:()=>[['av','hl'],['def','hl'],['p-bl','hl']],a:()=>x(`<p>Le crédit est réalisable par <b>paiement différé à 60 jours date de B/L</b> (42P). Avec une mise à bord le 24 nov. 2025, l'échéance tombe le <b>23 janv. 2026</b>.</p><p>Si la date du tampon devait être corrigée, l'échéance serait recalculée.</p>`,`<p>The credit is available by <b>deferred payment at 60 days after B/L date</b> (42P). With an on-board date of 24 Nov 2025, maturity is <b>23 Jan 2026</b>.</p><p>If the stamp date were corrected, maturity would be recalculated.</p>`)},
  {q:x('Vérifie le calcul de l’assurance','Check the insurance calculation'),re:/(assurance|insurance|110)/i,needs:1,hl:()=>[['docs','hl'],['p-ins','hl']],a:()=>x(`<p>486 000 EUR × 110 % = <b>534 600 EUR</b> : c'est exactement le montant du certificat présenté. Couverture conforme à l'exigence de 46A.</p>`,`<p>EUR 486,000 × 110% = <b>EUR 534,600</b>: exactly the amount on the certificate. Cover complies with 46A.</p>`)},
  {q:x('Que se passe-t-il quand je valide ?','What happens when I validate?'),re:/(valid|ensuite|next|après|after)/i,a:()=>x(`<p>Je prépare l'avis de conformité avec l'engagement de payer à l'échéance du 23 janv. 2026. Rien ne part automatiquement : dans un vrai flux, l'opérateur l'émettrait via les outils habituels. Ici, l'action est simplement tracée dans le journal.</p>`,`<p>I prepare the notice of compliance with the undertaking to pay at maturity on 23 Jan 2026. Nothing goes out automatically: in a real flow the operator would send it through the usual tools. Here, the action is simply logged.</p>`)}],
 C:[{q:x('Le bénéficiaire peut-il corriger ces réserves ?','Can the beneficiary cure these discrepancies?'),re:/(corrig|correct|cure|nouvelle présentation|re-?present|bénéficiaire|beneficiary)/i,needs:1,a:()=>x(`<p>Difficilement. Une <b>expédition tardive</b> ne se corrige pas : la date de mise à bord est un fait. Pour l'écart de quantité (1 180 sacs sur le B/L contre 1 200 facturés), il faudrait des documents réémis et un montant réduit.</p><p>La voie pragmatique : demander au donneur d'ordre s'il accepte de lever les réserves.</p>`,`<p>Hardly. A <b>late shipment</b> cannot be cured: the on-board date is a fact. For the quantity gap (1,180 bags on the B/L vs 1,200 invoiced), documents would need reissuing with a reduced amount.</p><p>The pragmatic route: ask the applicant whether it will waive the discrepancies.</p>`)},
  {q:x('Que demande-t-on exactement au client ?','What exactly do we ask the client?'),re:/(client|donneur|applicant|demande|ask|question|lev|waive)/i,a:()=>x(`<p>On demande à Maison Duvernay Cafés (fictif) s'il accepte de <b>lever les réserves</b> (UCP 600, art. 16(b)). La décision d'honorer reste celle de la banque.</p><p>Attention : cette démarche <b>ne prolonge pas</b> le délai d'examen. Sans réponse avant le <b>9 déc. 2025</b>, il faudra notifier le refus.</p>`,`<p>We ask Maison Duvernay Cafés (fictitious) whether it agrees to <b>waive the discrepancies</b> (UCP 600, art. 16(b)). The decision to honour remains the bank's.</p><p>Note: this <b>does not extend</b> the examination period. Without a reply before <b>9 Dec 2025</b>, a refusal notice must be sent.</p>`)},
  {q:x('Et si le client refuse ?','What if the client says no?'),re:/(refus|refuse|reject|says no|pas d.accord)/i,a:()=>x(`<p>Il faudra envoyer un <b>avis de refus unique</b> au présentateur, listant toutes les réserves et indiquant ce que la banque fait des documents (par exemple : conservés dans l'attente d'instructions), au plus tard à la clôture du 5e jour ouvré (UCP 600, art. 16(c) et 16(d)).</p>`,`<p>A <b>single refusal notice</b> must go to the presenter, listing every discrepancy and stating what the bank does with the documents (e.g. holding them pending instructions), no later than the close of the 5th banking day (UCP 600, art. 16(c) and 16(d)).</p>`)},
  {q:x('Pourquoi 20 sacs d’écart posent problème ?','Why do 20 missing bags matter?'),re:/(sacs|bags|écart|gap|quantit)/i,needs:1,hl:()=>[['pship','hl'],['p-inv','bad'],['p-bl','bad'],['p-pkl','bad']],a:()=>x(`<p>Deux raisons : les documents se contredisent (UCP 600, art. 14(d)), et les expéditions partielles sont interdites (43P). La facture réclame 1 200 sacs alors que le transporteur n'en atteste que 1 180 à bord.</p>`,`<p>Two reasons: the documents conflict (UCP 600, art. 14(d)), and partial shipments are not allowed (43P). The invoice claims 1,200 bags while the carrier only evidences 1,180 on board.</p>`)}],
 D:[{q:x('Pourquoi prolonger la validité ?','Why extend the expiry?'),re:/(validit|expiry|prolong|extend|31d|janv|jan)/i,needs:1,hl:()=>[['exp','bad'],['per','hl'],['a-ship','hl'],['a-exp','bad']],a:sc=>x(`<p>Avec une expédition possible jusqu'au <b>31 déc.</b> et une validité inchangée au <b>10 janv.</b>, le bénéficiaire n'aurait que <b>10 jours</b> pour présenter, au lieu des 21 prévus en 48 : la présentation doit de toute façon intervenir avant la validité (UCP 600, art. 14(c)).</p><p>Prolonger au <b>21 janv. 2026</b> rétablit le délai. Le choix appartient au client, d'où la question.</p>`,`<p>With shipment allowed until <b>31 Dec</b> and expiry unchanged at <b>10 Jan</b>, the beneficiary would have only <b>10 days</b> to present instead of the 21 set in 48: presentation must happen before expiry anyway (UCP 600, art. 14(c)).</p><p>Extending to <b>21 Jan 2026</b> restores the period. It is the client's call, hence the question.</p>`)+decNote(sc,'window')},
  {q:x('Peut-on émettre l’amendement tout de suite ?','Can we issue the amendment right away?'),re:/(émett|emett|issue|tout de suite|right away|now|mt707)/i,needs:1,a:()=>x(`<p>Techniquement oui, mais il créerait deux incohérences : un délai de présentation réduit et un certificat d'assurance exigé sous un Incoterm FOB. Mieux vaut poser les deux questions au client avant d'émettre le MT707.</p><p>Et même émis, l'amendement ne liera le bénéficiaire qu'après son acceptation (UCP 600, art. 10).</p>`,`<p>Technically yes, but it would create two inconsistencies: a shortened presentation period and an insurance certificate required under FOB. Better to ask the client both questions before issuing the MT707.</p><p>And once issued, the amendment only binds the beneficiary after acceptance (UCP 600, art. 10).</p>`)},
  {q:x('Que change l’amendement pour le bénéficiaire ?','What does it change for the beneficiary?'),re:/(bénéficiaire|beneficiary|accept|art\.? ?10|partiel|partial)/i,a:()=>x(`<p>Un crédit irrévocable ne peut être modifié sans l'accord de la banque émettrice, de la banque confirmante s'il y en a une, et du <b>bénéficiaire</b> (UCP 600, art. 10(a)).</p><p>Le bénéficiaire accepte ou refuse l'amendement en bloc : une acceptation partielle vaut refus (art. 10(e)).</p>`,`<p>An irrevocable credit cannot be amended without the agreement of the issuing bank, the confirming bank if any, and the <b>beneficiary</b> (UCP 600, art. 10(a)).</p><p>The beneficiary accepts or rejects the amendment as a whole: partial acceptance counts as rejection (art. 10(e)).</p>`)},
  {q:x('Faut-il vérifier la limite de crédit ?','Should the credit limit be checked?'),re:/(limite|limit|risque|risk|ligne|line|67)/i,needs:1,hl:()=>[['a-amt','hl']],a:sc=>x(`<p>Oui. L'augmentation de <b>67 200 USD</b> (+8 %) consomme de la limite du client. Je n'ai pas accès aux limites : c'est volontairement hors de mon périmètre. Le point reste « à confirmer » tant que vous ne l'avez pas vérifié.</p>`,`<p>Yes. The <b>USD 67,200</b> increase (+8%) uses the client's limit. I have no access to limits, deliberately. The point stays “to confirm” until you have checked it.</p>`)+decNote(sc,'limit')}]};
function qaList(sc){return [GEN.sum].concat(QA[sc.id],[GEN.status,GEN.lim]);}
function pChat(sc){
 return `<div class="chat"><div class="chat-h"><span class="av">LC</span><div><b>${x('Agent LC','LC agent')}</b><small>${x('Orchestré via Power Automate dans le concept · ici réponses scriptées','Orchestrated with Power Automate in the concept · scripted answers here')}</small></div><span class="st"><i></i>${x('Prêt','Ready')}</span></div>
 <div class="log" id="log" aria-live="polite">${sc.st.chat.map(m=>m.me?`<div class="msg me">${esc(m.html)}</div>`:`<div class="msg ai"><div class="bub">${m.html}</div></div>`).join('')}</div>
 <div class="sugg" id="sugg">${qaList(sc).map((k,i)=>`<button type="button" data-act="ask" data-i="${i}" class="${sc.st.asked[i]?'used':''}"${S.busy?' disabled':''}>${k.q}</button>`).join('')}</div>
 <form class="inp" id="form"><input id="q" autocomplete="off" aria-label="${x('Question','Question')}" placeholder="${x('Posez une question sur ce dossier…','Ask something about this file…')}"><button id="send" type="submit"${S.busy?' disabled':''}>${x('Envoyer','Send')}</button></form></div>`;
}
function bindChat(sc){const log=$('#log');log.scrollTop=log.scrollHeight;$('#form').addEventListener('submit',e=>{e.preventDefault();const v=$('#q').value.trim();if(!v)return;$('#q').value='';const list=qaList(sc);let i=list.findIndex(k=>k.re.test(v));ask(sc,v,i);});}
async function ask(sc,text,i){
 if(S.busy)return;S.busy=true;setChatBusy(true);
 const list=qaList(sc),k=list[i];if(i>=0)sc.st.asked[i]=true;
 sc.st.chat.push({me:true,html:text});addMsg(true,esc(text));
 const log=$('#log');let ty=null;if(log){ty=document.createElement('div');ty.className='typing';ty.innerHTML='<i></i><i></i><i></i>';log.appendChild(ty);log.scrollTop=log.scrollHeight;}
 await wait(700);if(ty)ty.remove();
 let html;
 if(!k)html=`<p>${x("Dans cette démo, mes réponses sont scriptées. Je sais répondre aux questions proposées ci-dessous sur ce dossier : essayez l'une d'elles.",'In this demo my answers are scripted. I can answer the suggested questions below about this file: try one of them.')}</p>`;
 else if(k.needs&&!sc.st.analysed)html=`<p>${x("Je n'ai pas encore analysé ce dossier. Lancez l'analyse depuis l'onglet Contrôles, puis reposez la question.",'I have not analysed this file yet. Run the analysis from the Checks tab, then ask again.')}</p><div class="dec" style="margin-top:8px"><button class="btn sm p" data-act="tab" data-tab="checks">${x('Aller aux contrôles','Go to checks')}</button></div>`;
 else{html=k.a(sc);if(k.hl&&S.cur===sc)hl(k.hl(sc));}
 sc.st.chat.push({me:false,html});addMsg(false,html);
 S.busy=false;setChatBusy(false);
 if(S.tab==='chat'){const s=$('#sugg');if(s&&i>=0){const b=s.querySelector('[data-i="'+i+'"]');if(b)b.classList.add('used');}}
}
function addMsg(me,html){const log=$('#log');if(!log||S.tab!=='chat')return;const m=document.createElement('div');m.className='msg new '+(me?'me':'ai');m.innerHTML=me?html:`<div class="bub">${html}</div>`;log.appendChild(m);log.scrollTop=log.scrollHeight;}
function setChatBusy(v){document.querySelectorAll('#sugg button,#send').forEach(b=>b.disabled=v);document.querySelectorAll('#tabs .tab').forEach(t=>v?t.setAttribute('aria-disabled','true'):t.removeAttribute('aria-disabled'));}

/* ----- report ----- */
function reportHTML(sc){
 const st=sc.st,oid=curOut(sc),val=st.status==='done'||st.status==='client';
 const draft=st.drafts[oid]!=null?st.drafts[oid]:buildDraft(sc,oid);
 const res=c=>{const f=fin(sc,c);return f?(f==='ko'?`<span class="r-ko">${sc.type==='amd'?x('Question client','Client question'):x('Réserve','Discrepancy')}</span>`:`<span class="r-ok">${x('OK','OK')}</span>`):`<span class="r-ck">${x('En attente','Pending')}</span>`;};
 const ag=c=>c.v==='ok'?x('Conforme','Compliant'):c.v==='ko'?(sc.type==='amd'?x('Bloquant','Blocking'):x('Réserve','Discrepancy')):x('À confirmer','To confirm');
 const op=c=>{const d=st.dec[c.id];return d?(d==='agree'?x('Confirmé','Confirmed'):x('Infirmé','Overridden')):'—';};
 const kv=[[x('Référence','Reference'),sc.ref],[x("Donneur d'ordre",'Applicant'),sc.app+fict],[x('Bénéficiaire','Beneficiary'),sc.ben+fict],[x('Montant du crédit','Credit amount'),fm(sc.amt,sc.ccy,2)],[sc.type==='amd'?x('Demande reçue le','Request received'):x('Présentation du','Presented on'),fd(sc.recv)],[sc.type==='amd'?x('Délai cible','Target date'):x("Échéance d'examen",'Examination deadline'),fd(sc.dl)],[x('Statut','Status'),STL[st.status]],[x('Issue','Outcome'),val?resText(sc):x('Recommandée : ','Recommended: ')+OUT[oid].lab]];
 let after='';
 if(st.reply&&sc.type==='amd')after=`<h4>${x('MT707 mis à jour après réponse du client','MT707 updated after the client’s reply')}</h4><pre class="sh-draft">${esc(mt707(sc,true))}</pre>`;
 if(st.reply&&sc.type==='pres')after=`<p class="sh-note">${x("Réponse du donneur d'ordre (simulée) : accord pour lever les réserves. Paiement à initier via les outils habituels (hors démo).",'Applicant’s reply (simulated): agrees to waive the discrepancies. Payment to be initiated through the usual tools (outside the demo).')}</p>`;
 return `<div class="sheet" id="sheet"><div class="wm" aria-hidden="true">${x('DÉMO SIMULÉE','SIMULATED DEMO')}</div>
 <div class="sh-top"><div><div class="sh-k">${sc.type==='amd'?x("RAPPORT DE CONTRÔLE · DEMANDE D'AMENDEMENT",'CHECK REPORT · AMENDMENT REQUEST'):x('RAPPORT DE CONTRÔLE DOCUMENTAIRE','DOCUMENTARY CHECK REPORT')}</div><h3>${sc.ref}</h3></div><span class="sh-st ${val?'ok':'dr'}">${val?x('VALIDÉ','VALIDATED')+' · '+st.valAt:x('BROUILLON · NON VALIDÉ','DRAFT · NOT VALIDATED')}</span></div>
 <table class="sh-kv">${kv.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>
 <h4>${x('Checklist des contrôles','Checklist')}</h4>
 <table><thead><tr><th>#</th><th>${x('Contrôle','Check')}</th><th class="hide-s">${x('Agent','Agent')}</th><th class="hide-s">${x('Opérateur','Operator')}</th><th>${x('Résultat','Result')}</th></tr></thead><tbody>${sc.checks.map((c,i)=>`<tr><td>${i+1}</td><td>${c.t}${(st.com[c.id]||[]).map(m=>`<span class="cm">${QT(esc(m.txt))}</span>`).join('')}</td><td class="hide-s">${ag(c)}</td><td class="hide-s">${op(c)}</td><td>${res(c)}</td></tr>`).join('')}</tbody></table>
 <h4>${OUT[oid].dl} · ${val?x('version validée','validated version'):x('brouillon à relire','draft to review')}</h4>
 <pre class="sh-draft" id="draft">${esc(draft)}</pre>${after}
 <p class="sh-foot">${x("Généré par une démo simulée : données fictives, ce n'est pas un outil officiel de Société Générale. Aucun message n'est envoyé automatiquement.","Generated by a simulated demo: fictional data, not an official Société Générale tool. No message is ever sent automatically.")} ${val?x('Validé par ','Validated by ')+WHO.op+x(' (démo) le ',' (demo) on ')+st.valAt+(st.valCom?' · '+QT(esc(st.valCom)):''):''}</p></div>`;
}
function pReport(sc){
 if(!sc.st.analysed)return `<div class="empty"><h3>${x('Rapport non disponible','Report not available yet')}</h3><p>${x("Le rapport (checklist + brouillon de message) est généré après l'analyse, puis mis à jour à chaque décision.",'The report (checklist + draft message) is generated after the analysis, then updated with every decision.')}</p><button class="btn p" data-act="tab" data-tab="checks">${x('Aller aux contrôles','Go to checks')}</button></div>`;
 const lk=sc.st.status==='done';
 return reportHTML(sc)+`<div class="racts"><button class="btn p" data-act="print">${x('Imprimer / exporter en PDF','Print / export to PDF')}</button><button class="btn" data-act="csv">${x('Télécharger la checklist (.csv)','Download the checklist (.csv)')}</button>${lk?'':`<button class="btn" data-act="edit" id="editBtn">${x('Modifier le brouillon','Edit the draft')}</button>`}<button class="btn" data-act="copy">${x('Copier le brouillon','Copy the draft')}</button></div>
 <div class="hitl"><span class="ico" aria-hidden="true">i</span><span>${x("Le brouillon n'est jamais envoyé automatiquement. Les modifications de l'opérateur sont tracées dans le journal.",'The draft is never sent automatically. Operator edits are logged in the audit trail.')}</span></div>`;
}

/* ----- audit ----- */
function pAudit(sc){
 return `<div class="phead"><span class="mut">${x('Qui a fait quoi, et quand. Horodatage simulé, entrées non modifiables.','Who did what, and when. Simulated timestamps, read-only entries.')}</span><button class="btn sm" data-act="csvlog">${x('Exporter le journal (.csv)','Export the log (.csv)')}</button></div>
 <ol class="tl">${sc.st.audit.map(a=>`<li><time>${a.t}</time><span class="who w-${a.who}">${WHO[a.who]}</span><span class="tx">${a.txt}</span></li>`).join('')}</ol>`;
}

/* ---------- validation dialog ---------- */
function openValidate(sc){
 const outs=outcomes(sc),ro=recOut(sc),r=retained(sc),dlg=$('#dlg');
 dlg.innerHTML=`<div class="dlg-b"><h3 id="dlgT">${x('Validation finale','Final validation')} · ${sc.ref}</h3>
 <p>${r.length?x(`${r.length} point(s) retenu(s) après votre revue :`,`${r.length} point(s) kept after your review:`):x('Aucune réserve retenue après votre revue.','No discrepancy kept after your review.')}</p>
 ${r.length?`<ul>${r.map(c=>`<li>${c.t}</li>`).join('')}</ul>`:''}
 <div class="opts" role="radiogroup" aria-label="${x('Issue','Outcome')}">${outs.map(o=>`<label><input type="radio" name="out" value="${o}"${o===ro?' checked':''}><span>${OUT[o].lab}${o===ro?`<span class="rc">${x('RECOMMANDÉ','RECOMMENDED')}</span>`:''}<small>${OUT[o].desc}</small></span></label>`).join('')}</div>
 <label for="vc" class="mut">${x('Commentaire de validation (facultatif)','Validation comment (optional)')}</label><textarea id="vc"></textarea>
 <label class="attest"><input type="checkbox" id="att"><span>${x("J'ai revu chaque point et je prends la décision finale. Aucun message ne partira sans action de ma part.",'I have reviewed every point and I take the final decision. No message will go out without my action.')}</span></label>
 <span class="err mut" id="attErr" hidden style="color:var(--red)">${x('Cochez la case pour confirmer.','Tick the box to confirm.')}</span></div>
 <div class="dlg-f"><button class="btn" data-act="dlg-cancel">${x('Annuler','Cancel')}</button><button class="btn p" data-act="dlg-ok">${x('Valider','Validate')}</button></div>`;
 dlg.showModal();
}
function finalize(sc){
 const dlg=$('#dlg');if(!$('#att').checked){$('#attErr').hidden=false;return;}
 const oid=(dlg.querySelector('input[name=out]:checked')||{}).value||recOut(sc),com=$('#vc').value.trim();dlg.close();
 const st=sc.st;st.outcome=oid;st.valCom=com;st.status=OUT[oid].to;
 audit(sc,'op',x('<b>Validation finale</b> · issue : ','<b>Final validation</b> · outcome: ')+OUT[oid].lab+(com?' · '+QT(esc(com)):''),2);st.valAt=st.audit[st.audit.length-1].t;
 audit(sc,'agent',OUT[oid].dl+x(' figé dans le rapport · envoi via les outils habituels (hors démo), aucun envoi automatique',' locked in the report · sent through the usual tools (outside the demo), never automatically'),0);
 audit(sc,'sys',x('Statut : ','Status: ')+'<b>'+STL[st.status]+'</b>',0);
 S.tab='report';refresh();toast(x('Dossier validé · ','File validated · ')+OUT[oid].res);
}
function clientReply(sc){
 const st=sc.st;st.reply=true;st.status='done';
 if(sc.type==='amd'){const t=[];if(retained(sc).some(c=>c.id==='window'))t.push(x('validité prolongée au 21 janv. 2026','expiry extended to 21 Jan 2026'));if(retained(sc).some(c=>c.id==='inco'))t.push(x('passage en CIF Marseille-Fos','switch to CIF Marseille-Fos'));if(retained(sc).some(c=>c.id==='limit'))t.push(x('accord de limite obtenu','limit approval obtained'));
  audit(sc,'client',x('Réponse du client : ','Client reply: ')+(t.join(', ')||x('confirmation','confirmation')),27);
  audit(sc,'agent',x('MT707 mis à jour avec la réponse du client (brouillon indicatif)','MT707 updated with the client’s reply (indicative draft)'),1);}
 else{audit(sc,'client',x("Réponse du donneur d'ordre : accord pour lever les réserves",'Applicant reply: agrees to waive the discrepancies'),34);
  audit(sc,'op',x('Levée des réserves enregistrée · paiement à initier (hors démo)','Waiver recorded · payment to be initiated (outside the demo)'),2);}
 audit(sc,'sys',x('Statut : ','Status: ')+'<b>'+STL.done+'</b>',0);
 S.tab='report';refresh();toast(x('Réponse client enregistrée','Client reply recorded'));
}

/* ---------- export ---------- */
function download(name,rows){const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/<[^>]+>/g,'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function printReport(){const s=$('#sheet');if(!s)return;const p=$('#print');p.innerHTML='';p.appendChild(s.cloneNode(true));document.body.classList.add('printing');const off=()=>document.body.classList.remove('printing');window.addEventListener('afterprint',off,{once:true});window.print();setTimeout(off,1500);}

/* ---------- toast ---------- */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600);}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,sc=S.cur;
 if(b.getAttribute('aria-disabled')==='true'||b.disabled)return;
 switch(act){
 case 'filter':S.filter=b.dataset.v;renderQueue();break;
 case 'bg':toast(x('Dossier d’arrière-plan : seuls les 4 dossiers « Scénario » sont détaillés dans la démo.','Background file: only the 4 “Scenario” files are detailed in the demo.'));break;
 case 'reset':initState();S.filter='all';S.q='';renderQueue();toast(x('Démo réinitialisée','Demo reset'));break;
 case 'tab':if(S.busy)return;S.tab=b.dataset.tab;S.edit=null;renderTabs();renderPanel();if(!isDesk()){const w=$('.work');if(w)w.scrollIntoView({block:'start',behavior:reduce?'auto':'smooth'});}const tb=$('#tab-'+S.tab);if(tb&&b.classList.contains('tab'))tb.focus();break;
 case 'run':runAnalysis(sc);break;
 case 'src':{const c=sc.checks.find(k=>k.id===b.dataset.id);hl([[b.dataset.f,(fin(sc,c)||c.v)==='ko'?'bad':'hl']],true);break;}
 case 'row':hl([[b.dataset.f,'hl']],true);break;
 case 'bulk':{const ids=sc.checks.filter(c=>c.v==='ok'&&!sc.st.dec[c.id]);ids.forEach(c=>sc.st.dec[c.id]='agree');audit(sc,'op',x(`${ids.length} contrôles conformes confirmés en lot`,`${ids.length} compliant checks confirmed in bulk`),1);recompute(sc);refresh();break;}
 case 'agree':{const c=sc.checks.find(k=>k.id===b.dataset.id);sc.st.dec[c.id]='agree';audit(sc,'op',(c.v==='ko'?x('Réserve retenue : ','Discrepancy kept: '):c.v==='check'?x('Lecture confirmée : ','Reading confirmed: '):x('Contrôle confirmé : ','Check confirmed: '))+'<b>'+c.t+'</b>',1);recompute(sc);refresh();break;}
 case 'ov':case 'com':S.edit={id:b.dataset.id,mode:act==='ov'?'ov':'com'};renderPanel();setTimeout(()=>{const t=$('#ed-'+b.dataset.id);if(t)t.focus();},0);break;
 case 'cancel':S.edit=null;renderPanel();break;
 case 'save':{const id=b.dataset.id,c=sc.checks.find(k=>k.id===id),v=($('#ed-'+id).value||'').trim();
  if(!v){const er=$('#err-'+id);if(S.edit.mode==='ov'){er.hidden=false;$('#ed-'+id).focus();return;}S.edit=null;renderPanel();return;}
  (sc.st.com[id]=sc.st.com[id]||[]).push({t:stamp(1),txt:v});
  if(S.edit.mode==='ov'){sc.st.dec[id]='override';audit(sc,'op',(c.v==='ko'?x('Réserve écartée : ','Discrepancy dismissed: '):c.v==='check'?x('Lecture infirmée : ','Reading rejected: '):x('Réserve ajoutée : ','Discrepancy raised: '))+'<b>'+c.t+'</b> · '+x('motif','reason')+CL+' '+QT(esc(v)),0);}
  else audit(sc,'op',x('Commentaire sur ','Comment on ')+'<b>'+c.t+'</b>'+CL+' '+QT(esc(v)),0);
  S.edit=null;recompute(sc);refresh();break;}
 case 'undo':{const c=sc.checks.find(k=>k.id===b.dataset.id);delete sc.st.dec[c.id];audit(sc,'op',x('Décision annulée : ','Decision undone: ')+'<b>'+c.t+'</b>',1);recompute(sc);refresh();break;}
 case 'validate':openValidate(sc);break;
 case 'dlg-cancel':$('#dlg').close();break;
 case 'dlg-ok':finalize(sc);break;
 case 'reply':clientReply(sc);break;
 case 'ask':ask(sc,qaList(sc)[+b.dataset.i].q,+b.dataset.i);break;
 case 'print':audit(sc,'op',x('Rapport imprimé / exporté en PDF','Report printed / exported to PDF'),1);printReport();break;
 case 'csv':download(sc.ref+'-checklist.csv',[['#',x('Contrôle','Check'),x('Règle','Rule'),x('Constat agent','Agent finding'),x('Décision opérateur','Operator decision'),x('Résultat','Result'),x('Commentaires','Comments')]].concat(sc.checks.map((c,i)=>[i+1,c.t,c.rule,c.v,sc.st.dec[c.id]||'',fin(sc,c)||'pending',(sc.st.com[c.id]||[]).map(m=>m.txt).join(' | ')])));audit(sc,'op',x('Checklist exportée (.csv)','Checklist exported (.csv)'),1);renderTabs();break;
 case 'csvlog':download(sc.ref+'-audit.csv',[[x('Horodatage','Timestamp'),x('Acteur','Actor'),x('Action','Action')]].concat(sc.st.audit.map(a=>[a.t,WHO[a.who],a.txt])));break;
 case 'edit':{const d=$('#draft');if(d.isContentEditable){d.contentEditable='false';b.textContent=x('Modifier le brouillon','Edit the draft');}else{d.contentEditable='true';d.focus();b.textContent=x('Terminer la modification','Finish editing');
  d.addEventListener('blur',()=>{const oid=curOut(sc),txt=d.innerText;const base=sc.st.drafts[oid]!=null?sc.st.drafts[oid]:buildDraft(sc,oid);if(txt.trim()!==base.trim()){sc.st.drafts[oid]=txt;audit(sc,'op',x('Brouillon modifié par l’opérateur','Draft edited by the operator'),1);renderTabs();}},{once:true});}break;}
 case 'copy':{const d=$('#draft');const txt=d?d.innerText:'';(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(x('Brouillon copié','Draft copied'))).catch(()=>toast(x('Copie impossible dans ce navigateur','Copy not available in this browser')));break;}
 }
});
document.addEventListener('keydown',e=>{
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-act="bg"],tr[data-act="row"]')){e.preventDefault();e.target.click();}
 if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&e.target.classList.contains('tab')){const ts=[...document.querySelectorAll('#tabs .tab')];const i=ts.indexOf(e.target);const n=ts[(i+(e.key==='ArrowRight'?1:-1)+ts.length)%ts.length];n.click();}
});
document.addEventListener('mouseover',e=>{if(!S.cur||!isDesk())return;const f=e.target.closest('.f[data-id]');if(!f||f===S.hov)return;S.hov=f;const c=S.cur.checks.find(k=>k.id===f.dataset.id);if(c)hl(srcHl(S.cur,c));});
$('#dlg').addEventListener('cancel',()=>{});

route();
})();
</script>
